# debug —— 临时调试工作流
#
# ★★ 这是【临时】的。用完了删掉。
#
# ## 它为什么存在
#
# bootstrap.yml 一次建 58 个包、跑 50 分钟，而且在【第一个失败处就停】。于是
# 排查一个包要 50 分钟，一次还只能看到一个失败。
#
# 但被排查的往往只是其中一步。而 `skirt bootstrap` **支持指定目标**——它只建
# 那些包和它们的依赖闭包（实测闭包大小）：
#
#     ./skirt/skirt bootstrap openssl     3 个包     ~2 分钟
#     ./skirt/skirt bootstrap shadow      15 个包
#     ./skirt/skirt bootstrap openssh     19 个包
#     ./skirt/skirt bootstrap（不给目标）  61 个包     ~50 分钟
#
# 所以「用 bootstrap 调一个包」这件事本身是可行的，缺的只是把目标选择暴露出来。
#
# ## 用法
#
#     targets  要建的包（空格分隔）。会连依赖闭包一起建，顺序由 skirt 推导。
#     script   建完后跑的一段诊断 shell。产物会按和 skirt 一样的方式铺进容器。
#
# ## 两个踩过的坑
#
# ① 别用 `skirt build X` 代替 `skirt bootstrap X`。`build` 【不建依赖】——
#    它要求依赖已经建好，否则直接报「依赖 libxcrypt 还没有构建」。第一次派发
#    就撞在这上面，56 秒失败（快是快，但什么都没验到）。
#
# ② `--keep-going` 不存在。想让一个包失败也继续建后面的，得先给 skirt 加上。
#
# ## 为什么不用本地 docker
#
# 本地是 macOS（arm64），只能跑 aarch64，x86_64 那条腿根本没法验。CI 上两个
# 架构都是原生的，而且快。

name: debug

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 架构
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
      targets:
        description: 要建的包（空格分隔，只建它们和依赖闭包）
        type: string
        required: true
      script:
        description: 建完后跑的诊断脚本（可空）
        type: string
        default: ""
      buildenv:
        description: 构建环境镜像名（裸名，不带 tag）
        type: string
        default: ""

permissions:
  contents: read

jobs:
  debug:
    name: debug (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120
    env:
      ARCH: ${{ inputs.arch }}
      TARGETS: ${{ inputs.targets }}
      # ★ 裸镜像名，不带 tag——skirt 自己会补 :<arch>（见 skirtlib/build.py）。
      SKIRT_BUILDENV: ${{ inputs.buildenv != '' && inputs.buildenv || 'yojigenos/buildenv' }}

    steps:
      - name: 取 packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 建构建环境镜像
        run: |
          set -euo pipefail
          docker build -t "yojigenos/buildenv:${ARCH}" bootstrap
          docker run --rm "yojigenos/buildenv:${ARCH}" sh -c \
            'grep -E "^VERSION=" /etc/os-release; echo "  debian_version: $(cat /etc/debian_version)"' \
            | sed 's/^/  /'

      # ── 建目标 ────────────────────────────────────────────────────────────
      - name: 建 ${{ inputs.targets }}
        id: bootstrap
        run: |
          set -euo pipefail

          echo "::group::闭包"
          ./skirt/skirt order $TARGETS 2>&1 | tail -30
          echo "::endgroup::"

          set +e
          ./skirt/skirt bootstrap --arch "$ARCH" $TARGETS
          RC=$?
          set -e

          echo "退出码 $RC"
          echo "产物: $(ls -1 var/pkgs/${ARCH}/*.apk 2>/dev/null | wc -l | tr -d ' ') 个 apk"
          exit $RC

      # ── 诊断 ──────────────────────────────────────────────────────────────
      - name: 诊断
        if: always() && inputs.script != ''
        env:
          # ★ 脚本走环境变量，不用 heredoc。
          #
          #   写成 `cat > f <<'DIAG'` 加一个缩进的 DIAG 是【坏的】：
          #   ${{ inputs.script }} 展开出来在行首，而终止符缩进了，heredoc
          #   不会结束——整段被当成脚本内容，然后报一个和真正问题毫无关系
          #   的错。
          DIAG: ${{ inputs.script }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIAG" > /tmp/diag.sh

          echo "::group::诊断脚本"
          cat /tmp/diag.sh
          echo "::endgroup::"

          # 用和 skirt 一样的方式把产物铺进容器，再跑脚本。
          #
          # ★ 排除项必须和 build.py 里那套【逐字一致】（bin sbin lib lib64
          #   usr/lib64），否则这里看到的环境和构建时看到的不一样——那这个
          #   诊断就是在骗自己。
          docker run --rm \
            -v "$PWD/var/output/${ARCH}:/out:ro" \
            -v /tmp/diag.sh:/diag.sh:ro \
            "yojigenos/buildenv:${ARCH}" \
            sh -c '
              set -e
              n=0
              for p in $(ls -d /out/*/payload 2>/dev/null); do
                tar -C "$p" -cf - \
                    --exclude=./bin --exclude=./sbin --exclude=./lib \
                    --exclude=./lib64 --exclude=./usr/lib64 . 2>/dev/null \
                  | tar -C / -xf - 2>/dev/null && n=$((n+1)) || true
              done
              echo "── 已合并 $n 个 payload ──"
              echo
              sh /diag.sh
            ' 2>&1 | tee /tmp/diag.out
          echo "::endgroup::"

      # ── 传日志和产物 ──────────────────────────────────────────────────────
      #
      # ★ 连 var/pkgs 一起传。bootstrap.yml 只传日志，所以上一轮建出来的
      #   .apk 拿不到——任何「接着上一轮继续」的调试都做不了。
      - name: 收集
        if: always()
        run: |
          mkdir -p var/logs
          echo "日志 $(ls var/logs 2>/dev/null | wc -l) 个，apk $(ls var/pkgs/${ARCH}/*.apk 2>/dev/null | wc -l) 个"

      - name: 传日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-logs-${{ inputs.arch }}
          path: var/logs
          if-no-files-found: ignore
          retention-days: 3

      - name: 传 apk
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-pkgs-${{ inputs.arch }}
          path: var/pkgs/${{ inputs.arch }}
          if-no-files-found: ignore
          retention-days: 3
