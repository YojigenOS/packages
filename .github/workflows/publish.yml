name: publish

# 手动触发。发版是一个动作，不是一个副作用——写成 on: push 的话，
# 每提交一次代码就推一个镜像，edge 立刻退化成流水账，
# 「这一版是什么」这个信息就没了。
on:
  workflow_dispatch:
    inputs:
      selfhost:
        description: '跑自举验证（再建一轮，和这一轮比对。会让总时长翻倍）'
        type: boolean
        default: true

# 显式收紧 GITHUB_TOKEN 的权限——工作流里的第三方代码（action）能拿到它，
# 权限越小越好。
permissions:
  contents: read


jobs:
  # ==========================================================================
  # 一、把每个架构的构建环境建出来并发布
  # ==========================================================================
  #
  # 【为什么每个架构是完整独立的一条链】
  #
  # 这不是「多架构镜像」，是「多平台容器」。aarch64 的产物在 x86_64 上一个都
  # 用不上——每个架构都要从 Debian 底的 buildenv 出发，走完整的 41 步引导。
  # 这也正是我们不需要交叉编译工具链的原因。
  #
  build:
    strategy:
      fail-fast: false          # 一个架构挂了，另一个照跑完——它的日志有诊断价值
      matrix:
        include:
          # 显式 pin 版本，不用 ubuntu-latest：它是个移动别名，
          # 构建环境会静默变化；而且它只跟踪 x64 镜像。
          #
          # 这些 runner 只在公开仓库可用，私有仓库里加了会直接失败。
          - arch: aarch64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
          - arch: x86_64
            runner: ubuntu-26.04
            platform: linux/amd64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      # 源码和编译缓存可以跨运行复用——它们不影响「这次构建到底建了什么」。
      # 【产物 output/ 故意不缓存】：那正是每次要重新证明的东西。
      - name: 缓存源码与 ccache
        uses: actions/cache@v4
        with:
          path: |
            cache
            ccache
          key: src-${{ matrix.arch }}-${{ hashFiles('packages/**/spec.toml') }}
          restore-keys: src-${{ matrix.arch }}-

      - name: 用满整台 runner 的核
        run: |
          # skirt 默认留两个核给用户——那是给开发机的体贴，在 CI 上就是浪费。
          echo "SKIRT_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "并行度: -j$(nproc)"

      - name: 建 Debian 底的构建环境
        run: |
          # Dockerfile 是 FROM debian:stable-slim——架构中立，
          # 在哪台 runner 上建就是哪个架构的。
          docker build -t yojigenos/buildenv:${{ matrix.arch }} tools/buildenv

      # ★ 构建环境【建完就推】，不等引导。
      #
      # 两个理由：
      #
      # 1. 它是「从零开始」的起点，本身就有价值——任何人拉下它跑一次
      #    bootstrap 就能重建整个系统。它不该被后面某一步的失败拖着。
      # 2. 实测：x86_64 的引导一直失败，于是构建环境的推送也一直被跳过，
      #    本地想复现都拿不到 amd64 的构建环境。**一个已经成功的东西，
      #    不该因为下游失败而拿不到。**
      - name: 推送构建环境
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::secret DOCKER_HUB_TOKEN 是空的"
            exit 1
          fi
          echo "$DOCKER_HUB_TOKEN" | docker login -u yojigenos --password-stdin
          docker push "yojigenos/buildenv:${{ matrix.arch }}"

      # 【这一步是整条流水线的核心】
      #
      # 以前这里写的是 `skirt rootfs` 加一串硬编码的包名 ✗ ——它假设产物
      # 已经存在，而 CI 是干净环境，output/ 不在那里。所以它从来没跑通过。
      #
      # 现在是一条完整的链：从 Debian 底出发，把 41 个包全建出来。
      # 顺序不是写着的，是从配方的依赖关系算出来的（skirt order）。
      - name: 引导 —— 建出全部包
        id: bootstrap
        run: |
          ./tools/skirt order | head -50
          # bootstrap 失败时非零退出（这是它该做的）。但我们要先把日志传出去，
          # 所以这里不让它中断，改成记下结论、后面再失败。
          ./tools/skirt bootstrap --report || echo "bootstrap_failed=1" >> "$GITHUB_OUTPUT"

      # ★ 失败那一刻就把日志拿到手。
      #
      # 以前只能等整个 job 结束再用 gh api 取日志——实测被卡过两次，一次等了
      # 20 分钟。而 cmd_bootstrap 只打印失败包的【最后 8 行】，那点信息往往
      # 不够（libxcrypt 那次就只看到 libtoolize 的输出，真正的错误在更上面）。
      #
      # 所以：把每个包的完整日志和失败包的尾部一起传出来。传不出去也没关系
      # ——如果这一步自己失败，才轮到后面那步报错。
      # ★ 必须先把日志抄进工作区：upload-artifact 只认工作区里的路径，
      # 给 /tmp 会被拒绝——实测 aarch64 那轮【引导成功了】却因为这一步失败
      # 让整个 job 挂掉，连带 selfhost 被跳过。
      - name: 收集构建日志
        if: always()
        run: |
          # skirt bootstrap 把每个包的完整输出写在 build-logs/。
          # （以前这里抄的是 /tmp——而 skirt 从来不往 /tmp 写任何东西，
          #   所以 artifact 一直是空的。见 cmd_bootstrap 里的注释。）
          mkdir -p build-logs
          ls -la build-logs/ | head -20
          echo "共 $(ls build-logs/ 2>/dev/null | wc -l) 个包的日志"

      - name: 上传构建日志
        if: always()
        continue-on-error: true      # 日志是诊断手段，不该让整个 job 失败
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 引导失败了就停在这里
        if: steps.bootstrap.outputs.bootstrap_failed == '1'
        run: |
          echo "::error::引导失败。完整日志见这个 job 的 build-logs-${{ matrix.arch }} artifact。"
          exit 1

      - name: 拼出 base-devel 镜像
        run: |
          ./tools/skirt image base-devel
          ls -lh output/${{ matrix.arch }}/yojigenos-base-devel-${{ matrix.arch }}.tar.gz

      - name: 导入并打标签
        id: image
        env:
          # GitHub 提供这两个；runner 镜像变了要能在产物里查出来。
          # 这正是 Debian 的 .buildinfo 在做的事（见待办 3.3）。
          IMAGE_OS: ${{ runner.os }}
          IMAGE_VERSION: ${{ runner.arch }}
        run: |
          # 用【这轮运行的起始时间】而不是"现在"：一轮要跑约两小时，跨了
          # UTC 午夜的话，manifest job 那份「现在」就会是另一个日期，
          # 于是它去找 base-devel:<另一个日期>-<arch>，找不到就失败。
          # 一处事实，两处引用。
          DATE=$(date -u -d "${{ github.run_started_at }}" +%Y.%m.%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          ARCH=${{ matrix.arch }}
          TARBALL=output/$ARCH/yojigenos-base-devel-$ARCH.tar.gz

          # 用 docker import 而不是 build：产物是个 rootfs tar，没有 Dockerfile。
          # --change 让它带上 LABEL——tag 是接口，LABEL 是注释（见 0003）。
          docker import \
            --change "LABEL org.yojigenos.arch=$ARCH" \
            --change "LABEL org.yojigenos.runner-image=$IMAGE_VERSION" \
            "$TARBALL" "yojigenos/base-devel:edge-$ARCH"
          docker tag "yojigenos/base-devel:edge-$ARCH" \
                     "yojigenos/base-devel:$DATE-$ARCH"

          echo "--- 镜像 ---"
          docker images yojigenos/base-devel --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      # 推送前先证明它真的能用。宁可发现推不出去，也不要推出去一个坏的。
      - name: 验证镜像能构建软件
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            yojigenos/base-devel:edge-${{ matrix.arch }} /bin/bash -c '
            set -e
            printf "#include <stdio.h>\nint main(void){puts(\"ok\");return 0;}\n" > /tmp/t.c
            gcc /tmp/t.c -o /tmp/t
            /tmp/t
            gcc --version | head -1
          '

      # 把这一轮的 tar 传下去给自举验证比对。它同时也是「这一版到底是什么」
      # 的直接证据——比镜像层摘要更直白。
      - name: 上传产物供比对
        uses: actions/upload-artifact@v4
        with:
          name: base-devel-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/yojigenos-base-devel-${{ matrix.arch }}.tar.gz
          retention-days: 14

      - name: 推送 buildenv 与 base-devel
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          # secret 名字写错不会报错，只会静默变成空字符串，然后在
          # docker login 那里以一个看不懂的方式失败。先挡一道，
          # 把"名字错了"和"网络不通"这两种失败区分开。
          if [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::secret DOCKER_HUB_TOKEN 是空的——名字写错了，或者还没配置"
            exit 1
          fi

          ARCH=${{ matrix.arch }}
          echo "$DOCKER_HUB_TOKEN" | docker login -u yojigenos --password-stdin

          # buildenv 也发。它是「从零开始」的起点：任何人拉下它，
          # 跑一次 skirt bootstrap 就能重建整个系统。
          docker push "yojigenos/buildenv:$ARCH"
          docker push "yojigenos/base-devel:edge-$ARCH"
          docker push "yojigenos/base-devel:${{ steps.image.outputs.date }}-$ARCH"

  # ==========================================================================
  # 二、自举验证 —— 用刚发布的构建环境，再建一轮
  # ==========================================================================
  #
  # 【为什么这一步才是自举的完成】
  #
  # 上面那一轮，构建环境是 Debian 底的 buildenv——「我们的系统是在 Debian 里
  # 生出来的」。这一步换成【刚发布的 base-devel】，再跑一遍同一条命令：
  #
  #     用 base-devel 能构建出 base-devel 本身
  #
  # 跑通了，这条路才闭合（docs/决策记录/0011）。而且跑通之后，构建环境不再
  # 依赖任何本机产物——任何人都能从 registry 拉下来继续，这才是「发布」真正
  # 解决的问题。
  #
  # 【关于逐字节比对】第一轮和第二轮【不会】完全一致：第一轮里编译器、汇编
  # 器这些工具自己是 Debian 的工具编出来的，第二轮才是自己的。真正的固定点
  # 要看第二轮和第三轮。所以这里只报告差异，不作为失败条件——它是个成熟度
  # 指标，不是门禁。
  selfhost:
    needs: build
    # ★ 不能用默认的「needs 成功才跑」。
    #
    # 矩阵里只要有【一条腿】失败，默认行为就是把整个 job 跳过——实测
    # aarch64 的构建成功过三次，而自举验证一次都没跑过，因为 x86_64 那条
    # 腿一直失败。**一半的成功被另一半的失败否掉了。**
    #
    # 改成 !cancelled()：谁成功就用谁。没成功的那条腿会在「拉取构建环境」
    # 那一步失败，但那不影响另一条腿。
    if: ${{ !cancelled() && inputs.selfhost }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-26.04-arm
          - arch: x86_64
            runner: ubuntu-26.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: 拉取刚发布的构建环境
        run: |
          docker pull "yojigenos/base-devel:edge-${{ matrix.arch }}"
          docker tag "yojigenos/base-devel:edge-${{ matrix.arch }}" \
                     "yojigenos/base-devel:${{ matrix.arch }}"

      - name: 取回第一轮的产物
        uses: actions/download-artifact@v4
        with:
          name: base-devel-${{ matrix.arch }}
          path: before

      - name: 用满整台 runner 的核
        run: echo "SKIRT_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: 缓存源码与 ccache
        uses: actions/cache@v4
        with:
          path: |
            cache
            ccache
          key: src-${{ matrix.arch }}-${{ hashFiles('packages/**/spec.toml') }}
          restore-keys: src-${{ matrix.arch }}-

      # ★ 唯一的区别就是这一行 SKIRT_BUILDENV。
      #   命令、顺序、配方全都没变——变的只是「谁来当构建环境」。
      - name: ★ 用我们自己的系统再建一轮
        id: selfhost
        env:
          SKIRT_BUILDENV: yojigenos/base-devel
        run: |
          ./tools/skirt bootstrap --report || echo "bootstrap_failed=1" >> "$GITHUB_OUTPUT"

      - name: 收集构建日志
        if: always()
        run: |
          ls -la build-logs/ 2>/dev/null | head -20

      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-logs-${{ matrix.arch }}
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 自举失败了就停在这里
        if: steps.selfhost.outputs.bootstrap_failed == '1'
        run: |
          echo "::error::自举失败。完整日志见 selfhost-logs-${{ matrix.arch }} artifact。"
          exit 1

      - name: 和上一轮比对
        run: |
          ARCH=${{ matrix.arch }}
          ./tools/skirt image base-devel
          NEW=output/$ARCH/yojigenos-base-devel-$ARCH.tar.gz

          echo "### 自举验证 [$ARCH]" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l "$NEW" >> "$GITHUB_STEP_SUMMARY"

          # 和第一轮那份比。两边都是 rootfs tar，可以直接比 sha256。
          # （不能拿 docker save 的输出比——那是另一种格式。）
          printf '%s\n' "第一轮（构建环境是 Debian 底）: $(sha256sum before/yojigenos-base-devel-$ARCH.tar.gz | cut -d' ' -f1)"
          printf '%s\n' "第二轮（构建环境是我们自己）  : $(sha256sum "$NEW" | cut -d' ' -f1)"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if cmp -s "before/yojigenos-base-devel-$ARCH.tar.gz" "$NEW"; then
            echo "::notice::★ $ARCH 两轮逐字节一致——固定点已经到了。"
          else
            echo "::notice::$ARCH 自举跑通了。两轮不一致是【预期】的：第一轮里 gcc/binutils 这些工具自己是 Debian 的工具编出来的，第二轮才是自己的。真正的固定点要看第二和第三轮。"
          fi

  # ==========================================================================
  # 三、合成多架构清单
  # ==========================================================================
  #
  # 用户写 FROM yojigenos/base-devel 时，Docker 按平台自动选——这正是 0003
  # 说的「tag 是接口」。
  manifest:
    needs: [build]
    runs-on: ubuntu-26.04         # 只做 manifest 操作，什么架构都行
    steps:
      - name: 从 Docker Hub 取凭据
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_HUB_TOKEN" ]; then
            echo "::error::secret DOCKER_HUB_TOKEN 是空的"
            exit 1
          fi
          echo "$DOCKER_HUB_TOKEN" | docker login -u yojigenos --password-stdin

      - name: 合成清单
        run: |
          # 和 build job 用同一个来源（见那里的注释）
          DATE=$(date -u -d "${{ github.run_started_at }}" +%Y.%m.%d)
          for TAG in edge "$DATE"; do
            docker manifest create "yojigenos/base-devel:$TAG" \
              --amend "yojigenos/base-devel:$TAG-aarch64" \
              --amend "yojigenos/base-devel:$TAG-x86_64"
            docker manifest push "yojigenos/base-devel:$TAG"
            echo "--- $TAG ---"
            docker manifest inspect "yojigenos/base-devel:$TAG" | head -30
          done
