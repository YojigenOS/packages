# ★ 临时工作流，用完删掉（packages/AGENTS.md 允许这么做）。
#
# 它只回答一个问题：**同一个工具链、不同的镜像 ID → 产物是否逐字节相同？**
#
# 答案决定 §「增量」那一条怎么改：
#   相同  → `build_key` 里的 `buildenv`（镜像 Id）可以换成工具链指纹，
#           于是"换镜像"不再让 90 个包全量重建
#   不同  → 不能换，镜像 Id 必须留着（那说明镜像里还有别的东西影响产物）
#
# 做法：拿 devel 镜像 commit 出一个【工具链完全一样、Id 不同】的副本，
# 用它和原件各建一次 `hello`，比 .apk 的 sha256 和 build_key 的 parts。
name: probe-toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: YojigenOS/distro
          path: .distro

      - name: 拉构建环境，并造一个「同工具链、不同 Id」的副本
        run: |
          set -euo pipefail
          docker pull yojigenos/devel:edge-x86_64
          docker tag yojigenos/devel:edge-x86_64 yojigenos/devel:x86_64
          echo "原件 Id: $(docker image inspect --format '{{.Id}}' yojigenos/devel:x86_64)"

          # 只加一个标记文件 —— 内容变了（所以 Id 变），工具链一个字没动
          docker run --name probe yojigenos/devel:x86_64 \
            /bin/sh -c 'printf probe > /etc/.toolchain-probe'
          docker commit --change 'CMD ["/bin/bash"]' probe probe-img >/dev/null
          docker rm -f probe >/dev/null
          docker tag probe-img probe:x86_64
          echo "副本 Id: $(docker image inspect --format '{{.Id}}' probe:x86_64)"

      - name: 证明两个镜像的工具链一样
        run: |
          set -euo pipefail
          for img in yojigenos/devel:x86_64 probe:x86_64; do
            echo "── $img ──"
            docker run --rm "$img" /bin/sh -c '
              gcc --version | head -1
              ld --version | head -1
              /lib64/ld-linux-x86-64.so.2 --version 2>&1 | head -1
              apk list -I 2>/dev/null | grep -cE "^"' || true
          done

      - name: 算出 PROVIDES（不然 hello 会去建 glibc）
        run: |
          set -euo pipefail
          # .distro 那边要放在 distro/ 才和本地布局一致
          mv .distro distro
          DEVEL=$(python3 -c "
          import tomllib,pathlib
          v=tomllib.loads(pathlib.Path('distro/variants/devel.toml').read_text())['variant']
          print(' '.join(v['packages']))")
          # ★ provides 是【一行一个】，而 GITHUB_ENV 只认单行 —— 第一版直接把
          #   多行塞进去，报的是 `Invalid format 'automake'`（第二个包名）。
          #   压成空格分隔的一行。
          CLOSURE=$(./skirt/skirt provides $DEVEL | tr '\n' ' ' | sed 's/ *$//')
          echo "闭包 $(echo $CLOSURE | wc -w) 个"
          echo "SKIRT_PROVIDES=$CLOSURE" >> "$GITHUB_ENV"

      - name: 用原件建一次 hello
        run: |
          set -euo pipefail
          # ★ `build` 只产出 payload 目录，`.apk` 是 `pack` 打的。
          #   第一版漏了 pack，于是 find 找不到文件、报 `sha256sum: ''` ——
          #   而那看起来像"产物没生成"。
          SKIRT_BUILDENV=yojigenos/devel ./skirt/skirt build hello --arch x86_64
          SKIRT_BUILDENV=yojigenos/devel ./skirt/skirt pack hello --arch x86_64
          # ★ .apk 在 var/pkgs/<架构>/，不是 var/output/（后者是 payload）。
          #   而【空值守卫是必须的】：第一版找不到文件时 A 是空的，于是
          #   "" = "" 成立、打出"逐字节相同" —— 一个空检查给出的假结论。
          A=$(find var/pkgs/x86_64 -name 'hello-*.apk' | head -1)
          if [ -z "$A" ]; then echo "✗ 没找到 .apk"; find var -name '*.apk' | head; exit 1; fi
          echo "APK_A=$(sha256sum "$A" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "── 产物与 meta.json 实际在哪 ──"
          find var/output -name "*.apk" | head -3
          M=$(find var/output -name meta.json | head -1)
          echo "meta: $M"
          if [ -n "$M" ]; then
            python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["parts"], indent=2, ensure_ascii=False))' "$M" || cat "$M"
          else
            echo "（没找到 meta.json）"
          fi

      - name: 用副本建一次 hello
        run: |
          set -euo pipefail
          # ★ `build` 只产出 payload 目录，`.apk` 是 `pack` 打的。
          #   第一版漏了 pack，于是 find 找不到文件、报 `sha256sum: ''` ——
          #   而那看起来像"产物没生成"。
          SKIRT_BUILDENV=probe ./skirt/skirt build hello --arch x86_64
          SKIRT_BUILDENV=probe ./skirt/skirt pack hello --arch x86_64
          # ★ .apk 在 var/pkgs/<架构>/，不是 var/output/（后者是 payload）。
          #   而【空值守卫是必须的】：第一版找不到文件时 A 是空的，于是
          #   "" = "" 成立、打出"逐字节相同" —— 一个空检查给出的假结论。
          A=$(find var/pkgs/x86_64 -name 'hello-*.apk' | head -1)
          if [ -z "$A" ]; then echo "✗ 没找到 .apk"; find var -name '*.apk' | head; exit 1; fi
          echo "APK_B=$(sha256sum "$A" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "── 产物与 meta.json 实际在哪 ──"
          find var/output -name "*.apk" | head -3
          M=$(find var/output -name meta.json | head -1)
          echo "meta: $M"
          if [ -n "$M" ]; then
            python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["parts"], indent=2, ensure_ascii=False))' "$M" || cat "$M"
          else
            echo "（没找到 meta.json）"
          fi

      - name: 比
        run: |
          set -euo pipefail
          echo "（buildenv 那一项两次应当不同，而产物应当相同）"
          echo "原件: $APK_A"
          echo "副本: $APK_B"
          # ★ 两个都得有值。否则 "" = "" 会成立，而这个实验的全部意义就没了。
          if [ -z "$APK_A" ] || [ -z "$APK_B" ]; then
            echo "✗ 有一个是空的 —— 这个结论不能采信"
            exit 1
          fi
          if [ "$APK_A" = "$APK_B" ]; then
            echo "★ 结论：产物逐字节相同 —— 镜像 Id 不是产物的一部分，可以换成工具链指纹"
          else
            echo "★★ 结论：产物不同 —— 镜像 Id 必须留在 build_key 里（镜像里还有别的东西影响产物）"
            exit 1
          fi
