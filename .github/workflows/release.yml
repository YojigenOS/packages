# 打包 + 签名 + 发布
#
# 建一个包，打成 .apk，签名，生成仓库索引，推到 repo.os.yojigen.cn。
#
# ── 用我们自己的 devel 镜像建，不借 Debian ───────────────────────────────
#
# bootstrap.yml 用的是 FROM debian:stable-slim 的构建环境——那是【借来的
# 起点】，用来做第一次引导（那时我们还没有自己的系统）。
#
# 这个 workflow 不同：它用 yojigenos/base-devel，那是用我们自己那套建出来的
# glibc 系统。所以它是「用我们自己的系统建我们自己的包」这条路上的一步。
#
# 拉的是 Docker Hub 上已发布的镜像（由 distro 从 apk 仓库组装后推上去的）。
# SKIRT_BUILDENV 这一行就是全部的区别——命令、顺序、配方都没变，
# 变的只是「谁来当构建环境」。
#
# ★ 两个 workflow 的分工：bootstrap 建【全部】、从零开始；release 建【指定的
#   一组】、用已经建好的环境。发布那几段的实现都在 scripts/ 里，两边只是调。
#
# ── 建哪些包 ──────────────────────────────────────────────────────────────
#
# 由输入决定，默认 hello。它是个探针：构建依赖只有 gettext / gcc / make，
# 而这三样 base-devel 里都有——所以【不需要先建任何东西】，十几秒就好。
#
# ★ 不是 bootstrap 全量。建 50 个包要两小时，而且其中大部分（gcc、python3、
#   linux、cmake）是【建 base-devel 镜像】需要的，不是这里需要的。
#   「要建哪些包」的答案是「看要交付什么」，不是「全建一遍」。
#
# ── 可以分批跑，一轮失败不用从头再来 ──────────────────────────────────────
#
# 建一批包可能要几十分钟，而【循环在第一个失败处就停】。所以做了两件事让它可续：
#
#   1. var/pkgs/<arch> 进 actions/cache —— 下一轮把上一轮的 .apk 捞回来
#   2. 建包循环跳过已经有 .apk 的 —— 不重做建过的
#
# 于是要建一大批的时候可以拆成几次派发，每次挑一段。比如：
#
#     gh workflow run release.yml -f arch=x86_64 -f deploy=true \
#        -f check_flavor= -f packages="m4 autoconf automake libtool ..."
#
# ★ 分批的时候 check_flavor 要【留空】。
#
#   因为索引是从 var/pkgs 生成的，而分批时它还不全——自检去装一个风味会报
#   「no such package」，而那不是构建失败，是"还没建完"。留空就只检查
#   「这一轮让我建的包都产出了」。
#
#   全部建齐之后再跑一次（那时所有包都会被跳过，几秒钟），带上
#   check_flavor=base-devel 做完整验收。
#
# ── 签名为什么必须在这里 ──────────────────────────────────────────────────
#
# 密钥在 organization secret（SIGNING_KEY）里。本地只有副本，而"能签名的地方"
# 应该是受控的、每次都可复现的那一处。

name: release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要发布的包（空格分隔）'
        required: true
        default: 'hello'
      arch:
        description: '架构'
        required: true
        type: choice
        options: [aarch64, x86_64]
        default: aarch64
      deploy:
        description: '真的推送到 repo.os.yojigen.cn（不勾就是干跑）'
        required: false
        type: boolean
        default: false
      check_flavor:
        description: '自检装哪个风味（留空则只检查包有没有建出来）'
        required: false
        default: 'base'
      seed_run:
        description: '从哪一次运行的 repo-<arch> 产物播种（run id；留空不播种）'
        required: false
        default: ''

# ★ 仓库的默认 token 权限是 `read`，而那个只给 contents + packages。
#   下载 artifact 要 `actions: read`——不给的话"从上一轮播种"那一步会 403。
permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    # ★ 60 分钟不够。实测建 46 个包（含 gcc）在 60 分钟时被砍掉——那还是
    #   【冷构建】。ccache 缓存热起来之后会快很多，但第一次仍然要很久，
    #   而缓存失效/换架构时又会回到冷状态。所以按冷构建留余量。
    #
    #   历史数据：17 个包热缓存 1 分 32 秒，冷构建 12 分 49 秒。
    timeout-minutes: 180

    env:
      # ★ ccache 缓存放【工作区内】，这样 actions/cache 能直接缓存它。
      #
      #   skirt 默认把 ccache 放仓库的父目录（ROOT.parent / "ccache"），
      #   那是为了本地开发时多个仓库共用一个缓存。但在 CI 里父目录是
      #   workspace 之外，缓存起来别扭。SKIRT_CCACHE 就是为这种情况留的。
      SKIRT_CCACHE: ${{ github.workspace }}/.ccache

    steps:
      - name: 取 packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 公钥在 distro 里——它是"会烤进交付物的那份"。这里读它是为了做
      # 三方一致性检查：secret 里那把私钥，必须是这些公钥之一。
      - name: 取 distro（公钥在那儿）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: YojigenOS/distro
          path: .distro

      - name: 用满整台 runner 的核
        run: echo "SKIRT_JOBS=$(nproc)" >> "$GITHUB_ENV"

      # ★ ccache 缓存。加它之前每次都是冷构建——而 gcc 是这里最大的一个包，
      #   冷构建它一个就要二十分钟以上。
      #
      #   key 里带 github.sha 是为了每次提交都存一份新的（缓存不可变），
      #   restore-keys 让新提交能从上一个提交的缓存开始——那才是它有用的
      #   地方：改了一个配方，不用把它依赖的几十个包重新编一遍。
      #
      #   ★ 加 arch 到 key 里：两个架构的产物不能混用一个缓存。
      # ★ 同样拆开：cache 的后置保存会在失败时被跳过，而 ccache 恰恰是
      #   "失败的那几轮最需要它攒下来"（理由见下面「存已建好的包」那段）。
      - name: 恢复 ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.SKIRT_CCACHE }}
          key: ccache-${{ runner.os }}-${{ inputs.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.arch }}-

      # ★ 把【已经建出来的包】也缓存起来，这样一轮失败不用从头再来。
      #
      #   没有它的时候：一次要建 49 个包、一个失败就整轮停，而下一轮从零开始。
      #   有了它：下一轮把上一轮的 .apk 捞回来，只建缺的那些。
      #
      #   key 里放 run_id【是故意的】——每次都要存一份新的，而
      #   restore-keys 会取到最近的那一份。用固定 key 的话 actions/cache
      #   永远命中第一次存的，后面建的包一个都进不去。
      #
      #   体积：一个架构 353 MB（本地 aarch64 实测）。仓库上限 10 GB，够用。
      #
      #   ★ 它和 ccache 是两个不同的东西，别混：
      #     ccache     —— 编译【中间产物】的缓存，让重建同一个包变快
      #     这个       —— 【成品 .apk】，让已经建好的包根本不用重建
      # ★★ 用 cache/restore 而不是 cache。
      #
      #   `actions/cache` 把"存"放在 job 的【后置步骤】里，而那个后置步骤
      #   **在 job 失败时会被跳过**。实测：
      #
      #       Post 已建好的包缓存   completed/skipped
      #       Post ccache 缓存      completed/skipped
      #       缓存列表里的 pkgs-*   0 条
      #
      #   而最近六次 release 全是 failure——所以不只是新加的缓存，**连 ccache
      #   也从来没能积累**：x86_64 的 ccache 只有 18 MB，aarch64 有 107 MB，
      #   差的就是所有失败轮次的成果，全丢了。
      #
      #   而"失败时不丢成果"正是这些东西存在的理由 ✗。
      #
      #   所以拆成两个显式步骤：restore 在这里，save 在【建包之后】并且带
      #   `if: always()`——不管后面成不成，建出来的包先存住。
      - name: 恢复已建好的包
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: var/pkgs/${{ inputs.arch }}
          key: pkgs-${{ inputs.arch }}-${{ github.run_id }}
          restore-keys: |
            pkgs-${{ inputs.arch }}-

      # ── 从上一轮的产物播种 ──────────────────────────────────────────────
      #
      # ★★ 为什么需要它。
      #
      #   建一批包要几十分钟，中间可能倒在【任何一个】环节——构建、打包、自检、
      #   发布。而失败之后重来一轮的代价是全部重做，即使坏掉的只有一个包。
      #
      #   实测就撞上了：x86_64 那轮 49 个包【全建出来了】，倒在自检（tar 和
      #   cpio 抢 rmt），于是什么都没发出去。重跑一轮又是 109 分钟。
      #
      #   而那次运行的最后一步 `留存仓库副本` 已经把打包好的东西传成 artifact
      #   了（285 MB，49 个 .apk）。**那批工作没有丢，只是没有回来的路。**
      #
      #   这一步就是那条路：把上一轮的 .apk 捞进 var/pkgs，于是
      #
      #       packages="cpio shadow"  seed_run=<上次的 run id>
      #
      #   只重建坏掉的那两个，索引仍然从【全部】包生成，自检装完整风味，
      #   然后发布。几分钟而不是两小时。
      #
      #   这也是修「某个包有问题」的正常姿势：重建它，而不是重建世界。
      - name: 从上一轮播种
        if: inputs.seed_run != ''
        run: |
          set -euo pipefail
          ARCH="${{ inputs.arch }}"
          echo "  从 run ${{ inputs.seed_run }} 的 repo-$ARCH 产物播种"
          gh run download "${{ inputs.seed_run }}" \
             --repo "${{ github.repository }}" \
             -n "repo-$ARCH" -D /tmp/seed
          mkdir -p "var/pkgs/$ARCH"
          n=0
          for f in /tmp/seed/*.apk; do
            [ -e "$f" ] || continue
            cp -f "$f" "var/pkgs/$ARCH/"
            n=$((n+1))
          done
          echo "  播种了 $n 个包"
          echo "  var/pkgs/$ARCH 里现在有 $(ls "var/pkgs/$ARCH"/*.apk 2>/dev/null | wc -l | tr -d ' ') 个"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 构建环境：我们自己的 ────────────────────────────────────────────
      #
      # ★ 不是 `docker build bootstrap`（那是 Debian 底的）。
      #   这是用我们自己那套建出来的 base-devel 镜像。
      - name: 拉我们自己的构建环境
        run: |
          set -euo pipefail
          SRC="yojigenos/base-devel:edge-${{ inputs.arch }}"
          docker pull "$SRC"
          docker tag "$SRC" "yojigenos/base-devel:${{ inputs.arch }}"

          echo "── 它是什么 ──"
          docker run --rm "yojigenos/base-devel:${{ inputs.arch }}" \
            /usr/bin/bash -c 'echo "  bash $BASH_VERSION"; /usr/bin/gcc --version | head -1'

      # ── 建包：用现有的 devel，不从零 ──────────────────────────────────
      #
      # ★ 两种构建，区别在「provides 从哪来」：
      #
      #     bootstrap（从零）    构建环境 = 借来的 Debian
      #                          provides = bootstrap/provides.txt（4 项 + 断环）
      #
      #     普通构建（用 devel） ★ 就是这里 ★
      #                          构建环境 = yojigenos/base-devel
      #                          provides = ★ 那个环境里有什么 ★
      #
      # 后者是这里的场景：devel 是我们自己那 39 个包拼出来的，依赖【已经在了】，
      # 所以不该重建它们——只建你要的那一个。
      #
      # 【provides 为什么从 distro 读，而不是在这里写一份】
      #
      # 因为"devel 里有什么"的定义在 distro/variants/base-devel.toml 里。
      # 在这里抄一份就是"同一个东西两个出处"——项目里已经为这个吃过亏。
      - name: 读出 devel 提供了哪些包
        run: |
          set -euo pipefail
          # ★ 用 skirt provides 算【依赖闭包】，不是直接读那份列表。
          #
          # 差别是真出过事故的：
          #
          #   variants/devel.toml 的注释写着「gmp / mpfr / mpc 是 gcc 的运行时
          #   依赖，会自动带进来，不用列」——所以那份列表是【想要什么】，
          #   不是【真的有什么】。
          #
          #   直接拿它当 provides，建 gcc 时就会报：
          #       [解析] 依赖链: gmp → mpfr → mpc → gcc
          #       skirt: 错误 依赖 gmp 还没有构建
          #   而 gmp 明明就在镜像里。
          #
          # 闭包才是镜像里真正有的东西（镜像里有 46 个，列表上只有 40 个）。
          LIST=$(python3 -c "
          import tomllib, pathlib
          v = tomllib.loads(pathlib.Path('.distro/variants/base-devel.toml').read_text())['variant']
          print(' '.join(v['packages']))")

          CLOSURE=$(./skirt/skirt provides $LIST)
          echo "SKIRT_PROVIDES=$(echo $CLOSURE | tr '\n' ' ')" >> "$GITHUB_ENV"

          echo "  列表上 $(echo $LIST | wc -w) 个 ✗ 闭包 $(echo "$CLOSURE" | wc -l) 个"
          echo "  ★ 多出来的是【会自动带进来的依赖】——镜像里有它们，列表上没写"
          for p in $(echo "$CLOSURE"); do
            echo "$LIST" | grep -qw "$p" || echo "      + $p"
          done

          # ★★ 要建的东西【同时】被声明成"已提供"时，当场警告。
          #
          #   这种状态意味着：skirt 认为构建容器里已经有它了，于是【不会把它
          #   建出来的产物合并进去】。而如果那个镜像其实没有它，构建就会以
          #   一个看不出原因的方式失败。
          #
          #   实测撞上的：x86_64 是 10-11 建的镜像，而 pkgconf 是后来才加进
          #   base-devel.toml 的。于是
          #
          #       ── 建 pkgconf ──      建了 ✓
          #       ── 建 shadow ──       configure.ac:245: error:
          #                             undefined or overquoted macro: AC_MSG_WARN
          #
          #   shadow 明明声明了 pkgconf，pkgconf 也明明刚建出来——但 skirt 按
          #   provides 办事，不合并它。报错和原因之间没有任何线索。
          #
          #   ★ 建一个包【不会】把它放进构建环境。只有镜像会。
          for p in ${{ inputs.packages }}; do
            if echo "$CLOSURE" | grep -qx "$p"; then
              echo "::warning::$p 既在「要建的」里，又在「已提供」的闭包里——构建容器里不会有它刚建出来的那份（skirt 按 provides 办事）。如果那个镜像其实没有 $p，这一步会以一个看不出原因的方式失败。"
            fi
          done

      - name: 建包
        env:
          SKIRT_BUILDENV: yojigenos/base-devel
        run: |
          set -euo pipefail
          # 依赖由上面的 SKIRT_PROVIDES 声明为"已提供"，所以只有目标本身会被建。
          #
          # ★ 已经有 .apk 的跳过。这是「一轮失败不用从头再来」的另一半——
          #   缓存负责把上一轮的包捞回来，这里负责不重做它们。
          #
          #   判据用【产物名】而不是配方名，因为子包和配方不是一对一：
          #   libgcc / libstdc++ 是 gcc 的子包，glibc-dev 是 glibc 的。列表里
          #   母包排在子包前面（glibc → glibc-dev），所以母包缺的时候会先把它
          #   建出来、顺手产出全部子包，后面几个就都跳过了。
          #
          #   半个产出的情况也能自愈：如果 glibc 的 .apk 在、glibc-dev 的不在，
          #   那么轮到 glibc-dev 时会真的去建 glibc（skirt 把子包名映射回母配方），
          #   代价是白建一次，结果是齐的。
          ARCH="${{ inputs.arch }}"
          OUT="var/pkgs/$ARCH"
          mkdir -p "$OUT"

          # ★ 有 seed_run 的时候【不跳过】。
          #
          #   播种是为了修东西——"重建 cpio 和 shadow，其余的从上一轮拿"。
          #   而上一轮的产物里【有】那个坏掉的 cpio，跳过逻辑分不出新旧，
          #   于是它会把最该重建的那个跳过去。实测就撞上了：
          #
          #       播种了 49 个包
          #       ── 跳过 cpio（已经有了）──      ← 最该重建的就是它 ✗
          #       ── 建 shadow ──
          #
          #   所以：给了 seed_run 就当作"这些是点名要重建的"，一律重建。
          #   播种只负责把【其余的】补齐，让索引和自检能看到完整的仓库。
          #
          #   不给 seed_run 时保持跳过——那是"接着上一轮继续建"的场景，
          #   跳过正是要的。
          SKIP_OK=1
          [ -n "${{ inputs.seed_run }}" ] && SKIP_OK=0

          built=0 skipped=0
          for p in ${{ inputs.packages }}; do
            if [ "$SKIP_OK" = 1 ] && ls "$OUT/$p-"*.apk >/dev/null 2>&1; then
              echo "── 跳过 $p（已经有了）──"
              skipped=$((skipped+1))
              continue
            fi
            echo "── 建 $p ──"
            ./skirt/skirt build "$p"
            built=$((built+1))
          done
          echo
          echo "  这一轮建了 $built 个，跳过 $skipped 个"
          echo "  $OUT 里现在有 $(ls "$OUT"/*.apk 2>/dev/null | wc -l | tr -d ' ') 个包"

      # ★ 建完就存，而且 `if: always()`。
      #
      #   位置在【建包之后、打包之前】是故意的：后面无论哪一步失败，这一轮
      #   辛苦建出来的包都已经存住了。放最后就会重蹈覆辙。
      #
      #   key 里有 run_id，所以每次都是新 key；restore-keys 会取最近的那份。
      #   key 已存在时 cache/save 会跳过——那就跳过，continue-on-error 兜着。
      - name: 存已建好的包
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: var/pkgs/${{ inputs.arch }}
          key: pkgs-${{ inputs.arch }}-${{ github.run_id }}

      - name: 存 ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.SKIRT_CCACHE }}
          key: ccache-${{ runner.os }}-${{ inputs.arch }}-${{ github.sha }}

      - name: 收集日志
        if: always()
        run: |
          mkdir -p var/logs
          ls -la "var/output/${{ inputs.arch }}/" 2>/dev/null | head -20 || true

      - name: 上传构建日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-logs-${{ inputs.arch }}
          path: var/logs
          if-no-files-found: ignore
          retention-days: 7

      # ── 签名密钥 ────────────────────────────────────────────────────────
      - name: 把签名密钥从 secret 落到文件
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::SIGNING_KEY 是空的"; exit 1; }

          KEY="$RUNNER_TEMP/signing.rsa"
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          chmod 600 "$KEY"

          # 只打印指纹，绝不打印内容
          openssl rsa -in "$KEY" -noout -check >/dev/null 2>&1 \
            || { echo "::error::SIGNING_KEY 不是有效的 RSA 私钥"; exit 1; }

          # ★ 三方一致性：secret 里那把，必须是【会烤进交付物的】公钥之一。
          #   不匹配就失败——否则会发布出「签名者没人认识」的包。
          #   签名本身是好的，只是没有任何已装系统会信它。这种问题很难查。
          MOD=$(openssl rsa -in "$KEY" -modulus -noout | sed 's/Modulus=//')
          FOUND=0
          for PUB in .distro/keys/*.rsa.pub; do
            [ -f "$PUB" ] || continue
            PMOD=$(openssl rsa -pubin -in "$PUB" -modulus -noout 2>/dev/null | sed 's/Modulus=//')
            if [ "$MOD" = "$PMOD" ]; then
              echo "  ✓ 和交付物里的公钥配对：$(basename "$PUB")"
              FOUND=1
            fi
          done
          [ "$FOUND" = 1 ] || {
            echo "::error::SIGNING_KEY 和 distro/keys/ 里的任何公钥都不配对"
            ls -1 .distro/keys/ 2>/dev/null || true
            exit 1
          }

          echo "SIGNING_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      # ── 打包 + 建仓库 ───────────────────────────────────────────────────
      #
      # ★ 签名必须在打包这一步——包建出来就是签好的。不然后面 mkndx 建索引
      #   时会逐个验证，全部报 UNTRUSTED signature，然后拒绝建索引。
      - name: 打包并签名
        run: |
          set -euo pipefail
          # ★ 用 --all 而不是把 inputs.packages 再列一遍。
          #
          # 因为【建包用配方名，打包要用产物名】，两者不一样：
          #
          #     skirt build glibc-locales  →  改为构建 glibc，产出 glibc、
          #                                   glibc-dev、glibc-locales 三个目录
          #     pack.sh glibc-locales      →  打那个子包（pack.sh 按产物目录找）
          #
          # 一个输入没法同时当这两者用——上面列 glibc-locales 会连带建出
          # glibc-dev，但打包那步只打你列的。而 CI 的工作区是干净的，
          # var/output 里【只有这一步之前建出来的东西】，所以 --all 恰好就是
          # 「这次建的」。
          #
          # 这也让「建了什么就打什么」成为默认：不会因为忘了在输入里补一个
          # 子包名，而产出一个装着主包、缺了子包的仓库。
          ./scripts/pack.sh --all \
              --arch "${{ inputs.arch }}" \
              --sign-key "$SIGNING_KEY_FILE"

      # ★ 这步需要 S3 凭据——不是要发布，是要【先拉回线上已有的包】。
      #
      # 索引是从包文件生成的（mkndx 没有"往索引里追加"的能力，--index 也
      # 只是复用元数据缓存）。而 CI 每次是干净的工作区，var/pkgs 里只有
      # 这次的包。不拉的话，生成的索引只列这次的包，传上去就把之前发布的
      # 包从索引里抹掉了。
      #
      # ★ 只给这一步和发布那步凭据，不给建包那步——最小暴露面。
      - name: 生成仓库索引
        env:
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          ./scripts/repo.sh \
              --arch "${{ inputs.arch }}" \
              --sign-key "$SIGNING_KEY_FILE" \
              --desc "YojigenOS ${{ inputs.arch }} 软件仓库"

      # ── 自检：从自己的仓库装一遍 ────────────────────────────────────────
      #
      # ★ 发布前先证明"这个仓库能装"。
      #   这正是 packages 侧待办里缺的那条检查——「用包管理器装」比
      #   「直接叠 payload」严格，它会把声明不全的依赖立刻暴露出来。
      - name: 自检 —— 包都在，而且能装出一个系统
        run: |
          set -euo pipefail

          # ── 这一步检查什么 ────────────────────────────────────────────────
          #
          # 两件事，都要过：
          #
          #   ① 这次让我建的包【都产出了】——便宜，一个 ls
          #   ② 从刚生成的仓库能【装出一个风味】——真的跑一次 apk add
          #
          # ── 为什么装风味，而不是装「这次建的包」 ──────────────────────────
          #
          # 原来这里是 `apk add ${{ inputs.packages }}`，那等于把【构建工具】
          # 当成【交付物】来验收。实测就失败了：
          #
          #     libgcc (no such package):   required by: ninja
          #     python3 (no such package):  required by: meson
          #
          # 而 ninja / meson 是 apk-tools 的【构建】依赖——它们不进 base，
          # 也不需要在这个仓库里可安装。拿它们当验收对象是问错了问题。
          #
          # 真正的判据是「能不能从这个仓库装出一个系统」。所以按风味装。
          # 这也天然排除了构建期才用的东西。
          #
          # ★ 用 .distro 里的风味文件，不在这里另写一份包列表——那份列表是
          #   发行版的事，写第二遍就会漂（0014 和 base.toml 的注释都说过）。

          ( cd var/repo && python3 -m http.server 18080 >/dev/null 2>&1 & echo $! > /tmp/http.pid )
          sleep 2

          echo "  确认索引可读:"
          curl -fsS -o /dev/null -w "    HTTP %{http_code}  %{size_download} 字节\n" \
            "http://localhost:18080/${{ inputs.arch }}/APKINDEX.tar.gz" || {
              echo "    ✗ 本地服务拿不到索引（服务的根要是 var/repo，不是 var/repo/<arch>）"
              exit 1; }

          FLAVOR="${{ inputs.check_flavor }}"
          if [ -n "$FLAVOR" ]; then
            FLAVOR_FILE=".distro/variants/$FLAVOR.toml"
            [ -f "$FLAVOR_FILE" ] || { echo "    ✗ 找不到风味文件 $FLAVOR_FILE"; exit 1; }
            FLAVOR_PKGS=$(python3 -c "
          import tomllib, pathlib
          v = tomllib.loads(pathlib.Path('$FLAVOR_FILE').read_text())['variant']
          print(' '.join(v['packages']))")
            echo "  风味 $FLAVOR: $(echo $FLAVOR_PKGS | wc -w | tr -d ' ') 个包"
          else
            FLAVOR_PKGS=""
            echo "  （没指定风味，只检查包有没有建出来）"
          fi

          docker run --rm --network host \
            -v "$PWD/var/repo:/repo:ro" \
            -v "$PWD/.distro/keys:/keys:ro" \
            -e "REQUESTED=${{ inputs.packages }}" \
            -e "FLAVOR_PKGS=$FLAVOR_PKGS" \
            -e "FLAVOR=$FLAVOR" \
            -e "ARCH=${{ inputs.arch }}" \
            alpine:latest sh -c '
              set -e
              mkdir -p /newroot/etc/apk/keys
              cp /keys/*.rsa.pub /newroot/etc/apk/keys/
              echo "http://localhost:18080" > /newroot/etc/apk/repositories

              echo "  ── ① 这次要建的包都产出了吗 ──"
              missing=""
              for p in $REQUESTED; do
                ls /repo/$ARCH/$p-*.apk >/dev/null 2>&1 || missing="$missing $p"
              done
              if [ -n "$missing" ]; then
                echo "    ✗ 没建出来:$missing"
                exit 1
              fi
              echo "    ✓ $(echo $REQUESTED | wc -w | tr -d " ") 个都在"

              [ -n "$FLAVOR" ] || exit 0

              echo "  ── ② 装风味 $FLAVOR ──"
              # ★ 不用 --allow-untrusted —— 真的验签
              apk add --keys-dir /newroot/etc/apk/keys \
                  --repository http://localhost:18080 \
                  --root /newroot --initdb $FLAVOR_PKGS

              echo "    装了 $(apk --root /newroot info 2>/dev/null | wc -l | tr -d " ") 个包"

              # ★ 如果装进去了 apk-tools，就让【它自己】报个版本。
              #   那是「用我们自己的包管理器管理我们自己的系统」这句话的
              #   最小验证——比"文件都在"强得多。
              if apk --root /newroot info -e apk-tools >/dev/null 2>&1; then
                echo "  ── ③ 新系统里的 apk 自己报版本 ──"
                chroot /newroot /sbin/apk --version
              fi
            '
          kill "$(cat /tmp/http.pid)" 2>/dev/null || true

      - name: 发布到 repo.os.yojigen.cn
        if: ${{ inputs.deploy }}
        env:
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: ./scripts/deploy.sh --arch "${{ inputs.arch }}" --go

      - name: 没有勾 deploy
        if: ${{ !inputs.deploy }}
        run: |
          echo '  只做到了「生成仓库」，没有推送。'
          echo "  产物在 var/repo/${{ inputs.arch }}/"

      - name: 留存仓库副本
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: repo-${{ inputs.arch }}
          path: var/repo/${{ inputs.arch }}
          retention-days: 7
