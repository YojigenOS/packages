name: bootstrap

# 从零建出全部包。
#
# ── 它和 release.yml 的分工 ──────────────────────────────────────────────
#
#     bootstrap.yml   从 Debian 底的临时环境出发，把【全部】包建一遍
#     release.yml     用我们自己的 devel 镜像，建【指定的一组】包
#
# 第一次引导时没有 devel 镜像可用——那个镜像正是要由这些包组装出来的。所以
# 必须有一条从 Debian 出发的路，这就是它。
#
# 引导跑通、包发布、devel 镜像组装出来之后，同一个 workflow 还有第二个用途：
# 把 buildenv 填成 yojigenos/devel 再跑一遍，就是【自举验证】——用我们自己的
# 系统建我们自己的系统。那一步是 docs/决策记录/0011 那条界的验收。
#
# ── 为什么这一版不再建镜像 ───────────────────────────────────────────────
#
# 上一版（buildenv-{aarch64,x86_64}.yml）会自己拼出 devel 镜像并推送。
# 那件事搬到 distro 去了：镜像从 apk 仓库组装，风味定义在 distro 里。
#
#     packages/   配方 → .apk → apk 仓库        （生产）
#     distro/     仓库 → 组装 → 交付物 → registry（发行）
#
# 那条界一划，这个仓库就【不需要知道镜像叫什么名字】了——名字只该出现在
# distro 的风味定义里一次。
#
# ★ 而 2026-10-15 撞到过它自己的反例：上面那句「名字只该出现在 distro 一次」
#   写着的同时，这个文件里就把名字写了两遍，而 `release.yml` 里还有第三处。
#   更糟的是那三处有两个不同的值：
#
#       这个文件当时写着  yojigenos/devel        ← 而 Docker Hub 上它是 401
#       release.yml 写着  yojigenos/base-devel   ← 而这个才是真的
#
#   名字的真出处是 `distro/variants/<风味>.toml` —— distro 发布时用的是
#   `yojigenos/${{ inputs.flavor }}`，**镜像名就是变体名**。
#
# ★ 而那个改名后来【做了】（当天，跨两个仓库一起做）：变体文件改成 `devel.toml`、
#   distro 的 0003 追加了一条指向新增的 0019、这边两处和 `release.yml` 一处一起
#   切过去、`devel:edge` 发布出来之后才切的消费端。**所以现在 `devel` 就是真的那个。**
#
#   ★ 而那次事故本身就是「别在一处先改」的反面教材：**先改的那一处没人跟着，
#     于是它错了一整天。** 真要改名，它是一次跨两个仓库的改动（变体文件、0003
#     那张命名表、这边两处、release.yml 一处）——而 0003 是不可变的，所以它得先
#     有一篇新的决策记录。**顺序是发布端先、消费端后**（见 0019）。
#
# ── 为什么每个架构是一个矩阵腿，而不是一个文件 ───────────────────────────
#
# 这不是「多架构镜像」，是「多平台容器」——aarch64 的产物在别的架构上一个都
# 用不上，每个架构都要从 Debian 底出发走完整的引导，两者之间没有可共享的东西。
#
# 曾经拆成两个文件，因为一个文件里的两条矩阵腿踩过两个坑：
#
#   ① 自举验证写成了下游 job + needs: build，于是 aarch64 要等 x86_64 的构建
#      跑完才开工——实测白等过 23 分钟。
#   ② 默认的 fail-fast 会在一条腿失败时取消另一条，于是一轮里只要有一条挂，
#      另一条的成功也被淹掉。
#
# 两个坑都不是「矩阵」本身的错，所以现在这样治：
#
#   ★ 自举验证的步骤留在【同一个 job】里，没有下游 job，就没有 needs 可等
#   ★ fail-fast: false —— 一条腿挂了另一条照跑完
#   ★ arch 是参数，可以只跑一个（调单架构问题时省一半时间）

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        type: choice
        options: [aarch64, x86_64, both]
        default: both
      buildenv:
        description: '构建环境镜像，【不含 tag】。留空 = 从 Debian 底的临时环境出发（第一次引导）；填 yojigenos/devel = 用我们自己的（自举验证）'
        type: string
        default: ''
      deploy:
        description: '把建出来的包发布到 repo.os.yojigen.cn（不勾就是干跑）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      # ★ 一条腿失败不取消另一条。见文件头的说明。
      fail-fast: false
      matrix:
        # 只跑一个架构时就只生成一条腿——这是"可以只触发一个"的实现。
        arch: ${{ inputs.arch == 'both' && fromJSON('["aarch64", "x86_64"]') || fromJSON(format('["{0}"]', inputs.arch)) }}

    # 显式 pin 版本，不用 ubuntu-latest：它是个移动别名，构建环境会静默变化，
    # 而且只跟踪 x64 镜像。注意这些 runner 只在公开仓库可用。
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    steps:
      - name: 取 packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 取 distro（公钥在那儿）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: YojigenOS/distro
          path: .distro

      - name: 用满整台 runner 的核
        run: |
          # skirt 默认留两个核给用户——那是给开发机的体贴，在 CI 上就是浪费。
          echo "SKIRT_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "并行度: -j$(nproc)"

      # 编译缓存可以跨运行复用——它不影响「这次构建到底建了什么」，只影响快慢。
      #
      # 【产物 var/output/ 故意不缓存】：那正是每次要重新证明的东西。
      #
      # ★ 而源码缓存（var/cache）2026-10-15 移除了，所以这里也没有它。
      #   原因见 source.py 顶部那段：它的价值只在本地重复构建，而我们没有
      #   本地构建；而它在 CI 上（尤其配着 restore-keys 会退到上一轮的缓存）
      #   反而可能用到旧源码。这里现在只缓存 ccache。
      #
      # ★ 键里带架构：两个架构的 ccache 不能混。
      - name: ccache 缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .ccache
          key: bootstrap-${{ matrix.arch }}-${{ hashFiles('recipes/**/spec.toml', 'skirt/**/*.py') }}
          restore-keys: bootstrap-${{ matrix.arch }}-

      # ── 构建环境：两条路 ────────────────────────────────────────────────
      #
      # buildenv 留空 → 从 Debian 底出发（第一次引导）
      # buildenv 填了 → 用那个镜像（自举验证）
      #
      # 这两个分支就是「借来的起点」和「我们自己的系统」的区别，别的地方
      # 一个字都不用改——命令、顺序、配方全都一样。

      - name: 建 Debian 底的临时构建环境
        if: inputs.buildenv == ''
        run: |
          # 这个镜像【不发布】。它只是 `FROM debian:stable-slim` + 一批 apt 包
          # ——不是一个 Yojigen OS 的产物，是借来的起点。发布它等于发布一份
          # Debian 的衍生品，而且会让「我们发布了什么」这条线变模糊。
          #
          # 【也不钉 Debian 的 digest】。理论上"钉住才能复现"，但对这个项目
          # 不成立：Debian 的版本只影响第一轮，而第一轮本来就不是固定点。
          # 真正的判据是"换个 Debian 版本，产物应该一样"——钉住反而掩盖问题。
          #
          # 所以这里只【记录身份】：把这一轮用的 Debian 版本和 Dockerfile 的
          # 哈希打进日志。排查"为什么 CI 上能过、本地不能"时要的正是这个。
          docker build -t "yojigenos/buildenv:${{ matrix.arch }}" bootstrap

          echo "=== 这一轮的构建环境身份 ==="
          docker run --rm "yojigenos/buildenv:${{ matrix.arch }}" sh -c \
            'grep -E "^(VERSION|VERSION_CODENAME)=" /etc/os-release; echo "  debian_version: $(cat /etc/debian_version)"' \
            | sed 's/^/  /'
          echo "  Dockerfile sha256: $(sha256sum bootstrap/Dockerfile | cut -c1-16)…"
          echo "  镜像 ID: $(docker image inspect "yojigenos/buildenv:${{ matrix.arch }}" --format '{{.Id}}' | cut -c1-24)…"

      - name: 拉我们自己的构建环境
        if: inputs.buildenv != ''
        run: |
          set -euo pipefail
          IMG="${{ inputs.buildenv }}"
          # ★ skirt 用的是 "<镜像名>:<架构>"——见 skirtlib/build.py 里的
          #   f"{BUILDENV_IMAGE}:{arch}"。所以 SKIRT_BUILDENV 只写镜像名，
          #   不带 tag；本地得有一个 :<架构> 的 tag 给它用。
          #
          #   推上来的 tag 形如 edge-<arch>（distro 那边推的），所以拉回来重打
          #   一下。这一步和 release.yml 里那段是同一个约定。
          if docker pull "$IMG:edge-${{ matrix.arch }}"; then
            docker tag "$IMG:edge-${{ matrix.arch }}" "$IMG:${{ matrix.arch }}"
          else
            docker pull "$IMG:${{ matrix.arch }}"
          fi
          echo "  ── 它是什么 ──"
          docker run --rm "$IMG:${{ matrix.arch }}" /usr/bin/bash -c \
            'echo "  bash $BASH_VERSION"; /usr/bin/gcc --version | head -1'
          echo "  用我们自己的系统当构建环境——命令、顺序、配方一个字都不变，"
          echo "  变的只是「谁来当构建环境」。这就是自举。"

      # ── 引导 ────────────────────────────────────────────────────────────

      # ── provides 从哪来 ───────────────────────────────────────────────
      #
      # ★★ 2026-10-17 补的。原来这里【没有】这一步，于是 SKIRT_PROVIDES 落到
      #   `bootstrap/provides.txt` 那个兜底 —— 而它是给【借来的 Debian 起点】
      #   写的（4 项 + 断环），不是给 `yojigenos/devel` 写的。
      #
      #   `release.yml` 那边【一直有】这一步（它从 distro 的 devel.toml 算闭包）。
      #   **两个 workflow 用了两个不同的 provides 来源，而它们跑的是同一个
      #   构建环境。** 那是不一致，而它会以"某个包找不到东西"的方式表现。
      - name: 读出 devel 提供了哪些包
        run: |
          set -euo pipefail
          # ★ 用 skirt provides 算【依赖闭包】，不是直接读那份列表 ——
          #   列表是"想要什么"，闭包才是"镜像里真的有什么"。理由详见
          #   release.yml 同一个步骤（那里记着一次真事故）。
          LIST=$(python3 -c "
          import tomllib, pathlib
          v = tomllib.loads(pathlib.Path('.distro/variants/devel.toml').read_text())['variant']
          print(' '.join(v['packages']))")

          CLOSURE=$(./skirt/skirt provides $LIST)
          # ★★ 保一份【完整的】闭包 —— 断言要用它。
          #
          #   "环境里真的有什么"（FULL_CLOSURE，62 个）和"哪些不该断环"
          #   （CLOSURE，29 个）是【两件事】。第一版只留了后者的变量名，
          #   于是断言拿 29 个去比，报了一堆假的：
          #
          #       bash 缺 gettext, readline
          #       tmux 缺 autoconf, automake, libtool, pkgconf
          #
          #   ——而它们都在环境里。★ 假报比不报好（它会被人看见并修掉），
          #   但这个是我自己的疏忽，不该留着。
          FULL_CLOSURE="$CLOSURE"

          # ★★★ 2026-10-20：从这里【减掉】那些"也要交付给用户"的包。
          #
          #   为什么必须减（§1.5.Bf 查到底的）：`SKIRT_PROVIDES` 的语义是
          #   「构建环境提供这些，所以【不用建】」—— 驱动会把它们【断环】：
          #
          #       [断环] 这些包由构建环境提供，指向它们的 490 条依赖边被断掉：
          #
          #   于是名单里的包【不进构建顺序、永远不重建】。对 autoconf / make /
          #   cmake 这类【纯构建工具】，那是对的。而对 `readline` / `ncurses` /
          #   `openssl` / `zlib` 这类【既要进构建环境、又要装进用户系统】的包，
          #   那是错的：它们被"环境提供"之后就【再也不会跟着配方更新】。
          #
          #   实测的后果（2026-10-18 连续四轮）：readline 的 build 依赖补了
          #   ncurses，而 config 改了【不生效】—— 因为 readline 那一轮根本没
          #   被建（var/logs 里 68 份日志没有它）。于是 python3 链上镜像里那份
          #   旧的 libreadline.so.8：
          #
          #       [ERROR] readline failed to import: …: undefined symbol: UP
          #
          #   判据：**一个包最终要不要进用户系统？** 要进 → 它必须跟着配方走。
          #
          #   ★★★ 而第一版的修法（从 SKIRT_PROVIDES 里减掉 base+minimal 的
          #   闭包）【不成立，已回退】。2026-10-20 实测：
          #
          #       skirt: 错误 依赖成环，排不出构建顺序：
          #         make → glibc → python3 → zlib → make
          #
          #   ★ 原因是【`host_provides` 一个集合干了两件事】：
          #
          #       ① `build_graph` 里把指向它的边【断掉】—— 那是【解决依赖环】
          #          的机制（`order.py:58` 的 `if recipe in host_provides`）
          #       ② 它同时让那个包【不进构建顺序、永远不重建】
          #
          #   我只该改 ②，而把 ① 也拿掉了 —— 环就露出来了。而那个环是真的：
          #   make 要 glibc，glibc 要 python3，python3 要 zlib，zlib 要 make。
          #   它一直存在，只是被 ① 遮着。
          #
          #   ★ 而"一个机制两个意思"是我这几天第三次撞见的同一个形状（前两次：
          #     一个变量表达两件事、一个 `head -1` 藏掉另外两条）。
          #
          #   正确的修法要把 ① 和 ② 分开 —— 那要改 `skirt/`（`order.py` +
          #   `deps.py`），而改它会让全部包 stale。所以它该和 B2/B3 那些一起做，
          #   不该在 workflow 里绕。细节见 `docs/待办.md` §1.5.Bf。
          echo "SKIRT_PROVIDES=$(echo $CLOSURE | tr '\n' ' ')" >> "$GITHUB_ENV"

          echo "  列表上 $(echo $LIST | wc -w) 个 ✗ 闭包 $(echo "$CLOSURE" | wc -l) 个"
          for p in $(echo "$CLOSURE"); do
            echo "$LIST" | grep -qw "$p" || echo "      + $p"
          done

          # ★★★ 而这里加一条断言：**每个配方声明的 build 依赖，都得在这个
          #   闭包里**。那是 §1.5.B 那句「配方能用什么 ⟺ devel 里有什么」
          #   的机器版本 —— 它以前只是【意图】，没人量过。
          #
          #   2026-10-17 量了：89 个配方里 16 个不满足它。而第一个可观测的
          #   后果就是那天的一次失败：
          #
          #       grep: configure: error: PCRE support not available
          #
          #   grep 声明了 pcre2 作 build 依赖 ✓，而环境里没有它 ✗。
          #
          #   ★ 而这条断言【必须在这里报警】而不是等到构建失败 —— 构建失败的
          #     报错（"PCRE support not available"）和原因（"pcre2 不在环境里"）
          #     之间没有直接线索，那正是这个项目一直在修的那一类。
          FULL_CLOSURE="$FULL_CLOSURE" python3 - <<'PYEOF2'
          import os, pathlib, tomllib
          # ★ 用 $FULL_CLOSURE，不是 $SKIRT_PROVIDES，也不是 $CLOSURE。
          #
          #   前者：GITHUB_ENV 同一步骤内还没生效（2026-10-17 踩过）。
          #   后者：那是【排除之后】的（29 个），而这条断言问的是
          #        "环境里真的有什么"（62 个）—— 两件事，见上面的注释。
          #
          #   `echo … >> "$GITHUB_ENV"` 【不等于】设置当前进程的环境变量 ——
          #   GitHub Actions 把它喂给【后续】步骤，同一步骤内它还没生效。
          #   第一版就是这么写的，而它当场报 KeyError（本地跑了一遍才抓到）。
          closure = set(os.environ["FULL_CLOSURE"].split())

          # ★★ 子包映射回母包。【装 openssl 就有 libcrypto 和 libssl】——
          #   而 provides 里写的是母包名。第一版直接比包名，于是报了假的：
          #
          #       openssh 缺 libcrypto, libssl
          #
          #   而那两个是 openssl 的子包（见 openssl/spec.toml 的两个
          #   [[subpackage]]）。★ 假报比不报好 —— 它会被人看见并修掉，
          #   而"不报"不会。但修完之后它该只报真的。
          子包到母包 = {}
          for sp in pathlib.Path("recipes").glob("*/*/spec.toml"):
              d = tomllib.loads(sp.read_text())
              for sub in (d.get("subpackage") or []):
                  if sub.get("name"):
                      子包到母包[sub["name"]] = d["package"]["name"]

          # 这几个是"谁都有"的：编译器是 yojigenos/devel 的定义里自带的，
          # 而它们不出现在 provides 列表里（它们是 gcc 的一部分）。
          always = {"gcc", "make", "cc", "ld", "ar"}
          缺 = {}
          for sp in sorted(pathlib.Path("recipes").glob("*/*/spec.toml")):
              d = tomllib.loads(sp.read_text())
              need = set()
              for arch in ("x86_64", "aarch64"):
                  need |= set(d.get("dependencies", {}).get(arch, {}).get("build", []))
              # 子包换回母包再比
              need = {子包到母包.get(x, x) for x in need}
              miss = need - closure - always
              if miss:
                  缺[d["package"]["name"]] = sorted(miss)
          if 缺:
              print(f"::error::有 {len(缺)} 个配方的 build 依赖不在构建环境里 ——"
                    f"构建它们时会以一个看不出原因的方式失败")
              for n, m in sorted(缺.items()):
                  print(f"::error::    {n} 缺 {', '.join(m)}")
              raise SystemExit(1)
          print("  ✓ 每个配方声明的 build 依赖都在构建环境里")
          PYEOF2

      # ★ 5.12.4：每个风味里有几个包来自【上游二进制】。
      #
      #   那是 `vendor` 那个记号（5.12.1）的【用处】—— 记号不是为了好看，
      #   是为了让这句话能被算出来、写进 job summary。
      #
      #   判据是：【风味的闭包里，有几个配方的 [build].vendor 非空】。
      #   而"闭包"不是"直接列表"：一个风味要装 readline，而 readline 不是
      #   vendor 的 —— 那些都算进去才是用户真正会装到的东西。
      #
      #   ★ 而现在这个数字是 0（89 个配方全是自己建的）。**而 0 也要说话**：
      #     一个从不打印的检查，和一个打印"0 个"的检查，区别在于后者证明
      #     它跑过。这一条是这个项目这几天反复在修的那一类。
      - name: 数一下每个风味里有几个包来自上游二进制
        run: |
          set -euo pipefail
          python3 - <<'PYEOF3'
          import os, pathlib, subprocess, tomllib, sys

          # 每个配方的 vendor 记号
          vendor = {}
          for sp in sorted(pathlib.Path("recipes").glob("*/*/spec.toml")):
              d = tomllib.loads(sp.read_text(encoding="utf-8"))
              v = (d.get("build") or {}).get("vendor")
              if v:
                  vendor[d["package"]["name"]] = v

          print(f"  [分发包] 配方里带 vendor 记号的：{len(vendor)} 个"
                + ("（" + " · ".join(sorted(vendor)) + "）" if vendor else ""))
          print()

          # 每个风味：直接列表 → 闭包 → 数其中几个是分发包
          行 = []
          for f in sorted(pathlib.Path(".distro/variants").glob("*.toml")):
              v = tomllib.loads(f.read_text(encoding="utf-8"))["variant"]
              直接 = v["packages"]
              try:
                  闭包 = subprocess.run(
                      ["./skirt/skirt", "provides", *直接],
                      capture_output=True, text=True, check=True).stdout.split()
              except subprocess.CalledProcessError as e:
                  print(f"  ⚠ {f.stem}：算闭包失败（{e}），跳过", file=sys.stderr)
                  continue
              分发的 = sorted(x for x in 闭包 if x in vendor)
              行.append((f.stem, len(直接), len(闭包), 分发的))

          # 表格 —— 而它是这一条的产出，所以排版值得。
          print(f"  {'风味':<10} {'直接':>4} {'闭包':>4} {'来自上游二进制':>14}")
          for 名, n直接, n闭包, 分发的 in 行:
              print(f"  {名:<10} {n直接:>4} {n闭包:>4} {len(分发的):>14}"
                    + ("    " + " ".join(分发的) if 分发的 else ""))
          print()

          # 进 job summary（那里是给人看的，不必在日志里重复）
          summary = pathlib.Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
          if summary.name != "dev/null":
              with summary.open("a", encoding="utf-8") as fp:
                  fp.write("## 分发包（决策记录 0022）\n\n")
                  fp.write(f"配方里带 `vendor` 记号的：**{len(vendor)}** 个\n\n")
                  fp.write("| 风味 | 直接包 | 闭包 | 来自上游二进制 |\n|---|---|---|---|\n")
                  for 名, n直接, n闭包, 分发的 in 行:
                      fp.write(f"| {名} | {n直接} | {n闭包} | **{len(分发的)}** |\n")
                  fp.write("\n")
          PYEOF3

      - name: 引导 —— 建出全部包
        id: bootstrap
        env:
          # ★ 唯一的变量。留空时是上面建的那个临时环境；填了就是我们自己。
          #
          #   这里是 workflow 里唯一能看出"借来的起点 vs 我们自己的系统"的地方。
          #
          #   ★ 写【不含 tag 的镜像名】。skirt 自己会补 :<架构>——写成
          #     yojigenos/buildenv:aarch64 会变成 yojigenos/buildenv:aarch64:aarch64。
          #     这个坑实测踩过一次，报错是 docker 找不到那个镜像，zlib 第一
          #     个包就挂了。
          SKIRT_BUILDENV: ${{ inputs.buildenv != '' && inputs.buildenv || 'yojigenos/buildenv' }}
          # ★★ 拉线上那一步要它。第 16 步（建索引）本来就有这四个 ——
          #   而这里是【另一件事】：它服务的是【建包】那一步的跳过判断。
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # ★★★ 先把线上已有的产物捞回来 —— 不做这一步，每个包都会被判成
          #   "该重建"，于是 CI 必然全量（90 包 × 2 架构 × ~2 小时）。
          #
          #   `.buildkey` 那个旁路文件的存在【就是为了跨 CI 的运行】
          #   （见 buildkey.py:292 那句），而它躺在 var/pkgs/*.apk.buildkey 里。
          #
          #   ★ 2026-10-17 第一版只加了下面那句 `restore` —— 而那【不够】：
          #     restore 只解【本地】的 .apk，它不下载。实测那轮跑了两小时、
          #     日志里写着「没有 …/var/pkgs/x86_64，没什么可还原的」，90 个包
          #     全部重建。所以【先拉、再解】。
          #
          #   ★ 而拉的是 var/pkgs（建包那步读的那个目录）。线上那份是给
          #     var/repo 用的（建索引那步），两个目录不同 —— 见 fetch_apks 的注释。
          #
          #   ★ 失败不中断：拉不到就当"没有上一次"，退化成全量（那是老行为，
          #     而它不是错的，只是慢）。
          ./skirt/skirt restore --arch "${{ matrix.arch }}" --from-online || \
            echo "::warning::拉线上/还原失败 —— 这一轮会全量重建（几分钟变两小时）"
          ./skirt/skirt order
          # bootstrap 失败时非零退出（这是它该做的）。但我们要先把日志传出去，
          # 所以这里不让它中断，改成记下结论、后面再失败。
          ./skirt/skirt bootstrap --report || echo "bootstrap_failed=1" >> "$GITHUB_OUTPUT"

      # ★ 往后跑一次测试 —— 因为【有几条测试要有产物才会执行】。
      #
      #   `test_kind.py::test_kind_和产物一致` 检查"配方目录名和产物形态对不对
      #   得上"（lib 要有 .so、tool/net 要有可执行文件、kernel 要有 vmlinuz…）。
      #   它看不到产物时走 `skipTest` —— 而 `test.yml` 是 checkout 完直接跑的，
      #   `var/output/` 永远是空的，所以**这条检查从来没执行过**。
      #
      #   ★ 而"跳过"和"过了"长得一样 —— 这正是这个项目反复在修的那一类。
      #     放在这里是因为这是唯一批量建出全部产物的那一步。
      - name: 跑测试（这一步有产物，能跑到平时跳过的那几条）
        run: |
          set -euo pipefail
          python3 -m unittest discover -s skirt/tests -p "test_kind.py" -v 2>&1 | tail -30
          # ★ 上面那个 tail 会吃掉退出码 —— 再跑一遍，不要管道。
          python3 -m unittest discover -s skirt/tests -p "test_kind.py"

      # ★ 失败那一刻就把日志拿到手。
      #
      # 以前只能等整个 job 结束再用 gh api 取日志，而 cmd_bootstrap 只打印
      # 失败包的【最后 8 行】——那点信息往往不够。所以把每个包的完整日志传出来。
      #
      # ★ 必须先把日志抄进工作区：upload-artifact 只认工作区里的路径，给 /tmp
      # 会被拒绝——实测 aarch64 那轮【引导成功了】却因为这一步失败让整个 job
      # 挂掉，连带下游一起被跳过。
      # ★★ 建完就存，而且 `if: always()`。
      #
      #   `actions/cache` 把"存"放在 job 的【后置步骤】里，而那个步骤在 job 失败
      #   时会被跳过。实测这一轮：
      #
      #       Post ccache 缓存   completed/skipped
      #
      #   而最近这些引导轮次全是 failure——所以 **ccache 一次都没攒下来**。
      #   "失败的那几轮最需要它攒下来"，这正是缓存存在的理由 ✗。
      #
      #   拆成两个显式步骤（官方文档里就是这个模式）：
      #     cache/restore   恢复，在开头
      #     cache/save      保存，在【引导之后】且带 if: always()
      #
      #   放在引导之后而不是最末尾，是因为这样后面无论哪一步失败（打包、自检、
      #   发布），辛苦建出来的东西都已经存住了。放最后就会重蹈覆辙。
      - name: 存 ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .ccache
          key: bootstrap-${{ matrix.arch }}-${{ hashFiles('recipes/**/spec.toml', 'skirt/**/*.py') }}

      - name: 收集构建日志
        if: always()
        run: |
          mkdir -p var/logs
          echo "共 $(ls var/logs/ 2>/dev/null | wc -l) 个包的日志"

      - name: 上传构建日志
        if: always()
        continue-on-error: true      # 日志是诊断手段，不该让整个 job 失败
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bootstrap-logs-${{ matrix.arch }}
          path: var/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 引导失败了就停在这里
        if: steps.bootstrap.outputs.bootstrap_failed == '1'
        run: |
          echo "::error::引导失败。完整日志见这个 job 的 bootstrap-logs-${{ matrix.arch }} artifact。"
          exit 1

      # ── 打包、发布 ──────────────────────────────────────────────────────
      #
      # 这几步和 release.yml 一样，但逻辑不在 workflow 里——`skirt pack` /
      # `skirt repo` / `skirt deploy` 才是实现，这里只是按顺序调它们。所以"两处
      # 会漂"的风险不在这里：要改发布逻辑，改 skirt，两边一起变。

      - name: 把签名密钥从 secret 落到文件
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::SIGNING_KEY 是空的"; exit 1; }
          KEY="$RUNNER_TEMP/signing.rsa"
          printf '%s\n' "$SIGNING_KEY" > "$KEY"
          chmod 600 "$KEY"
          openssl rsa -in "$KEY" -noout -check >/dev/null 2>&1 \
            || { echo "::error::SIGNING_KEY 不是有效的 RSA 私钥"; exit 1; }
          MOD=$(openssl rsa -in "$KEY" -modulus -noout | sed 's/Modulus=//')
          FOUND=0
          for PUB in .distro/keys/*.rsa.pub; do
            [ -f "$PUB" ] || continue
            PMOD=$(openssl rsa -pubin -in "$PUB" -modulus -noout 2>/dev/null | sed 's/Modulus=//')
            if [ "$MOD" = "$PMOD" ]; then
              echo "  ✓ 和交付物里的公钥配对：$(basename "$PUB")"
              FOUND=1
            fi
          done
          [ "$FOUND" = 1 ] || {
            echo "::error::SIGNING_KEY 和 distro/keys/ 里的任何公钥都不配对"
            ls -1 .distro/keys/ 2>/dev/null || true
            exit 1
          }
          echo "SIGNING_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: 打包并签名
        run: |
          ./skirt/skirt pack --all \
              --arch "${{ matrix.arch }}" \
              --sign-key "$SIGNING_KEY_FILE"

      - name: 生成仓库索引
        env:
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          ./skirt/skirt repo \
              --arch "${{ matrix.arch }}" \
              --sign-key "$SIGNING_KEY_FILE" \
              --desc "Yojigen OS ${{ matrix.arch }} 软件仓库"

      # ★ 自举的验收：把刚建出来的仓库装成一个系统，再让【系统里的 apk】
      #   自己报个版本。apk 是 glibc 程序，它能在那个 chroot 里跑起来意味着
      #   动态链接器、libc、libssl、libcrypto、CA 证书全都就位了——比"文件
      #   都在"强得多。
      - name: 自检 —— 从刚建出来的仓库装一个系统
        run: |
          set -euo pipefail
          FLAVOR="${SELFCHECK_FLAVOR:-base}"
          FLAVOR_FILE=".distro/variants/$FLAVOR.toml"
          [ -f "$FLAVOR_FILE" ] || { echo "::error::找不到风味文件 $FLAVOR_FILE"; exit 1; }
          FLAVOR_PKGS=$(python3 -c "
          import tomllib, pathlib
          v = tomllib.loads(pathlib.Path('$FLAVOR_FILE').read_text())['variant']
          print(' '.join(v['packages']))")
          echo "  风味 $FLAVOR: $(echo $FLAVOR_PKGS | wc -w | tr -d ' ') 个包"

          # ★ 5.12.3：分发包装完之后【真的跑一次】。
          #
          #   判据是 `vendor_check`（配方里可选的命令），不写就用默认的
          #   `<包名> --version`。★ 而这一条只能在【装好的系统里】跑 ——
          #   构建容器里没有它链的那些库，而"没有库"正是要检的东西。
          #
          #   而它【现在一个分发包都没有】。所以它算出来是空表，而【空也要
          #   说话】：打印"0 个"，证明这条检查跑过。
          VENDOR_CHECKS=$(python3 -c "
          import tomllib, pathlib
          out = []
          for sp in sorted(pathlib.Path('recipes').glob('*/*/spec.toml')):
              d = tomllib.loads(sp.read_text(encoding='utf-8'))
              b = d.get('build') or {}
              if not b.get('vendor'):
                  continue
              name = d['package']['name']
              out.append(name + '=' + (b.get('vendor_check') or (name + ' --version')))
          print(' '.join(out))")
          echo "  [分发包] 要验的可执行：$(echo "$VENDOR_CHECKS" | wc -w | tr -d ' ') 个"
          for pair in $VENDOR_CHECKS; do echo "      $pair"; done

          ( cd var/repo && python3 -m http.server 18080 >/dev/null 2>&1 & echo $! > /tmp/http.pid )
          sleep 2
          curl -fsS -o /dev/null "http://localhost:18080/${{ matrix.arch }}/APKINDEX.tar.gz" || {
            echo "::error::本地服务拿不到索引"; exit 1; }

          docker run --rm --network host \
            -v "$PWD/var/repo:/repo:ro" \
            -v "$PWD/.distro/keys:/keys:ro" \
            -e "FLAVOR_PKGS=$FLAVOR_PKGS" \
            -e "ARCH=${{ matrix.arch }}" \
            -e "VENDOR_CHECKS=$VENDOR_CHECKS" \
            alpine:latest sh -c '
              set -e
              mkdir -p /newroot/etc/apk/keys
              cp /keys/*.rsa.pub /newroot/etc/apk/keys/
              echo "http://localhost:18080" > /newroot/etc/apk/repositories
              # ★ 不用 --allow-untrusted —— 真的验签
              apk add --keys-dir /newroot/etc/apk/keys \
                  --repository http://localhost:18080 \
                  --root /newroot --initdb $FLAVOR_PKGS
              echo "  装了 $(apk --root /newroot info 2>/dev/null | wc -l | tr -d " ") 个包"
              if apk --root /newroot info -e apk-tools >/dev/null 2>&1; then
                echo "  新系统里的 apk: $(chroot /newroot /sbin/apk --version)"
              fi

              # ★ 5.12.3：每个分发包真的跑一次。
              #
              #   失败会让这一步红 —— 而这是【对的】：0022 的规则是"有能直接
              #   运行的官方二进制就只分发"，而"能直接运行"是那条规则的前提。
              #   跑不起来的二进制不该进仓库。
              #
              #   在【装好的系统里】跑（chroot /newroot），不是构建容器 ——
              #   因为要检的正是"它链的库在这个系统里有没有"。
              n_ok=0; n_bad=0
              for pair in $VENDOR_CHECKS; do
                pkg="${pair%%=*}"; cmd="${pair#*=}"
                if apk --root /newroot info -e "$pkg" >/dev/null 2>&1; then
                  if chroot /newroot /bin/sh -c "$cmd" >/tmp/vc.out 2>/tmp/vc.err; then
                    echo "  [分发包] $pkg: $cmd → ✅ $(head -1 /tmp/vc.out)"
                    n_ok=$((n_ok + 1))
                  else
                    echo "  [分发包] $pkg: $cmd → ❌ 跑不起来"
                    echo "            stderr: $(head -3 /tmp/vc.err)"
                    n_bad=$((n_bad + 1))
                  fi
                else
                  echo "  [分发包] $pkg 不在这个风味里（跳过）"
                fi
              done
              echo "  [分发包] 验了 $n_ok 个 · 挂了 $n_bad 个"
              [ "$n_bad" -eq 0 ] || exit 1
            '
          kill "$(cat /tmp/http.pid)" 2>/dev/null || true

      - name: 发布到 repo.os.yojigen.cn
        if: ${{ inputs.deploy }}
        env:
          S3_AK: ${{ secrets.S3_AK }}
          S3_SK: ${{ secrets.S3_SK }}
          S3_BASE_URL: ${{ secrets.S3_BASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: ./skirt/skirt deploy --arch "${{ matrix.arch }}" --go

      - name: 没有勾 deploy
        if: ${{ !inputs.deploy }}
        run: echo "  干跑：产物留在 Actions 里，没有推到 repo.os.yojigen.cn"

      # 两轮之间要比对的东西：同一批配方在两个不同构建环境下产出的 .apk 哈希。
      # 写进 job summary，跑第二轮时人肉对一眼就知道差多少。
      #
      # ★ 第一轮和第二轮【不会】完全一致，这是预期的：第一轮里 gcc/binutils
      #   这些工具自己是 Debian 的工具编出来的。真正的固定点要看第二和第三轮。
      - name: 摘要 —— 这一轮的产物哈希
        if: always()
        run: |
          {
            echo "### bootstrap [${{ matrix.arch }}]"
            echo
            echo "构建环境: \`${{ inputs.buildenv || 'Debian 底的临时环境' }}\`"
            echo
            echo '```'
            echo "包数: $(ls var/pkgs/${{ matrix.arch }}/*.apk 2>/dev/null | wc -l | tr -d ' ')"
            ls -1 "var/pkgs/${{ matrix.arch }}"/*.apk 2>/dev/null | xargs -r -n1 basename | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
