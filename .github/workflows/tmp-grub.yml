# 临时 —— 试建 grub（用完就删）
#
# 【为什么有这个文件】
#
# grub 的 i386-pc 目标是 32 位代码，所以怀疑它需要 multilib（32 位 glibc 头）。
# 本地实测到一半：
#
#     gcc -m32 连空程序都链不了（cannot find Scrt1.o）✗
#     但 configure --target=i386 --with-platform=pc 过了 ✓
#
# 因为 GRUB 是 freestanding 的，不链 libc。make 那一关没验完——而本地那次是
# 用模拟跑的，被叫停了：★ 编译应该归 CI。CI 上就是原生 x86_64，不用模拟、
# 又快，而且是最终判据。
#
# 与其等 45 个包的正式发布（45 分钟），不如单独把 grub 建一遍（十几分钟），
# 把"要不要先做 multilib"这个问题当场结掉。
#
# ★ 这个文件是临时的：问题结掉之后就删。它不是发布路径的一部分，也不发布
#   任何东西——只是建一次、把产物长什么样打出来。

name: 临时 —— 试建 grub

on:
  workflow_dispatch:

jobs:
  probe:
    name: 试建
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    env:
      SKIRT_CCACHE: ${{ github.workspace }}/.ccache

    steps:
      - name: 取 packages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 取 distro（provides 的依据在那儿）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: YojigenOS/distro
          path: .distro

      - name: 用满整台 runner 的核
        run: echo "SKIRT_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: ccache 缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.SKIRT_CCACHE }}
          key: ccache-${{ runner.os }}-x86_64-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-x86_64-

      - name: 拉我们自己的构建环境
        run: |
          set -euo pipefail
          SRC="yojigenos/base-devel:edge-x86_64"
          docker pull "$SRC"
          docker tag "$SRC" "yojigenos/base-devel:x86_64"
          docker run --rm "$SRC" /usr/bin/bash -c 'echo "  gcc $(/usr/bin/gcc -dumpversion)"'

      - name: 读出 devel 提供了哪些包
        run: |
          set -euo pipefail
          LIST=$(python3 -c "
          import tomllib, pathlib
          v = tomllib.loads(pathlib.Path('.distro/variants/base-devel.toml').read_text())['variant']
          print(' '.join(v['packages']))")
          CLOSURE=$(./skirt/skirt provides $LIST)
          echo "SKIRT_PROVIDES=$(echo $CLOSURE | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "  devel 闭包 $(echo "$CLOSURE" | wc -l) 个包"

      - name: 建 grub
        env:
          SKIRT_BUILDENV: yojigenos/base-devel
        run: |
          set -euo pipefail
          # ★ flex 不在 devel 里（pkgconf 在、flex 不在），所以先建它。
          #   第一次跑就是死在这：36 秒退出，日志里是「依赖 flex 还没有构建」。
          ./skirt/skirt build flex
          ./skirt/skirt build grub
          echo
          echo "── 这个配方自带的断言说了什么 ──"

      - name: 看产物长什么样
        if: always()
        run: |
          set -euo pipefail
          P=$(ls -d var/output/x86_64/grub-*/payload 2>/dev/null | head -1)
          if [ -z "$P" ]; then
            echo "  ✗ 没有产物——构建失败在上面的日志里"
            exit 0
          fi
          echo "── 模块目录 ──"
          for d in "$P"/usr/lib/grub/*/; do
            echo "  $(basename "$d"): $(ls "$d"/*.mod 2>/dev/null | wc -l) 个 .mod"
          done
          echo "── 工具 ──"
          ls -l "$P"/usr/sbin/grub-* "$P"/usr/bin/grub-* 2>/dev/null | awk '{print "  "$NF}'
          echo "── 大小 ──"
          du -sh "$P" | sed 's/^/  /'
          echo "── i386-pc 里有没有 BIOS 引导要的那几个 ──"
          for m in boot.img core.img diskboot.img normal.mod linux.mod ext2.mod part_gpt.mod biosdisk.mod; do
            f="$P/usr/lib/grub/i386-pc/$m"
            printf "  %-16s " "$m"; [ -e "$f" ] && echo "有 ✓" || echo "✗"
          done

      - name: 留存产物（看一眼）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tmp-grub-x86_64
          path: var/output/x86_64/grub-*/
          if-no-files-found: ignore
          retention-days: 3
