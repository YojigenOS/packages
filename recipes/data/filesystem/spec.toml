# filesystem —— 目录骨架、usr-merge 链接与 /etc 基础文件
#
# 这是唯一一个不需要下载任何源码的包：它不构建软件，它构建「系统的形状」。
#
# 它负责三件事：
#   1. 目录骨架（/usr/bin、/usr/sbin、/etc、/var、/tmp、/proc…）
#   2. usr-merge 链接（/bin /sbin /lib /lib64 → usr/），以及 /bin/sh
#   3. /etc 基础文件，包括 /etc/os-release —— Yojigen OS 的身份标识
#
# 在它出现之前，这些东西散落在 gcc（/usr/lib64）和 glibc（usr-merge 链接）
# 里，两处都留着「技术债」注释。现在有了正式的归属。
#
# 注意：gcc 和 glibc 里那两份重复的链接暂时还在。它们与这里的目标一致，
# 叠加时不会冲突；等下次重建这两个包时把各自那份删掉。

[package]
name        = "filesystem"
version     = "1.0"
release     = 19
date        = 2026-10-10T06:54:56Z
description = "目录骨架、usr-merge 链接与 /etc 基础文件"
url         = "https://github.com/YojigenOS/packages"
license     = "MIT"

# 无 [[source]]：纯元数据包。skirt 会跳过下载与解压，给它一个空的源码树。

[dependencies.aarch64]
runtime = []
build   = ["gcc", "make"]

[dependencies.x86_64]
runtime = []
build   = ["gcc", "make"]

[build]
type = "custom"
