# json-c —— JSON 解析库
#
# ★ 第 4 期补的（2026-10-26）：`cryptsetup` 的 LUKS2 元数据是 JSON 格式，
#   它要 json-c 来读写。
#
# ★★ 而它用 **CMake**（实测：只有 CMakeLists.txt，没有 configure / meson.build）。
#
# ★ 它没有运行时依赖（只要 libc）—— 是最"干净"的那种库。

[package]
name        = "json-c"
version     = "0.19"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "JSON 解析库（cryptsetup 的前置）"
url         = "https://github.com/json-c/json-c"
license     = "MIT"

[[source]]
# ★ tag 名字带日期后缀（json-c-0.18-20240915）—— 那是上游的命名习惯，
#   不是版本号的一部分。包名里的 0.18 才是版本。
# ★★ 用 0.19，不是 0.18（2026-10-26 撞到的）：
#
#   0.18 的 `apps/CMakeLists.txt` 第一行是 `cmake_minimum_required(VERSION 2.8)`，
#   而顶层是 `3.9...3.12`。CMake 4.x 移除了小于 3.5 的兼容性：
#
#       CMake Error at apps/CMakeLists.txt:2 (cmake_minimum_required):
#         Compatibility with CMake < 3.5 has been removed from CMake.
#
#   0.19 把两处都改成了 `3.9...3.12`（实测确认）。
url    = "https://github.com/json-c/json-c/archive/refs/tags/json-c-0.19-20260627.tar.gz"
sha256 = "f17a6d7d265cf840dfd8f0f46a606d98c6b5b26dc7cfe27275d1546a213086c8"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["cmake", "make", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["cmake", "make", "gcc"]

[build]
type = "cmake"
