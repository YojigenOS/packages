# libpng —— PNG 图像格式参考库
#
# 这个包的用处是验证依赖机制：它构建时需要 zlib，而 zlib 是 Yojigen OS
# 自己构建的（不在 host/provides.txt 里），所以只能靠 sysroot 传递。

[package]
name        = "libpng"
version     = "1.6.59"
release     = 1
date        = 2026-10-10T05:26:32Z
description = "PNG 图像格式参考库"
section     = "libs"
url         = "http://www.libpng.org/pub/png/libpng.html"
license     = "libpng-2.0"

[[source]]
# 注意：libpng 的 1.7.x 目前仍是 beta（beta89），稳定线是 1.6.x。
# 这里刻意跟稳定线，不跟 1.7 的 beta。
url    = "https://download.sourceforge.net/libpng/libpng-$VERSION.tar.gz"
sha256 = "86a3e4b501f7f50e392c4e456ea158893e9a595b1c63eb88c7bb9f6cf8772dad"

[dependencies]
runtime = ["glibc", "zlib"]
build   = ["zlib", "gcc", "make"]

[dependencies.x86_64]
runtime = ["glibc", "zlib"]
build   = ["zlib", "gcc", "make"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]

# ---------------------------------------------------------------- 备注
#
# 这个包一度被当成"并行竞态"，其实不是。真实原因是 gawk 5.4.1 的一个回归：
# 一个读过但从未赋值的数组元素，参与过比较或判断之后，再当字符串用会变成
# "0" 而不是空串。scripts/options.awk 正是那么用 requires[] 的，于是生成的
# pnglibconf.h 里每一项都成了 undef，最后报出来的是：
#
#     contrib/libtests/pnggetset.c:53: error: implicit declaration of
#         function 'setjmp'
#
# **完全指不到真正的原因。** 修在 gawk 那边（见 recipes/tool/gawk/spec.toml），
# 这个包不需要任何特殊处理。
