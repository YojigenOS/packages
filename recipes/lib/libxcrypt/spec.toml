# libxcrypt —— 密码哈希库（libcrypt 的现代实现）
#
# 进树的原因：**perl 链接了 libcrypt.so.1，而我们的 glibc 不提供它。**
#
# glibc 在 2.28 移除了 libcrypt，各发行版改用 libxcrypt 补上这个 ABI。
# Debian 的构建环境镜像里有它，所以 perl 的 Configure 探测到 crypt() 就
# 链了上去——**而我们的配方里没有声明**。这是自举抓到的第八个没声明的依赖。
#
# 类型上它也是第一个真正用上 autoreconf 的包：项目决定 GitHub 类的源改用
# commit（release 附件可以被替换和移动，commit 不会），而 libxcrypt 是
# autotools 项目，git 树里没有 configure，必须现场生成。

[package]
name        = "libxcrypt"
version     = "4.5.2"
release     = 1
date        = 2026-10-10T16:47:00Z
description = "密码哈希库（crypt(3) 的现代实现）"
section     = "libs"
url         = "https://github.com/besser82/libxcrypt"
license     = "LGPL-2.1-or-later"

[[source]]
# ★ 这里【是】例外：用发行包，不用 commit。
#
# 不是为了省事——是环闭不上。libxcrypt 需要 autoreconf 生成 configure，而
# autoreconf 需要 autoconf，autoconf 是个 Perl 程序，perl 又【运行时链接】
# libxcrypt：
#
#     libxcrypt → autoconf → perl → libxcrypt
#
# 发行包里带着上游跑好的 configure，不需要 autoreconf，环就从这里断了。
# 这是「用发行包」最正当的一个理由：不是这条路不存在，是它会把引导闭上。
#
# （另一个已知例外是 libffi，理由不同，见它的配方。）
#
# release 附件可以被维护者替换，也可以被删除；commit 不能——那棵树是哈希
# 钉死的。sha256 仍然要，因为 GitHub 是按需生成 tarball 的，字节不保证
# 稳定：commit 保证「内容对」，sha256 保证「字节对」。
#
# 见 docs/约定/配方约定.md 的「源」一节。
url    = "https://github.com/besser82/libxcrypt/releases/download/v$VERSION/libxcrypt-$VERSION.tar.xz"
sha256 = "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071"

[dependencies]
runtime = ["glibc"]
# autoreconf 要 autoconf / automake / libtool，它们必须【声明】——
# 否则会悄悄用构建环境镜像里的那份，那就又是隐式依赖了。
build   = ["gcc", "make"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["gcc", "make"]

[build]
# gcc 16 比 Debian 的 gcc 14 严格：strchr 的 const 传播规则变了，于是
# libxcrypt 那两处 `char *hptr = strchr(...)` 变成 -Werror=discarded-qualifiers。
# 上游代码该修，但我们先用一个最小范围的 cflag 放行——**只关这一条警告**，
# 不是关掉 -Werror。
#
# 注意这个只有在【自举】时才暴露：第一遍用 Debian 的 gcc 编，一切正常；
# 换成我们自己的 gcc 16 就死。和 gmp 那个 -std=gnu17 是同一类问题。
cflags = ["-Wno-error=discarded-qualifiers"]
type      = "autotools"
# git 树里没有 configure，现场生成。
configure = [
  "--prefix=/usr",
  "--disable-static",
]
