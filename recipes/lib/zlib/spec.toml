# zlib —— 通用压缩库
#
# 这个包刻意不用声明式构建，用来验证 steps.sh 逃生舱这条路。
#
# ★ 2026-10-15：这一行是【故意】加的，也没有升 release。
#
#   build_key 那次改动需要一次"改了配方而没升 release"的验证 —— 那正是它要
#   治的那个形状（旧的行为是：同名同版本同 release 的 .apk 在，就跳过，于是
#   改动永远不生效）。而这一行只改注释，所以重建出来的包字节完全一样 ——
#   **能验机制，而不会往仓库里推任何不一样的东西。**
#
#   验完就知道该不该留它。留着也无害：它记录的正是"这个包被当过靶子"这件事。

[package]
name        = "zlib"
version     = "1.3.2"
release     = 1
date        = 2026-10-10T05:26:32Z
description = "通用无损压缩库"
url         = "https://zlib.net/"
license     = "Zlib"

[[source]]
# zlib.net 根路径只放最新版，历史版本进 /fossils/。用 fossils 更稳——
# 版本老化后 URL 不会失效。若某次新版还没进 fossils，临时改用根路径。
url    = "https://zlib.net/fossils/zlib-$VERSION.tar.gz"
# 备用源。实测 CI 上从 zlib.net 下到的字节是坏的（本地同一个 URL 下来是好的），
# 而配方当时只有这一个源 → 硬失败 → 整个引导停在 [11/42]，白跑一小时。
# www.zlib.net 是同一台服务器的另一个名字，实测字节一致——换个名字能绕开
# DNS/CDN 层面的问题，而驱动在字节不对时也会换源重试（见 source.py）。
urls = [
  "https://www.zlib.net/fossils/zlib-$VERSION.tar.gz",
]
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["gcc", "make"]

[dependencies.x86_64]
runtime = ["glibc"]
# ★ 这一行的来历（2026-10-15）：原来这一段只写了 `runtime`，而 `build` 是
#   从上面"通用"那段【继承】来的 —— 旧 `deps_for` 是 `deps.update(per_arch)`，
#   按【键】覆盖，所以 `build` 一直好着。
#
#   ★ 而这里一度以为它被盖成空了 —— 那是读【原始 TOML】看出来的假象：
#     文件里确实没写，而解析出来是有的。**"文件里没写"和"解析出来没有"是
#     两件事**，那条判断后来被逐配方比对推翻了（174 个里 0 个语义变化）。
#
#   现在两个架构各写一份、没有"通用"，所以这一行必须显式写出来 ——
#   不是修 bug，是把这个依赖的出处从"继承"改成"写明"。
build   = ["gcc", "make"]

[build]
# custom = 构建步骤全部由 steps.sh 提供
type = "custom"
