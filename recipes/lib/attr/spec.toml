# attr —— 扩展属性工具（getfattr / setfattr）
#
# ★ 对标 Fedora Server 的 comps（core / standard 两组）补进来的（2026-10-25）。
#   这些是"一台能用的服务器该有"的东西，而 Fedora 和 Debian 都有。
#
# ★★ 判据（YG 定的第 1 条）：**基础包要全。**
#   一个系统缺 `lspci` 或 `traceroute`，不是"精简"，是"查不了问题"。

[package]
name        = "attr"
version     = "2.6.0"
release     = 1
date        = 2026-10-25T00:00:00Z
description = "扩展属性工具（getfattr / setfattr）"
url         = "https://savannah.nongnu.org/projects/attr"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://download.savannah.nongnu.org/releases/attr/attr-$VERSION.tar.xz"
sha256 = "6c8a2148a7b85043b68492bce43316b0e2e214fc4e628c7ede078e76e216330b"

[dependencies.aarch64]
runtime = ['glibc']
build   = ['make', 'gcc', 'gettext']

[dependencies.x86_64]
runtime = ['glibc']
build   = ['make', 'gcc', 'gettext']

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]
