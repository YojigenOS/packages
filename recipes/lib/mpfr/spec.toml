# mpfr —— 多精度浮点运算库
#
# 构建和运行时都依赖 gmp。gmp 不在 host/provides.txt 里，
# 所以 skirt 会强制要求先构建它。

[package]
name        = "mpfr"
version     = "4.2.2"
release     = 1
date        = 2026-10-10T04:36:35Z
description = "多精度浮点运算库"
url         = "https://www.mpfr.org/"
license     = "LGPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpfr/mpfr-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/mpfr/mpfr-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/mpfr/mpfr-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/mpfr/mpfr-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/mpfr/mpfr-$VERSION.tar.xz",
]
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"

[dependencies.aarch64]
runtime = ["glibc", "gmp"]
build   = ["make", "gmp", "gcc"]

[dependencies.x86_64]
runtime = ["glibc", "gmp"]
build   = ["make", "gmp", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--enable-shared"]
