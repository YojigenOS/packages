# npth —— 现代可移植线程库
#
# ★ 第 4 期补的（2026-10-26）：它是 `gnupg` 的前置之一，而 gnupg 提供
#   `gpg`/`gpg2` —— 包签名验证、加密通信的标准工具。
#
# ★★ gnupg 的依赖链（实测 configure.ac 里的 NEED_* 宏）：
#
#       gnupg → libgcrypt → libgpg-error
#             → libassuan → libgpg-error
#             → libksba   → libgpg-error
#             → npth
#             → sqlite / bzip2 / zlib / readline（我们都有）
#
#   所以 `libgpg-error` 是整个 gnupg 家族的**最底层** —— 它先建。

[package]
name        = "npth"
version     = "1.8"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "现代可移植线程库"
url         = "https://gnupg.org/software/npth/"
license     = "LGPL-2.1-or-later"

[[source]]
url    = "https://gnupg.org/ftp/gcrypt/npth/npth-$VERSION.tar.bz2"
sha256 = "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["make", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]
