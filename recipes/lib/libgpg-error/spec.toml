# libgpg-error —— GnuPG 错误码与消息目录
#
# ★ 第 4 期补的（2026-10-26）：它是 `gnupg` 的前置之一，而 gnupg 提供
#   `gpg`/`gpg2` —— 包签名验证、加密通信的标准工具。
#
# ★★ gnupg 的依赖链（实测 configure.ac 里的 NEED_* 宏）：
#
#       gnupg → libgcrypt → libgpg-error
#             → libassuan → libgpg-error
#             → libksba   → libgpg-error
#             → npth
#             → sqlite / bzip2 / zlib / readline（我们都有）
#
#   所以 `libgpg-error` 是整个 gnupg 家族的**最底层** —— 它先建。

[package]
name        = "libgpg-error"
version     = "1.61"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "GnuPG 错误码与消息目录"
url         = "https://gnupg.org/software/libgpg-error/"
license     = "LGPL-2.1-or-later"

[[source]]
url    = "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-$VERSION.tar.bz2"
sha256 = "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["make", "gcc", "gettext"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc", "gettext"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]
