# openssl —— 密码学库与工具
#
# 【为什么是 3.5 而不是 4.0】
#
# 4.0.3 是最新的，但 openssl 自己的生命周期表上：
#
#     3.5 [LTS]  openssl-3.5.9   支持到 2030-04-08
#     3.6        openssl-3.6.5   支持到 2026-11-01
#
# 两个都叫「稳定版」，支持期差三年半。对发行版来说这个差别比版本号大小重要得多
# ——跟着 3.6 走意味着一个月后就得升到 4.x，而跟着 3.5 LTS 可以安稳几年。
#
# 【为什么现在才加它】
#
# 待办里早就写着「openssl 更根本：它不只是让 python3 能 https，还是整条信任
# 链的基础」。它一直在路线图 5.8 上，而这次是内核逼出来的：
#
#     certs/extract-cert.c:21:10: fatal error: openssl/bio.h: No such file
#
# 内核内建的信任钥匙串（CONFIG_SYSTEM_TRUSTED_KEYRING）要编 extract-cert，
# 那个小程序用 openssl 读 X.509 证书。它被 SYSTEM_DATA_VERIFICATION 一路
# select 下来，而那条链关不干净——试过直接关 select 源头的四个选项，都不行。
#
# 与其为了绕开它去砍内核的完整性校验（那是真实的损失：固件验签、fs-verity、
# dm-verity 都挂在这条链上），不如把它补上。一次投入，四处受益：
#
#     内核的 certs     不再缺头文件
#     python3 的 ssl   https 能用了
#     curl / git       后面要加的都会用它
#     包签名           决策记录 0006 说 apk 要验签名，那是这个

[package]
name        = "openssl"
version     = "3.5.9"
release     = 2
date        = 2026-10-11T13:30:00Z
description = "密码学库与工具（libcrypto / libssl / openssl 命令）"
url         = "https://openssl-library.org/"
license     = "Apache-2.0"

[[source]]
url    = "https://github.com/openssl/openssl/releases/download/openssl-$VERSION/openssl-$VERSION.tar.gz"
urls = [
  "https://www.openssl.org/source/openssl-$VERSION.tar.gz",
  "https://mirrors.ustc.edu.cn/openssl/source/openssl-$VERSION.tar.gz",
]
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"

[dependencies.aarch64]
runtime = ["glibc"]
# perl 是构建时必需：openssl 的 Configure 和它生成的 Makefile 都是 perl 脚本，
# 这不是可选的辅助工具，是构建系统本身。
build   = ["make", "gcc", "perl"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc", "perl"]

[build]
# custom：openssl 有自己的 Configure（大写 C），不是 autotools
type = "custom"

# ── 运行时库的子包 ────────────────────────────────────────────────────────
#
# openssl 主包 23.8 MB，而里面【运行时】需要的只有两个 .so，6.6 MB：
#
#     libcrypto.so.3    5,707 KB
#     libssl.so.3       1,040 KB
#
# 其余 17 MB 是开发文件和命令行工具：
#
#     libcrypto.a      11,593 KB   ← 静态库
#     libssl.a          2,085 KB   ← 静态库
#     /usr/bin/openssl  1,122 KB   ← 命令行
#     头文件              ~800 KB
#
# ── 为什么现在拆 ──────────────────────────────────────────────────────────
#
# 起因是 apk-tools：它的 runtime 依赖里有 openssl，而它 NEED 的只有那两个 .so。
#
#     libapk.so.3.0.0 NEED: libssl.so.3 · libcrypto.so.3 · libz.so.1 · libc.so.6
#
# 不拆的话，base 为了一个包管理器要多带 24 MB——而其中 17 MB 是它永远用不到
# 的静态库和头文件。拆了之后多带 6.6 MB。
#
# ★ Alpine 也是这么拆的：libcrypto3 · libssl3 · openssl（命令行单独一个包）。
#
# ── 命名 ──────────────────────────────────────────────────────────────────
#
# 用库的通用名（libcrypto / libssl），不带母包前缀——和 gcc 拆出的 libgcc /
# libstdc++ 一致。主包保留命令行和开发文件。
#
# ★ Alpine 的包名带主版本号（libcrypto3 / libssl3），那是为了多版本共存。
#   我们只会有一个 openssl，所以不带。

[[subpackage]]
name        = "libcrypto"
description = "OpenSSL 的加密库（libcrypto.so.3）"
# ★ 显式声明，不用默认的"继承主包 runtime"——那个默认是保守的过度声明，
#   会把主包的依赖（这里是 glibc）都带上。这两个库实际只需要 glibc 和 zlib，
#   而它们的 so: 依赖会被 ELF 扫描自动补齐。
# ★ provider-priority = 100 —— 让 apk 【自动选中】这个提供者。
#
#   没有它，apk 拒绝自动解析 so: 依赖：
#
#       ERROR: unable to select packages:
#         so:libcrypto.so.3 (virtual):
#           note: please select one of the 'provided by' packages explicitly
#           provided by: libcrypto
#           required by: openssl-3.5.9-r1[so:libcrypto.so.3]
#
#   ★ 而 Alpine 的同一个包【有】这个字段：
#
#       provider_priority = 100
#       provides = so:libcrypto.so.3=3
#
#   实测对照过：apk 在 Alpine 自己的仓库上会自动选中 libcrypto3/libssl3，
#   在我们的仓库上不会——差别就是这个字段。
#
#   ★ 为什么是"两个提供者"之外的场景也要设：so: 这种虚名的提供关系是 apk
#     【自动扫 ELF 扫出来的】，配方里根本没写。没有优先级的自动提供，apk
#     当成"提示"而不是"候选"，于是要人显式指名。
#
#   100 和 dash（提供 /bin/sh）一致，也和 Alpine 一致。
provider-priority = 100
depends     = ["glibc", "zlib"]
# `*` 不跨 `/`，所以这个模式匹配 .so.3 和 .so.3.x，但【不】匹配
# usr/lib/libcrypto.so——最后那个是给链接器的开发文件，不该在运行时包里。
files       = ["usr/lib/libcrypto.so.3*"]

[[subpackage]]
name        = "libssl"
description = "OpenSSL 的 TLS 库（libssl.so.3）"
# ★ provider-priority = 100 —— 让 apk 【自动选中】这个提供者。
#
#   没有它，apk 拒绝自动解析 so: 依赖：
#
#       ERROR: unable to select packages:
#         so:libcrypto.so.3 (virtual):
#           note: please select one of the 'provided by' packages explicitly
#           provided by: libcrypto
#           required by: openssl-3.5.9-r1[so:libcrypto.so.3]
#
#   ★ 而 Alpine 的同一个包【有】这个字段：
#
#       provider_priority = 100
#       provides = so:libcrypto.so.3=3
#
#   实测对照过：apk 在 Alpine 自己的仓库上会自动选中 libcrypto3/libssl3，
#   在我们的仓库上不会——差别就是这个字段。
#
#   ★ 为什么是"两个提供者"之外的场景也要设：so: 这种虚名的提供关系是 apk
#     【自动扫 ELF 扫出来的】，配方里根本没写。没有优先级的自动提供，apk
#     当成"提示"而不是"候选"，于是要人显式指名。
#
#   100 和 dash（提供 /bin/sh）一致，也和 Alpine 一致。
provider-priority = 100
depends     = ["glibc", "zlib", "libcrypto"]
files       = ["usr/lib/libssl.so.3*"]
