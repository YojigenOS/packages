# GNU Hello —— 打招呼的示例程序
#
# 这是 Yojigen OS 的第一个配方，用来验证构建系统本身。
#
# 它顺带是**整条国际化链路的冒烟测试**：装了 gettext 之后，hello 的中文
# 翻译应该被真正编译并安装。跑 `LANG=zh_CN.UTF-8 hello` 看到中文，
# 就说明 gettext、NLS、locale 三件事都对了——这三件事各自都可能静默失败。

[package]
name        = "hello"
version     = "2.12.3"
release     = 1
date        = 2026-10-10T05:26:32Z
description = "GNU Hello，打招呼的示例程序"
url         = "https://www.gnu.org/software/hello/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/hello/hello-$VERSION.tar.gz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/hello/hello-$VERSION.tar.gz",
  "https://mirror.nju.edu.cn/gnu/hello/hello-$VERSION.tar.gz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/hello/hello-$VERSION.tar.gz",
  "https://mirrors.aliyun.com/gnu/hello/hello-$VERSION.tar.gz",
]
sha256 = "0d5f60154382fee10b114a1c34e785d8b1f492073ae2d3a6f7b147687b366aa0"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["gettext", "gcc", "make"]

# 架构特定依赖：现在留形状，暂不使用。
# 展开时会整体覆盖 [dependencies] 里同名的键。
[dependencies.x86_64]
runtime = ["glibc"]
# ★ 这一行的来历（2026-10-15）：原来这一段只写了 `runtime`，而 `build` 是
#   从上面"通用"那段【继承】来的 —— 旧 `deps_for` 是 `deps.update(per_arch)`，
#   按【键】覆盖，所以 `build` 一直好着。
#
#   ★ 而这里一度以为它被盖成空了 —— 那是读【原始 TOML】看出来的假象：
#     文件里确实没写，而解析出来是有的。**"文件里没写"和"解析出来没有"是
#     两件事**，那条判断后来被逐配方比对推翻了（174 个里 0 个语义变化）。
#
#   现在两个架构各写一份、没有"通用"，所以这一行必须显式写出来 ——
#   不是修 bug，是把这个依赖的出处从"继承"改成"写明"。
build   = ["gettext", "gcc", "make"]

[build]
type      = "autotools"
configure = ["--prefix=/usr"]
