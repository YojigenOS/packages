# gcc —— GNU 编译器集合
#
# 工具链的第三环，也是整条链上最重的一块。它依赖 gmp / mpfr / mpc
# 三个数学库（都已由 Yojigen OS 自建）。
#
# 关于 --disable-bootstrap：
#   默认情况下 gcc 会编译三遍，并要求第二遍和第三遍逐位一致——
#   那是编译器的自我验证。但我们这一步是「用宿主的 gcc 编译出 gcc」，
#   真正的自验证要等「用我们自己的 gcc 重建 gcc」那一步才有意义。
#   现在开 bootstrap 只是多等一小时，所以先关掉。

[package]
name        = "gcc"
version     = "16.2.0"
release     = 2
date        = 2026-10-10T05:13:26Z
description = "GNU 编译器集合（C / C++）"
section     = "core"
url         = "https://gcc.gnu.org/"
license     = "GPL-3.0-or-later WITH GCC-exception-3.1"

[[source]]
# 注意 gcc 的目录结构和别的 GNU 包不同：多一层版本号目录
url    = "https://ftp.gnu.org/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/gcc/gcc-$VERSION/gcc-$VERSION.tar.xz",
]
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"

[dependencies]
# binutils 必须是运行时依赖：gcc 自己不汇编也不链接，它调用 `as` 和 `ld`。
#
# 这个漏声明是被自举试出来的。换掉构建环境之后，同一个配方产出的 hello 二进制
# 多了一个 GCS 位（BTI, PAC, GCS 而不是 BTI, PAC）。查下去才发现：声明里没有
# binutils，所以构建 sysroot 里没有它，gcc 只好用构建环境镜像自带的那份——
# Debian 的 as 2.44。我们自己的 binutils 2.47 根本没用上，而且没有任何地方报错。
#
# 加上它之后，Debian 环境里构建也会用我们自己的 as，两边就一致了。
runtime = ["glibc", "binutils", "gmp", "mpfr", "mpc"]
build   = ["make", "gmp", "mpfr", "mpc"]

[dependencies.x86_64]
runtime = ["glibc", "binutils", "gmp", "mpfr", "mpc"]
build   = ["make", "gmp", "mpfr", "mpc"]

[build]
# custom：GCC 16 的 -latomic_asneeded 在构建期有一个上游路径不一致，
# 需要在构建中途插一步。声明式表达不了，全部放进 steps.sh。
# 构建方式仍是 autotools（且必须是离开源码树的），见 steps.sh。
type = "custom"

# ── 运行时库的子包 ────────────────────────────────────────────────────────
#
# gcc 这个主包是 256 MB（头文件、静态库、编译器本体）。而它里面真正
# 【运行时】需要的只有两个文件，加起来 2.8 MB：
#
#     /usr/lib/libgcc_s.so.1        133,712 字节
#     /usr/lib/libstdc++.so.6.0.36  2,829,848 字节
#
# 差 89 倍。所以任何需要 C++ 运行时的东西（比如 ninja），都不该为了这两个
# 文件把 256 MB 拖进来。
#
# ★ 这三个子包一次解决三件事：
#
#   ① base 缺 libgcc_s。对比 debian:stable-slim 时发现的——我们的 base
#      里没有任何 C++ 程序能跑。
#   ② 官方 ninja 是 C++ 写的，它 NEED libstdc++.so.6 和 libgcc_s.so.1。
#      没有 libstdc++ 子包，ninja 的依赖只能写 "gcc"，而那是 256 MB。
#   ③ 顺带：任何用 C++ 写的包都会遇到同样的问题。
#
# ── 关于通配 ──────────────────────────────────────────────────────────────
#
# `*` 不跨 `/`（见 collect.py 的 _glob），所以 `usr/lib/libstdc++.so.6*`
# 匹配 `.so.6` 和 `.so.6.0.36`，但【不】匹配 `usr/lib/libstdc++.so`——
# 最后那个是给链接器用的开发文件，不该在运行时包里。
#
# ★ 不写死版本号（.6.0.36）：那会随 gcc 升级而变，而写死的后果是升级之后
#   子包突然收不到文件，产出一个"能装但跑不起来"的包。
#
# ★ 子包匹配是【第一个匹配的获胜】，所以顺序有意义——这里三个的模式互不
#   重叠，但将来加东西时要留意。

[[subpackage]]
name        = "libgcc"
description = "GCC 的运行时库（libgcc_s.so.1）"
section     = "libs"
# ★ 不继承主包的 runtime——那里面有 gmp/mpfr/mpc，而这两个文件一个都不需要。
#   实际依赖由 ELF 扫描补齐（libc.so.6 和 ld-linux）。
# ★ provider-priority = 100 —— 让 apk 【自动选中】这个提供者。
#
#   没有它，apk 拒绝自动解析 so: 依赖：
#
#       ERROR: unable to select packages:
#         so:libcrypto.so.3 (virtual):
#           note: please select one of the 'provided by' packages explicitly
#           provided by: libcrypto
#           required by: openssl-3.5.9-r1[so:libcrypto.so.3]
#
#   ★ 而 Alpine 的同一个包【有】这个字段：
#
#       provider_priority = 100
#       provides = so:libcrypto.so.3=3
#
#   实测对照过：apk 在 Alpine 自己的仓库上会自动选中 libcrypto3/libssl3，
#   在我们的仓库上不会——差别就是这个字段。
#
#   ★ 为什么是"两个提供者"之外的场景也要设：so: 这种虚名的提供关系是 apk
#     【自动扫 ELF 扫出来的】，配方里根本没写。没有优先级的自动提供，apk
#     当成"提示"而不是"候选"，于是要人显式指名。
#
#   100 和 dash（提供 /bin/sh）一致，也和 Alpine 一致。
provider-priority = 100
depends     = ["glibc"]
# .so.1 是运行时；.so 是给链接器的符号链接（132 字节），也一并收着——
# 有些构建会直接 -lgcc_s。
files       = ["usr/lib/libgcc_s.so.1", "usr/lib/libgcc_s.so"]

[[subpackage]]
name        = "libstdc++"
description = "GCC 的 C++ 标准库（libstdc++.so.6）"
section     = "libs"
provider-priority = 100
depends     = ["glibc", "libgcc"]
files       = ["usr/lib/libstdc++.so.6*"]
