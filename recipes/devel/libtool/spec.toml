# libtool —— 把共享库的构建差异包起来
#
# 同一条链上的第三个。有些项目的 autoreconf 会因为找不到 libtoolize 而失败。
# 它靠 m4 宏工作。

[package]
name        = "libtool"
version     = "2.6.2"
release     = 1
date        = 2026-10-10T16:16:00Z
description = "通用共享库构建工具"
section     = "devel"
url         = "https://www.gnu.org/software/libtool/"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/libtool/libtool-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/libtool/libtool-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/libtool/libtool-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/libtool/libtool-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/libtool/libtool-$VERSION.tar.xz",
]
sha256 = "2ef1067c16c97db930fd740cc9bc3d3ba9a583804ae5ac42cc3e8719e49e191e"

[dependencies]
runtime = ["glibc", "m4"]
build   = ["gcc", "make", "m4"]

[dependencies.x86_64]
runtime = ["glibc", "m4"]
build   = ["gcc", "make", "m4"]

[build]
type = "autotools"
configure = ["--prefix=/usr"]
