# autoconf —— 从 configure.ac 生成 configure
#
# 进树的原因：**从 git commit 构建 autotools 项目**。
#
# 发行版 tarball 里通常带着上游跑好的 configure（所以我们一直不需要它），
# 但 git 树里没有——那些生成物不在版本控制里。项目决定 GitHub 类的源改用
# commit（release 附件可以被替换和移动，commit 不会），于是这条链变成必需。
#
# 它本身是个 Perl 程序。

[package]
name        = "autoconf"
version     = "2.73"
release     = 1
date        = 2026-10-10T16:12:00Z
description = "从 configure.ac 生成可移植的 configure 脚本"
url         = "https://www.gnu.org/software/autoconf/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/autoconf/autoconf-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/autoconf/autoconf-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/autoconf/autoconf-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/autoconf/autoconf-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/autoconf/autoconf-$VERSION.tar.xz",
]
sha256 = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"

[dependencies.aarch64]
# perl 和 m4 都是【运行时】依赖：autoconf 是 Perl 程序，而它生成 configure
# 的过程就是在跑 m4 宏。
runtime = ["glibc", "perl", "m4"]
build   = ["gcc", "make", "perl", "m4"]

[dependencies.x86_64]
runtime = ["glibc", "perl", "m4"]
build   = ["gcc", "make", "perl", "m4"]

[build]
type = "autotools"
configure = ["--prefix=/usr"]
