# make —— GNU Make
#
# 这个包的特殊之处不在它自己，而在于它是构建其他所有包的工具。
#
# 它一旦自建成功，「用 Yojigen OS 构建 Yojigen OS」在工具层面就成立了：
# 从此构建任何包所用的 make，都是我们自己构建出来的那一个。
#
# 注意 [dependencies.aarch64] 里的 build = ["make"]：构建 make 需要 make。
# （★ 这句注释在 2026-10-15 之前是【错的】—— 那时候这一段叫 `[dependencies]`。
#   那天两个架构各拆成显式一份，它才变对。）
# 第一次构建时 make 还在 host/provides.txt 里，会被跳过；一旦把它从
# 那份列表里删掉，之后重建 make 用的就是 output/ 里已有的自建 make。
# 这正是自举该有的样子。

[package]
name        = "make"
version     = "4.4.1"
release     = 1
date        = 2026-10-10T06:07:59Z
description = "GNU Make，构建自动化工具"
url         = "https://www.gnu.org/software/make/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/make/make-$VERSION.tar.gz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/make/make-$VERSION.tar.gz",
  "https://mirror.nju.edu.cn/gnu/make/make-$VERSION.tar.gz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/make/make-$VERSION.tar.gz",
  "https://mirrors.aliyun.com/gnu/make/make-$VERSION.tar.gz",
]
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["make"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-nls"]
