# python3 —— Python 解释器
#
# 为什么构建环境需要它：
#
#   glibc      configure 直接要求（自举时它报 missing: bison python）
#   meson      本身就是 Python 写的
#
# 为什么【不在成品系统里】：它是构建环境的工具，不是运行时的一部分。
# base（容器基础镜像）的包列表里没有它，17 MB 那个数字不受影响。
#
# 版本选 3.14.8 而不是刚发布的 3.15.0：它只在构建环境里跑，稳比新重要。
# 等它进了 minimal 那条线、真的给用户用，再谈要不要跟最新。
#
# ## 没有开的东西，都是有意的
#
#   --enable-optimizations   PGO：要跑一整套测试来采集剖面，慢好几倍。
#                            构建环境的解释器不值得。
#   --with-lto               同理。
#   --enable-shared          默认静态更简单，没有 rpath 那堆事。构建脚本
#                            只是拿它当解释器用。
#   ensurepip                不带 pip。树里没有 wheel/setuptools，
#                            而且构建不该从网上拿东西。
#
# ## 那些模块 —— 2026-10-18 起【要它们了】
#
#   _ssl      要 openssl
#   readline  要 readline
#   curses    要 ncurses
#
# ★★ 这一节原来写的是「三个都是可选的，python 会自己跳过并列出没编成的模块」。
#   **那句话在 2026-10-18 不成立了** —— 而它不成立的方式很值得记：
#
#     那天 readline 被加进了构建环境（`devel.toml` 的闭包里有它，因为 bash
#     要它）。于是 python 的 configure 【看到了一份 libreadline.so.8】——
#     而那一份是【旧的、缺 ncurses 链接的】—— 于是它【不跳过了】，试着链上，
#     而 `make sharedinstall` 停在：
#
#         [ERROR] readline failed to import: /usr/lib/libreadline.so.8:
#                 undefined symbol: UP
#         install: cannot stat 'Modules/readline.cpython-…so'
#
#   ★ 也就是说：「可选」和「环境里没有」是两件事，而它们原来碰巧一致。
#     一旦环境里有了（哪怕那一份是坏的），它就【不再可选】了。
#
#   ★ 而更早的一版注释（2026-10-15 之前）把这几个都写成「还没建」，
#     而 `openssl` / `ncurses` 早就建出来了 —— 那次改的是说法，这次改的是
#     做法：**依赖表里真的写上它们**，于是顺序也对（readline 会排到 python3
#     前面，而不是让 python3 碰巧捡到环境里那份）。
#
# ★ 这三样在 minimal 那条线上都要（用户的系统里 python 该有 ssl 和行编辑）。
#   它们现在都在 devel 的闭包里，所以写上它们不会引入新的构建负担。
#
# ★★ 而「那一份是坏的」在 2026-10-20 修掉了 —— 根因不在 python，在 readline
#   的配方：它的 configure 少了 `--with-shared-termcap-library`，于是那个
#   `libreadline.so.8` 【没用 NEEDED 指向 libncursesw】。见
#   `recipes/lib/readline/spec.toml` 里那一大段（有实测证据）。
#
#   **所以上面第 12 行那句「旧的、缺 ncurses 链接的」现在记的是历史，
#   不是现状。** 留着它是因为它解释了"为什么依赖表里要写这三样"的来历 ——
#   而那件事仍然对（顺序要对，不能靠碰巧捡到环境里那份）。

[package]
name        = "python3"
version     = "3.14.8"
release     = 1
date        = 2026-10-10T15:32:00Z
description = "Python 解释器"
url         = "https://www.python.org/"
license     = "PSF-2.0"

[[source]]
# 主源 python.org（它自己托管的正式发布包，字节稳定）。
# 备选是它在新加坡的镜像。见 docs/约定/配方约定.md。
url    = "https://www.python.org/ftp/python/$VERSION/Python-$VERSION.tar.xz"
urls = ["https://mirrors.aliyun.com/python-release/source/Python-$VERSION.tar.xz"]
sha256 = "c2215904f02b175596dc49351585104f4bc20341e1c47378b26a2c274360ce73"

[dependencies.aarch64]
# ★★★ 2026-10-18：加了 readline / ncurses / openssl —— 都是【两处都要】。
#
#   理由见上面「那些模块」那一节：不写它们，python 会碰巧捡到构建环境里那份，
#   而那份可能是坏的（readline 那次就是）。而写上之后顺序也对 —— readline
#   会排在 python3 前面。
#
#   ★ ncurses 在这里不是多余：readline 的 configure 要能找到 termcap，而
#     那是 ncurses 提供的。python 链 readline 就要它。
runtime = ["glibc", "expat", "libffi", "zlib", "readline", "ncurses", "openssl"]
build   = ["make", "gcc", "expat", "libffi", "zlib", "readline", "ncurses", "openssl"]

[dependencies.x86_64]
# ★★★ 2026-10-18：加了 readline / ncurses / openssl —— 都是【两处都要】。
#
#   理由见上面「那些模块」那一节：不写它们，python 会碰巧捡到构建环境里那份，
#   而那份可能是坏的（readline 那次就是）。而写上之后顺序也对 —— readline
#   会排在 python3 前面。
#
#   ★ ncurses 在这里不是多余：readline 的 configure 要能找到 termcap，而
#     那是 ncurses 提供的。python 链 readline 就要它。
runtime = ["glibc", "expat", "libffi", "zlib", "readline", "ncurses", "openssl"]
build   = ["make", "gcc", "expat", "libffi", "zlib", "readline", "ncurses", "openssl"]

[build]
type = "autotools"
configure = [
  "--prefix=/usr",
  "--without-ensurepip",
  # 用树里已经有的 expat 和 libffi，不用它自带的那两份副本——
  # 同一份代码在树里只该有一个出处。
  "--with-system-expat",
  "--with-system-ffi",
]
