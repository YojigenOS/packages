# iputils —— ping / arping / tracepath / clockdiff
#
# 【为什么它排在第二档第一个】
#
# 排障的第一步几乎总是"通不通"。而 `ping` 是回答这个问题最短的路。
# （`ip` 能做很多事，但它不能发 ICMP。）

[package]
name        = "iputils"
version     = "20250605"
release     = 3
date        = 2026-10-13T16:00:00Z
description = "网络工具（ping / arping / tracepath / clockdiff）"
section     = "net"
url         = "https://github.com/iputils/iputils"
license     = "GPL-2.0-or-later AND BSD-3-Clause"

[[source]]
git    = "https://github.com/iputils/iputils"
commit = "6e1cb146547eb6fbb127ffc8397a9241be0d33c2"
# ★ tag 20250605 的 peeled 值。

[dependencies.aarch64]
runtime = ["glibc", "libcap"]
build   = ["make", "gcc", "meson", "ninja", "libcap"]
[dependencies.x86_64]
runtime = ["glibc", "libcap"]
build   = ["make", "gcc", "meson", "ninja", "libcap"]

[build]
type = "meson"
configure = [
    # ★ 关掉三样东西，每样都有具体理由：
    #
    #   ① man 页要 xsltproc（我们从没打过它）—— 而 man 页生成失败会
    #      连带整个构建挂掉。
    #   ② 测试要一个能跑的 ping（要 CAP_NET_RAW），在容器里不一定成。
    #   ③ systemd 单元 —— 我们还没有 systemd，装了也是死文件。
    "-DBUILD_MANS=false",
    "-DSKIP_TESTS=true",
    "-DINSTALL_SYSTEMD_UNITS=false",

    # ★★ 而 ④ 是这一轮补上的，它是"ping 装上了但不能用"的那个根。
    #
    #   它有一对选项，写法很别扭：
    #
    #       NO_SETCAP_OR_SUID       boolean  value: true    ← ★ 默认【true】= 禁用
    #       SETCAP_OR_SUID_PING     boolean  value: true    ← 这个默认是 true
    #
    #   而 meson.build 里是
    #
    #       setcap_ping = false
    #       if (not get_option('NO_SETCAP_OR_SUID')):
    #           setcap_ping = get_option('SETCAP_OR_SUID_PING')
    #
    #   **一个双重否定，加一个"看起来开着其实被关着"的默认值。**
    #   于是 ping 装出来是普通的 -rwxr-xr-x，普通用户敲它只会得到
    #   "socket: Operation not permitted"。
    #
    #   实测（把 17 个包装进一个新 root，chroot 里数扩展属性）：
    #       ping: -rwxr-xr-x root root      没有能力位，也没有 setuid
    #
    #   而它自己的逻辑是：有 libcap 且找得到 setcap 就用【能力位】
    #   （cap_net_raw+ep），否则退回 setuid。我们两样都有，所以会走能力位。
    "-DNO_SETCAP_OR_SUID=false",
]
