# chrony —— NTP 客户端/服务端
#
# 【为什么服务器上必须有它】
#
# 时间不对的后果比看上去大：TLS 证书"还没生效"或"已过期"、
# 日志里的时间戳对不上因果、`make` 觉得文件是从未来来的而跳过重建。
# 而云主机的时间会飘 —— 虚拟化那层不保证它准。
#
# 相比 ntpd，chrony 在【间歇性联网】和【时钟走得很偏】这两种情况下好得多，
# 而那正是虚拟机常见的状态。

[package]
name        = "chrony"
version     = "4.9"
release     = 3
date        = 2026-10-13T17:00:00Z
description = "NTP 时间同步（客户端与服务端）"
url         = "https://chrony-project.org/"
license     = "GPL-2.0-only"

[[source]]
git    = "https://gitlab.com/chrony/chrony"
commit = "8df4f1263e206585e6c4e61352d042c2dd12916a"

[dependencies.aarch64]
runtime = ["glibc", "libcap"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "libcap"]
[dependencies.x86_64]
runtime = ["glibc", "libcap"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "libcap"]

[build]
# ★★ 它不是 autotools —— 是【手写 configure + Makefile.in】的项目。
#
#   实测（走过一次弯路）：原来写的是 type = "autotools" + autoreconf = true，
#   报的是
#
#       autoreconf: error: 'configure.ac' is required
#
#   而那句是【真的】—— 它的树里确实没有 configure.ac：
#
#       git ls-tree HEAD →  .gitignore COPYING Makefile.in NEWS README
#                           configure contrib doc examples getdate.y
#                           make_release test …（159 条，全是 .c/.h 加这些）
#
#   它有【现成的 configure】。所以既不用 autoreconf，也不该套驱动对
#   autotools 的那几个假设（比如它一定会认 --libdir）。
#
#   ★ 这和 iproute2 同一类：**"配方按惯例填的那个 type"和"上游实际的构建方式"
#     是两件事**，而判断依据只有一个 —— 去看它的树。
#
#   所以走 custom，configure 和 make 都由 steps.sh 明说。
type = "custom"
# ★ 这一段 `configure` 2026-10-15 删掉了 —— 它是【死代码】。
#   这个配方的 `steps.sh` 重定义了 `build()`，而 `steps.sh` 是在
#   `run.sh` 定义完默认实现【之后】被 source 的，所以它整体覆盖 ——
#   驱动代码里那句注释写得很清楚：
#       "# steps.sh 若存在，可以通过重定义上面任意函数来覆盖默认行为"
#
#   危险的地方不是重复，是**改在这一份上不会生效而没有任何提示**。
#   真正在用的那份在 `steps.sh` 里（删之前逐条比对过，两边一致）。
