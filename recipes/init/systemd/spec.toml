# systemd —— 决策记录 0022 里"必须自己建"的那一个
#
# 0022 把交付物分成两类，判据是**上游给不给通用二进制**：
#
#     上游给通用二进制的   = 应用 → 只分发
#     上游给不了的         = 系统 → 自己建
#          内核 · libc · 引导器 · init · 包管理器 · **systemd** …
#
# 而它原文还写着：「systemd 那条也没被绕开：它是 1panel 的硬前提，而它按这条
# 规则必须自己建。**该难的还是难**。」
#
# ── 这个配方怎么"把难的地方关掉" ──────────────────────────────────────────
#
# systemd 的依赖列表很长，但**大部分是 `required : get_option(...)`** —— 可以关。
# 我们数过（v258 的 meson.build）：唯一的硬程序依赖是 `gperf`。
#
# 而关哪些，判据都是**我们这台系统的实际情况**，不是"省事"：
#
#   -Dudev=false       ★★ 内核 CONFIG_MODULES **没开**（只有个残留的
#                      MODULES_USE_ELF_RELA 符号）。没有模块加载，udev 存在的
#                      理由就没了 —— 我们的设备节点靠 boot.d 里的 mount 和
#                      CONFIG_DEVTMPFS 出来。
#   -Dkmod=false       同上。
#   -Dseccomp=false    libseccomp 没建；而 SECCOMP 那侧内核是开的，不影响。
#   -Dapparmor=false -Dselinux=false   都不做。
#   -Daudit=false      libaudit 没建。
#   -Dpam=false -Dlogind=false        没有 PAM。1Panel 不用 logind。
#   -Dcryptsetup=false -Dlibcryptsetup=false -Delfutils=false
#   -Dgcrypt=false（用 openssl）-Dlibidn2=false -Dlz4=false -Dmicrohttpd=false
#   -Dqrencode=false -Dgnutls=false -Dlibcurl=false -Dpolkit=false
#   -Dman=false -Dhtml=false           文档要 docbook，给人看的。
#   -Dtests=false
#   -Dfirstboot=false -Dquotacheck=false
#   -Dnetworkd=false -Dresolved=false  我们用自己的 15-network + dhcpcd。
#   -Defi=false -Dtpm=false -Dima=false -Dbpf-framework=false
#
# ★ 而**留下的**都是 1Panel 或我们自己真用的：
#   hostnamed（主机名页）· timedated（时间页）· tmpfiles · sysusers
#   journald（它要读日志）· sysv-generator（读 /etc/init.d + rc2.d）
#
# ★★ 还有一条关键的：`-Dsysvinit-path` / `-Dsysvrcnd-path` 指向我们已有的
#     那套 SysV 兼容骨架 —— 于是 1Panel 装的服务在 systemd 下**照样能起**，
#     不需要为它改任何东西。

[package]
name        = "systemd"
version     = "258"
release     = 7
date        = 2026-10-22T10:30:00Z
description = "系统与服务管理器（决策记录 0022：自己建）"
url         = "https://systemd.io/"
license     = "LGPL-2.1-or-later"
# ★★ systemd 也提供 usr/sbin/reboot 和 usr/sbin/poweroff，而 `yojigen-os-init`
#   也在提供（那两个脚本就是"没有 systemd 时的替代"，它们自己的注释里写着
#   "Alpine → busybox，Debian → systemd"）。
#
#   不写这一行的话，装 systemd 时 apk 直接报：
#       ERROR: trying to overwrite usr/sbin/reboot owned by yojigen-os-init-1.0-r11
#
#   ★ 而这两个命令该由 systemd 接管 —— 它知道 cgroup 里还有什么在跑。
replaces    = ["yojigen-os-init"]

[[source]]
# ★ 用 upstream 的 tag tarball（不是 release 里的 .tar.gz）：
#   github 的 archive 接口给的是同一个 git 树，而 systemd 官方发布页
#   （github.com/systemd/systemd-stable）只在特定版本上才更新。
url    = "https://github.com/systemd/systemd/archive/refs/tags/v$VERSION.tar.gz"
sha256 = "07a580cf21856f468f82b77b82973a926f42ccc696462459b53f8b88893dff8e"

[dependencies.aarch64]
runtime = ["glibc", "util-linux", "openssl", "zstd", "xz", "libcap"]
build   = ["meson", "ninja", "gcc", "pkgconf", "gperf", "python3", "jinja2",
           "util-linux", "openssl", "zstd", "xz", "libcap"]

[dependencies.x86_64]
runtime = ["glibc", "util-linux", "openssl", "zstd", "xz", "libcap"]
build   = ["meson", "ninja", "gcc", "pkgconf", "gperf", "python3", "jinja2",
           "util-linux", "openssl", "zstd", "xz", "libcap"]

[build]
type = "meson"
# ★★ gcc 16 把 `-Wdiscarded-qualifiers` 变严了，而 systemd 用 `-Werror`：
#
#       src/basic/string-util.h:13:16: error: return discards 'const' qualifier
#                                       from pointer target type
#                                       [-Werror=discarded-qualifiers]
#
#   `strstr()` 的参数是 `const char*` 而返回 `char*` —— 上游那个 helper 返回
#   `char*`，于是一次"丢弃 const"的返回。旧 gcc 不报，gcc 16 报。
#
# ★ 只降级这一条，**不关掉 `-Werror`** —— 那会掩盖真问题。
#   同一个做法在 `recipes/lib/libxcrypt` 里已经用过（同一个 gcc 16 的坑）。
cflags = ["-Wno-error=discarded-qualifiers"]
# ★ GitHub 的 tag tarball 转义了文件名里的反斜杠，撞坏了 test/fuzz 那层保护
patches = ["0001-skip-github-escaped-fuzz-filenames.patch"]
configure = [
    # ★ v258 里 `mode` 只有 developer/release —— **"是不是 PID 1"不再是构建选项**
    #   （它在运行时判断）。原来写 `systemd` 会让 meson 当场报
    #   "Value "systemd" for option "mode" is not one of the choices"。
    # ★★ jinja2 是硬依赖（meson.build 里 `required : true`），见 devel/jinja2
    "-Dmode=release",
    # ── 关的（理由见文件头）──────────────────────────────────────────
    # ★★ v258 里 **udev 没有开关**了 —— 它无条件建（meson.build 里直接
    #   `subdir('src/udev')`）。而那不是问题：udev 的**构建**不依赖内核有没有
    #   CONFIG_MODULES（那是运行时的事）。我们把 `-Dkmod=false` 给它，
    #   它的模块加载那部分自动缩掉。
    "-Dkmod=false",
    "-Dseccomp=false",
    "-Dapparmor=false",
    "-Dselinux=false",
    "-Daudit=false",
    "-Dpam=false",
    "-Dlogind=false",
    "-Dlibcryptsetup=false",
    "-Delfutils=false",
    "-Dgcrypt=false",
    "-Dlibidn2=false",
    "-Dlz4=false",
    "-Dmicrohttpd=false",
    "-Dqrencode=false",
    "-Dgnutls=false",
    "-Dlibcurl=false",
    "-Dpolkit=false",
    "-Dman=false",
    "-Dhtml=false",
    "-Dtests=false",
    "-Dfirstboot=false",
    "-Dquotacheck=false",
    "-Dnetworkd=false",
    "-Dresolve=false",
    "-Defi=false",
    "-Dtpm=false",
    "-Dima=false",
    "-Dbpf-framework=false",
    # ── 留的 ────────────────────────────────────────────────────────
    "-Dopenssl=true",
    "-Dzstd=true",
    "-Dxz=true",
    "-Dblkid=true",
    "-Dsysusers=true",
    "-Dtmpfiles=true",
    "-Dhostnamed=true",
    "-Dtimedated=true",
    "-Dlocaled=true",
    # ★★★ 把发行版的 GID 表传给 systemd（2026-10-23）。
    #
    #   `sysusers.d/basic.conf` 里是 `g utmp {{UTMP_GID}}`，而 meson 那个选项的
    #   **默认值是 0（"没指定"）** —— 于是 sysusers 只能运行时动态分配（我们撞到
    #   998）。动态分配的后果是同一次启动里"组还没建出来"的竞态，而它让
    #   `wtmp` 建不出来、`systemd-update-utmp` 失败、整个启动停在 sysinit。
    #
    #   ★ 而 `files/etc/group`（filesystem 包）里是**静态**的一张表 ——
    #     两个来源必须一致，否则 sysusers 会报"组已存在但 GID 不同"。
    #
    #   ★ 这里填的值**照 Debian 的 base-passwd 抄**（那套从 1990 年代沿用至今，
    #     是事实上的标准）。只填 `files/etc/group` 里真有的那些 —— 没有的组
    #     让它保持默认（sysusers 会跳过不存在的组定义）。
    "-Dutmp-gid=43",
    "-Dtty-gid=5",
    "-Ddisk-gid=6",
    "-Dlp-gid=7",
    "-Dkmem-gid=15",
    "-Ddialout-gid=20",
    "-Dcdrom-gid=24",
    "-Dtape-gid=26",
    "-Daudio-gid=29",
    "-Dvideo-gid=44",
    "-Dusers-gid=100",
    "-Dadm-gid=4",
    # ★★ SysV 兼容：让它读我们那套 init.d + rc2.d（1Panel 装的服务靠这个）
    "-Dsysvinit-path=/etc/init.d",
    "-Dsysvrcnd-path=/etc",
]
