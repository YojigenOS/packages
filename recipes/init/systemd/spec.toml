# systemd —— 决策记录 0022 里"必须自己建"的那一个
#
# 0022 把交付物分成两类，判据是**上游给不给通用二进制**：
#
#     上游给通用二进制的   = 应用 → 只分发
#     上游给不了的         = 系统 → 自己建
#          内核 · libc · 引导器 · init · 包管理器 · **systemd** …
#
# 而它原文还写着：「systemd 那条也没被绕开：它是 1panel 的硬前提，而它按这条
# 规则必须自己建。**该难的还是难**。」
#
# ── 这个配方怎么"把难的地方关掉" ──────────────────────────────────────────
#
# systemd 的依赖列表很长，但**大部分是 `required : get_option(...)`** —— 可以关。
# 我们数过（v258 的 meson.build）：唯一的硬程序依赖是 `gperf`。
#
# 而关哪些，判据都是**我们这台系统的实际情况**，不是"省事"：
#
#   ~~-Dudev=false~~   ★★★ **这条推论是错的，2026-10-24 实测推翻。**
#
#                      原来写的是："内核 CONFIG_MODULES 没开，没有模块加载，
#                      udev 存在的理由就没了 —— 设备节点靠 DEVTMPFS 出来。"
#
#                      ★ 而 **udev 不只是加载模块**。它还负责把设备**注册给
#                      systemd** —— 没有它，`dev-ttyS0.device` 永远是
#                      `inactive (dead)`，于是：
#
#                          getty.target              start waiting   ← 卡住
#                          serial-getty@ttyS0        start waiting
#                          multi-user.target         start waiting
#
#                      `multi-user` 到不了 ⇒ `systemd is-system-running` 永远
#                      停在 `starting`。而**网络是通的、sshd 也在跑** ——
#                      所以症状只是"状态不完整"，很容易被当成"systemd 有问题"。
#
#                      ★ 实测（TX，内核 CONFIG_MODULES=n）：
#                          手工起 udevd  → udevadm trigger  → dev-ttyS0.device
#                          从 `inactive (dead)` 变成 `active (plugged)`
#                      然后 `systemctl is-system-running` 立刻变 `running`。
#
#                      ★★ 所以 v258 里 **udev 保留**（它本来也没有开关，
#                         meson.build 里无条件 `subdir('src/udev')`）。
#                         `-Dkmod=false` 仍然给它 —— 模块加载那部分自动缩掉，
#                         而设备枚举/注册不需要它。
#
#                      ★ 判据：**"这件东西在我们这儿没用"要分清是"它的哪一部分"
#                        没用。** udev 的"加载模块"没用，而"枚举设备并告诉
#                        systemd"正是指望它干的活。
#   -Dkmod=false       同上。
#   -Dseccomp=false    libseccomp 没建；而 SECCOMP 那侧内核是开的，不影响。
#   -Dapparmor=false -Dselinux=false   都不做。
#   -Daudit=false      libaudit 没建。
#   -Dpam=false -Dlogind=false        没有 PAM。1Panel 不用 logind。
#   -Dcryptsetup=false -Dlibcryptsetup=false -Delfutils=false
#   -Dgcrypt=false（用 openssl）-Dlibidn2=false -Dlz4=false -Dmicrohttpd=false
#   -Dqrencode=false -Dgnutls=false -Dlibcurl=false -Dpolkit=false
#   -Dman=false -Dhtml=false           文档要 docbook，给人看的。
#   -Dtests=false
#   -Dfirstboot=false -Dquotacheck=false
#   -Dnetworkd=false -Dresolved=false  我们用自己的 15-network + dhcpcd。
#   -Defi=false -Dtpm=false -Dima=false -Dbpf-framework=false
#
# ★ 而**留下的**都是 1Panel 或我们自己真用的：
#   hostnamed（主机名页）· timedated（时间页）· tmpfiles · sysusers
#   journald（它要读日志）· sysv-generator（读 /etc/init.d + rc2.d）
#
# ★★ 还有一条关键的：`-Dsysvinit-path` / `-Dsysvrcnd-path` 指向我们已有的
#     那套 SysV 兼容骨架 —— 于是 1Panel 装的服务在 systemd 下**照样能起**，
#     不需要为它改任何东西。

[package]
name        = "systemd"
version     = "258"
release     = 10
date        = 2026-10-22T10:30:00Z
description = "系统与服务管理器（决策记录 0022：自己建）"
url         = "https://systemd.io/"
license     = "LGPL-2.1-or-later"
# ★★ systemd 也提供 usr/sbin/reboot 和 usr/sbin/poweroff，而 `yojigen-os-init`
#   也在提供（那两个脚本就是"没有 systemd 时的替代"，它们自己的注释里写着
#   "Alpine → busybox，Debian → systemd"）。
#
#   不写这一行的话，装 systemd 时 apk 直接报：
#       ERROR: trying to overwrite usr/sbin/reboot owned by yojigen-os-init-1.0-r11
#
#   ★ 而这两个命令该由 systemd 接管 —— 它知道 cgroup 里还有什么在跑。
replaces    = ["yojigen-os-init"]

[[source]]
# ★ 用 upstream 的 tag tarball（不是 release 里的 .tar.gz）：
#   github 的 archive 接口给的是同一个 git 树，而 systemd 官方发布页
#   （github.com/systemd/systemd-stable）只在特定版本上才更新。
url    = "https://github.com/systemd/systemd/archive/refs/tags/v$VERSION.tar.gz"
sha256 = "07a580cf21856f468f82b77b82973a926f42ccc696462459b53f8b88893dff8e"

[dependencies.aarch64]
runtime = ["glibc", "util-linux", "openssl", "zstd", "xz", "libcap", "linux-pam", "libseccomp", "kmod", "cryptsetup"]
build   = ["meson", "ninja", "gcc", "pkgconf", "gperf", "python3", "jinja2",
           "util-linux", "openssl", "zstd", "xz", "libcap",
           "linux-pam", "libseccomp", "kmod", "cryptsetup"]

# ★★ 第 3 期打开的三个能力的依赖（2026-10-26）：
#
#   linux-pam     -Dpam      → /etc/pam.d + logind 的认证链路
#   libseccomp    -Dseccomp  → SystemCallFilter= / RestrictAddressFamilies=
#   kmod          -Dkmod     → udev 加载内核模块（还要内核 CONFIG_MODULES=y）
#
# ★ 三个都同时在 runtime 和 build 里 —— runtime 是因为 systemd **链接**它们
#   （libpam.so / libseccomp.so / libkmod.so），build 是因为 meson 要靠
#   pkg-config 找到它们的头文件和 .pc。

[dependencies.x86_64]
runtime = ["glibc", "util-linux", "openssl", "zstd", "xz", "libcap", "linux-pam", "libseccomp", "kmod", "cryptsetup"]
build   = ["meson", "ninja", "gcc", "pkgconf", "gperf", "python3", "jinja2",
           "util-linux", "openssl", "zstd", "xz", "libcap",
           "linux-pam", "libseccomp", "kmod", "cryptsetup"]

[build]
type = "meson"
# ★★ gcc 16 把 `-Wdiscarded-qualifiers` 变严了，而 systemd 用 `-Werror`：
#
#       src/basic/string-util.h:13:16: error: return discards 'const' qualifier
#                                       from pointer target type
#                                       [-Werror=discarded-qualifiers]
#
#   `strstr()` 的参数是 `const char*` 而返回 `char*` —— 上游那个 helper 返回
#   `char*`，于是一次"丢弃 const"的返回。旧 gcc 不报，gcc 16 报。
#
# ★ 只降级这一条，**不关掉 `-Werror`** —— 那会掩盖真问题。
#   同一个做法在 `recipes/lib/libxcrypt` 里已经用过（同一个 gcc 16 的坑）。
cflags = ["-Wno-error=discarded-qualifiers"]
# ★ GitHub 的 tag tarball 转义了文件名里的反斜杠，撞坏了 test/fuzz 那层保护
patches = ["0001-skip-github-escaped-fuzz-filenames.patch"]
configure = [
    # ★ v258 里 `mode` 只有 developer/release —— **"是不是 PID 1"不再是构建选项**
    #   （它在运行时判断）。原来写 `systemd` 会让 meson 当场报
    #   "Value "systemd" for option "mode" is not one of the choices"。
    # ★★ jinja2 是硬依赖（meson.build 里 `required : true`），见 devel/jinja2
    "-Dmode=release",
    # ── 关的（理由见文件头）──────────────────────────────────────────
    # ★★ v258 里 **udev 没有开关**了 —— 它无条件建（meson.build 里直接
    #   `subdir('src/udev')`）。而那不是问题：udev 的**构建**不依赖内核有没有
    #   CONFIG_MODULES（那是运行时的事）。我们把 `-Dkmod=false` 给它，
    #   它的模块加载那部分自动缩掉。
    #
    #   ★★★ 而它的【设备枚举】那部分**必须留着**（2026-10-24 实测）：
    #     没有 udevd，`dev-*.device` 全是 `inactive (dead)`，`getty.target`
    #     和 `multi-user.target` 永远到不了，`is-system-running` 停在
    #     `starting`。见文件头那条被推翻的 `-Dudev=false` 注释。
    # ★★★ 第 3 期：这三个从 false 改成【不写】（= 用 meson 的默认 auto）
    #   （2026-10-26）
    #
    #   YG 第 2 条：「尽量不要有特殊开关关闭或者功能缺失」。
    #
    #   -Dkmod      → systemd-udevd 靠它加载内核模块。关着的时候设备插上来
    #                 **驱动加载不了**。而 kmod / libkmod 现在有了（第 3 期建的）。
    #                 ★ 注意：真正生效还要内核 CONFIG_MODULES=y（单独处理）。
    #   -Dseccomp   → `SystemCallFilter=` / `RestrictAddressFamilies=` 这些
    #                 服务加固指令靠它。关着时那些指令**静默失效**。
    #                 libseccomp 现在有了。
    #
    #   ★ 不写而不是写 =true：meson 的 auto 会在依赖缺失时跳过并打警告，
    #     而 =true 会**构建失败**。依赖我们已经有，但 auto 让"有问题时
    #     立刻看得见"（警告）而不是"整个 systemd 编不出来"。
    "-Dapparmor=false",
    "-Dselinux=false",
    "-Daudit=false",
    # ★★★ 第 3 期：PAM 打开（2026-10-26）
    #
    #   `-Dpam=false` 的后果是 **/etc/pam.d 全无** —— 而 Fedora 和 Debian
    #   都把 libpam-* 放在 **required** 层（不是 important）。
    #
    #   没有 PAM：`login` / `su` / `sudo` / `sshd` 的认证链路和标准发行版
    #   不一样；`pam_unix` / `pam_limits` / `pam_env` 全没有。
    #
    #   ★ 而它和 `-Dlogind` 没有硬耦合（实测 meson.build：pam 和 logind
    #     是独立的两组判断）—— logind 可以暂时还关着。
    "-Dpam=true",
    "-Dlogind=false",
    # ★★★ 第 3/4 期：cryptsetup 打开（2026-10-26）
    #
    #   `-Dlibcryptsetup=false` 关着时 systemd **不能读 /etc/crypttab** ——
    #   也就是"开机自动解锁加密盘"这件事做不到：
    #
    #       systemd-cryptsetup@<name>.service   ← 这个 unit 不存在
    #       cryptsetup.target                   ← 从来没被真正满足过
    #
    #   ★ 而 libcryptsetup 现在有了（tool/cryptsetup 2.8.8，
    #     带 json-c + libdevmapper 两个前置）。
    #
    #   ★★ 这是 YG 第 2 条在这条链上的最后一格：从"没有 cryptsetup 这个包"
    #     到"systemd 能读 crypttab"，中间隔了 3 个包 + 两次构建镜像更新。
    "-Dlibcryptsetup=true",
    "-Delfutils=false",
    "-Dgcrypt=false",
    "-Dlibidn2=false",
    "-Dlz4=false",
    "-Dmicrohttpd=false",
    "-Dqrencode=false",
    "-Dgnutls=false",
    "-Dlibcurl=false",
    "-Dpolkit=false",
    "-Dman=false",
    "-Dhtml=false",
    "-Dtests=false",
    "-Dfirstboot=false",
    "-Dquotacheck=false",
    "-Dnetworkd=false",
    "-Dresolve=false",
    "-Defi=false",
    "-Dtpm=false",
    "-Dima=false",
    "-Dbpf-framework=false",
    # ── 留的 ────────────────────────────────────────────────────────
    "-Dopenssl=true",
    "-Dzstd=true",
    "-Dxz=true",
    "-Dblkid=true",
    "-Dsysusers=true",
    "-Dtmpfiles=true",
    "-Dhostnamed=true",
    "-Dtimedated=true",
    "-Dlocaled=true",
    # ★★★ 把发行版的 GID 表传给 systemd（2026-10-23）。
    #
    #   `sysusers.d/basic.conf` 里是 `g utmp {{UTMP_GID}}`，而 meson 那个选项的
    #   **默认值是 0（"没指定"）** —— 于是 sysusers 只能运行时动态分配（我们撞到
    #   998）。动态分配的后果是同一次启动里"组还没建出来"的竞态，而它让
    #   `wtmp` 建不出来、`systemd-update-utmp` 失败、整个启动停在 sysinit。
    #
    #   ★ 而 `files/etc/group`（filesystem 包）里是**静态**的一张表 ——
    #     两个来源必须一致，否则 sysusers 会报"组已存在但 GID 不同"。
    #
    #   ★ 这里填的值**照 Debian 的 base-passwd 抄**（那套从 1990 年代沿用至今，
    #     是事实上的标准）。只填 `files/etc/group` 里真有的那些 —— 没有的组
    #     让它保持默认（sysusers 会跳过不存在的组定义）。
    "-Dutmp-gid=43",
    "-Dtty-gid=5",
    "-Ddisk-gid=6",
    "-Dlp-gid=7",
    "-Dkmem-gid=15",
    "-Ddialout-gid=20",
    "-Dcdrom-gid=24",
    "-Dtape-gid=26",
    "-Daudio-gid=29",
    "-Dvideo-gid=44",
    "-Dusers-gid=100",
    "-Dadm-gid=4",
    # ★★ SysV 兼容：让它读我们那套 init.d + rc2.d（1Panel 装的服务靠这个）
    "-Dsysvinit-path=/etc/init.d",
    "-Dsysvrcnd-path=/etc",
]
