# lsof —— "谁占着这个文件 / 这个端口"
#
# 【为什么它是排障必备】
#
#     lsof -i :80          谁在听 80
#     lsof /var/log/x.log  谁开着这个日志
#     lsof +D /mnt         谁在占着这个挂载点（umount 说 busy 的时候）
#
# 最后那条是它最不可替代的用法 —— `fuser` 只能给 PID，而你要知道是【什么】。

[package]
name        = "lsof"
version     = "4.99.7"
release     = 1
date        = 2026-10-13T16:00:00Z
description = "列出打开的文件（含网络连接）"
section     = "utils"
url         = "https://github.com/lsof-org/lsof"
license     = "lsof"

[[source]]
git    = "https://github.com/lsof-org/lsof"
commit = "646395f8e893edb5572405b2311a079f55f269f2"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]
[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]

[build]
type       = "autotools"
autoreconf = true
# ★ 这一段 `configure` 2026-10-15 删掉了 —— 它是【死代码】。
#   这个配方的 `steps.sh` 重定义了 `build()`，而 `steps.sh` 是在
#   `run.sh` 定义完默认实现【之后】被 source 的，所以它整体覆盖 ——
#   驱动代码里那句注释写得很清楚：
#       "# steps.sh 若存在，可以通过重定义上面任意函数来覆盖默认行为"
#
#   危险的地方不是重复，是**改在这一份上不会生效而没有任何提示**。
#   真正在用的那份在 `steps.sh` 里（删之前逐条比对过，两边一致）。
