# nftables —— `nft` 那个程序
#
# ★ 它是 1Panel 防火墙页的**判据**（源码里 38 处引用，走 nftables_helper）。
#   没有它，那个页面上的功能全是红的 —— 而那是我们在 TX 上第一次看到"很多报错"
#   的其中一类。
#
# ── 三个依赖，各管什么 ────────────────────────────────────────────────────
#
#   libmnl   >= 1.0.4   netlink 收发包                 （已有）
#   libnftnl >= 1.3.1   nftables 消息                  （从 1.2.8 升上来）
#   libgmp              表达式里的整数运算             （已有 gmp）
#   readline            CLI 的行编辑                    （已有；见下）
#
# ★ 关于 CLI：configure 的默认是 `editline`（要 libedit），我们没有它，
#   所以显式 `--with-cli=readline`。**不能 `--without-cli`** —— 那连 `nft`
#   这个程序都不建了，而 1Panel 要的正是这个程序。
#
# ★ 内核那侧不用动：NF_TABLES / NFT_NAT / NFT_MASQ / NFT_CT 早在
#   config.fragment 里，而且 `iptables-nft` 已经实测能用。

[package]
name        = "nftables"
version     = "1.1.6"
release     = 1
date        = 2026-10-22T09:10:00Z
description = "nftables 的命令行工具（1Panel 防火墙页要用）"
url         = "https://netfilter.org/projects/nftables/"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://netfilter.org/projects/nftables/files/nftables-$VERSION.tar.xz"
sha256 = "372931bda8556b310636a2f9020adc710f9bab66f47efe0ce90bff800ac2530c"

[dependencies.aarch64]
runtime = ["glibc", "libmnl", "libnftnl", "gmp", "readline"]
build   = ["make", "gcc", "pkgconf", "libmnl", "libnftnl", "gmp", "readline"]

[dependencies.x86_64]
runtime = ["glibc", "libmnl", "libnftnl", "gmp", "readline"]
build   = ["make", "gcc", "pkgconf", "libmnl", "libnftnl", "gmp", "readline"]

[build]
type      = "autotools"
configure = [
    "--prefix=/usr",
    "--sbindir=/usr/sbin",
    # ★ 必须有 CLI —— 1Panel 要的就是 `nft` 这个程序
    "--with-cli=readline",
    # 文档要 asciidoc（a2x），那是给人看的，不在构建链里
    "--disable-man-doc",
]
