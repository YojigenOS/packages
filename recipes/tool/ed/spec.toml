# ed —— POSIX 行编辑器（ed）
#
# ★ 对标 Fedora Server 的 comps（core / standard 两组）补进来的（2026-10-25）。
#   这些是"一台能用的服务器该有"的东西，而 Fedora 和 Debian 都有。
#
# ★★ 判据（YG 定的第 1 条）：**基础包要全。**
#   一个系统缺 `lspci` 或 `traceroute`，不是"精简"，是"查不了问题"。

[package]
name        = "ed"
version     = "1.22.6"
release     = 1
date        = 2026-10-25T00:00:00Z
description = "POSIX 行编辑器（ed）"
url         = "https://www.gnu.org/software/ed/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/ed/ed-$VERSION.tar.lz"
sha256 = "3f33b22135219c39c3c695f7b7171c2567d3e2a17c798c0a90607320cbb268f2"

[dependencies.aarch64]
runtime = ['glibc']
build   = ['make', 'gcc']

[dependencies.x86_64]
runtime = ['glibc']
build   = ['make', 'gcc']

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]
