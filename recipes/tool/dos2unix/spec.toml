# dos2unix —— DOS/Unix 换行符转换（dos2unix / unix2dos）
#
# ★ 对标 Fedora Server 的 comps（core / standard 两组）补进来的（2026-10-25）。
#   这些是"一台能用的服务器该有"的东西，而 Fedora 和 Debian 都有。
#
# ★★ 判据（YG 定的第 1 条）：**基础包要全。**
#   一个系统缺 `lspci` 或 `traceroute`，不是"精简"，是"查不了问题"。

[package]
name        = "dos2unix"
version     = "7.5.2"
release     = 1
date        = 2026-10-25T00:00:00Z
description = "DOS/Unix 换行符转换（dos2unix / unix2dos）"
url         = "https://waterlan.home.xs4all.nl/dos2unix.html"
license     = "BSD-2-Clause"

[[source]]
# ★★ 原来写的是 waterlan.home.xs4all.nl/dos2unix/dos2unix-$VERSION.tar.gz ——
#   而那个地址返回的是**一个 HTML 页面**（12KB，`<!DOCTYPE html>`），不是源码。
#   sha256 我当初是照 12KB 那个算的，所以"校验匹配"反而掩盖了问题。
#
#   实测（HEAD 请求看 content_type）：
#     waterlan.home.xs4all.nl/…tar.gz   → text/html      ✗
#     sourceforge.net/…/download        → application/x-gzip ✓
#     deb.debian.org/…/dos2unix_….orig.tar.gz → application/x-gzip ✓
#
#   用 Debian pool 那份：地址稳定、和 Debian 同一个上游 tar。
url    = "https://deb.debian.org/debian/pool/main/d/dos2unix/dos2unix_$VERSION.orig.tar.gz"
sha256 = "264742446608442eb48f96c20af6da303cb3a92b364e72cb7e24f88239c4bf3a"

[dependencies.aarch64]
runtime = ['glibc']
build   = ['make', 'gcc']

[dependencies.x86_64]
runtime = ['glibc']
build   = ['make', 'gcc']

[build]
# ★ dos2unix 没有 autotools 的 ./configure —— 它是自己的 Makefile（实测解包看过）。
#   `custom` 类型要求 steps.sh 同时覆盖 build() 和 package()。
type = "custom"
