# gawk —— GNU awk，文本处理语言

[package]
name        = "gawk"
version     = "5.4.0"
release     = 1
date        = 2026-10-10T06:39:13Z
description = "GNU awk，文本处理语言"
section     = "base"
url         = "https://www.gnu.org/software/gawk/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/gawk/gawk-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/gawk/gawk-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/gawk/gawk-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/gawk/gawk-$VERSION.tar.xz",
]
sha256 = "3dd430f0cd3b4428c6c3f6afc021b9cd3c1f8c93f7a688dc268ca428a90b4ac1"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

# ★ 暂时停在 5.4.0，不用 5.4.1。
#
# 5.4.1 有一个会破坏构建的回归：一个"读过但从未赋值"的数组元素，一旦参与过
# 比较或判断，再当字符串用就会变成 "0" 而不是空串：
#
#     $ gawk 'BEGIN { if (a["x"] == "") ; a["x"] = a["x"] "y"; print "[" a["x"] "]" }'
#     [0y]      # 5.4.1
#     [y]       # 5.4.0、mawk、以及 POSIX 期望的结果
#
# 这不是边角情况——5.4.1 自己的 make check 就有 6 个测试失败
# （arraysort2、delarpm2、elemnew2、elemnew4、matchuninitialized、typeof7）。
# 上游邮件列表里还提到它同样会让 GCC 16.2 的构建失败。
#
# 我们这儿是这么撞上的：libpng 的 scripts/options.awk 读 requires["UNKNOWN_CHUNKS"]
# 这个从没赋过值的键，于是 pnglibconf.h 里每一项都变成 undef（PNG_0_SUPPORTED
# 这种），最后报出来的是"setjmp 没有声明"——完全指不到真正的原因。
#
# 触发条件和我们一样：**gawk 建的时候没有 MPFR**（我们的 gawk --version 里确实
# 没有 MPFR 那一段）。上游说 5.4.0 行为正确，5.4.2 还没发布，所以先停在 5.4.0。
# 等 5.4.2 出来就升回去。
#
# 上游记录（GNU 用邮件列表，不是 GitHub issue）：
#
#   最初的报告 2026-07-15「Gawk 5.4.1 fails make check when built without MPFR」
#     https://lists.gnu.org/archive/html/bug-gawk/2026-07/msg00026.html
#
#   完整诊断 2026-09-27「gawk 5.4.1: uninitialized array element reads as "0"
#   after being tested」，报告人是 Frédéric MARIE-JOSEPH，里面附了两个最小
#   复现、GCC 16.2 构建失败的情况、以及病因（awk.h 的 force_string_fmt()
#   里 5.4.1 新加的那个条件）
#     https://lists.gnu.org/archive/html/bug-gawk/2026-09/msg00086.html
#
#   维护者 Arnold Robbins 的回复与讨论 2026-09-28
#     https://lists.gnu.org/archive/html/bug-gawk/2026-09/msg00096.html
#
# **补丁有了，但还没进任何发布版**——MacPorts 那边也撞了同一个，他们的
# commit message 说得最清楚："A patch with a workaround is available
# upstream, but it has not been incorporated into any release yet."
#
# 所以现在两条路：降回 5.4.0（我们选的），或者背着那个补丁。选前者是因为
# 它符合「源码是 sha256 可校验的上游发布点」这条约定。
#
# 另外注意：「未初始化数组元素」是 gawk 反复出问题的一块——5.3.1 和 5.3.2
# 的 NEWS 里都写着修这个，5.4.1 又往反方向碰坏了。以后见到同类症状先往
# 这个方向想。
[build]
type      = "autotools"
# ★ 显式 --without-mpfr：不然 gawk 会【看构建环境里恰好有没有 mpfr】来决定
# 要不要链接它，同一份配方因此产出两种 gawk。
#
# 实测：CI 第一遍用 Debian 构建环境（没装 libmpfr-dev）→ gawk 不带 mpfr；
# 自举那一遍用 base-devel 镜像（里面有我们建的 mpfr）→ gawk 链接了
# libmpfr.so.6，于是它成了未声明的运行时依赖，而且两边行为不一致。
#
# 这也是我第一次本地复现不了那个 libpng 问题的原因——我本地的 base-devel
# 有 mpfr，CI 那份没有，配置压根不一样。
#
# 关掉它，构建就只由配方决定，不由环境决定。
configure = ["--prefix=/usr", "--without-mpfr"]
