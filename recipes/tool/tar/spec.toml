# tar —— 归档工具

[package]
name        = "tar"
version     = "1.35"
release     = 1
date        = 2026-10-10T06:39:13Z
description = "归档工具"
section     = "base"
url         = "https://www.gnu.org/software/tar/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/tar/tar-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/tar/tar-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/tar/tar-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/tar/tar-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/tar/tar-$VERSION.tar.xz",
]
sha256 = "4d62ff37342ec7aed748535323930c7cf94acf71c3591882b26a7ea50f3edc16"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr"]
