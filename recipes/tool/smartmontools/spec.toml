# smartmontools —— 磁盘健康监测（smartctl / smartd）
#
# ★ 对标 Fedora Server 的 standard 组补的（2026-10-26，第 4 期）。
#
# ★★ 一台服务器最怕的不是"坏了"，是"坏了才知道"。SMART 是硬盘自己的
#   健康预报（重映射扇区数 / 通电时间 / 温度 / 自检结果），而 `smartctl`
#   是读它的唯一标准工具。
#
# ★ 它有两个可选后端：libcap-ng（降权）和 SELinux。前者我们有 libcap
#   （但 libcap-ng 是不同的包）—— 所以那一条会自动 skip。
#   **不显式关**，让 configure 自己判断。

[package]
name        = "smartmontools"
version     = "7.5"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "磁盘健康监测（smartctl / smartd）"
url         = "https://www.smartmontools.org/"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://downloads.sourceforge.net/project/smartmontools/smartmontools/7.5/smartmontools-$VERSION.tar.gz"
sha256 = "690b83ca331378da9ea0d9d61008c4b22dde391387b9bbad7f29387f2595f76e"

[dependencies.aarch64]
runtime = ["glibc", "systemd"]
build   = ["make", "gcc", "systemd"]

[dependencies.x86_64]
runtime = ["glibc", "systemd"]
build   = ["make", "gcc", "systemd"]

[build]
type      = "autotools"
# ★ 不关任何功能。--with-systemdsystemunitdir 让它装 systemd unit
#   （smartd 是常驻的守护进程，那正是我们要的）
configure = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    "--disable-static",
    "--with-systemdsystemunitdir=/usr/lib/systemd/system",
    # ★★ `--with-systemdsystemunitdir` **要求同时 `--with-libsystemd`**
    #   （实测：configure: error: '--with-systemdsystemunitdir=…' now requires
    #    '--with-libsystemd'）。
    #
    #   而 libsystemd 我们有（它随 systemd 装：
    #   /usr/lib/libsystemd.so + /usr/lib/pkgconfig/libsystemd.pc）。
    #
    #   ★ 打开它的作用是 **sd_notify** —— smartd 起来之后告诉 systemd
    #     "我准备好了"。没有它，`systemctl start smartd` 只能靠猜（默认
    #     Type=simple，起来了就算成功），而**真的挂掉时 systemd 不知道**。
    "--with-libsystemd",
]
