# less —— 分页看文件的工具
#
# 【为什么它排在很前面】
#
# 服务器上最常做的一件事是"看一眼日志"。没有它，只有 cat——而 cat 一个几百 MB
# 的日志会把终端刷爆，而你想看的往往是【最后那几行】。
#
# 它比 more 好：能往回翻、能搜、能跟 tail -f 一起用。所以是 less 不是 more。

[package]
name        = "less"
version     = "711"
release     = 3
date        = 2026-10-13T12:05:00Z
description = "分页查看文件（比 more 能往回翻、能搜）"
section     = "utils"
url         = "https://www.greenwoodsoftware.com/less/"
license     = "BSD-3-Clause OR GPL-3.0-or-later"

[[source]]
git     = "https://github.com/gwsw/less"
commit  = "52c3b13f35d73c624d4a1ddd0dbe3a1a072159ab"
mirrors = ["https://www.greenwoodsoftware.com/less/"]

[dependencies]
runtime = ["glibc", "ncurses"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]

[dependencies.x86_64]
runtime = ["glibc", "ncurses"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]

[build]
# ★ 从 git 建 less 有它自己的一步。
#
#   上游 README 里写着：
#
#       2. If you are building from a clone of a git repository,
#          type "make -f Makefile.aut distfiles".
#
#   那一步会生成 configure、funcs.h、help.c、lessmsg.inc —— 这些东西
#   在【发布的 tarball 里】是现成的，在 git 树里没有。
#
#   实测：不跑它直接 configure && make，报
#       make: *** No rule to make target 'funcs.h', needed by 'main.o'.  Stop.
#
#   所以走 custom，把这一步放在 configure 前面。
type = "custom"
