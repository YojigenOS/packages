# tmux —— 终端复用
#
# 【为什么它比看起来重要】
#
# 「SSH 一断，手上的活全没了」——这事在服务器上不是小麻烦。tmux 之后，
# 会话跑在服务器上，网络断了重连 `tmux attach` 就接着干。
#
# 顺带它能开分屏，一台机器上同时盯几件事。

[package]
name        = "tmux"
version     = "3.8"
release     = 1
date        = 2026-10-13T12:40:00Z
description = "终端复用器（断线不掉会话）"
section     = "utils"
url         = "https://github.com/tmux/tmux"
license     = "ISC"

[[source]]
git    = "https://github.com/tmux/tmux"
commit = "7f2a35ad3321f9ba57a1062ca73b1f3ff26aca53"

[dependencies.aarch64]
runtime = ["glibc", "ncurses", "libevent", "utf8proc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "pkgconf"]

[dependencies.x86_64]
runtime = ["glibc", "ncurses", "libevent", "utf8proc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "pkgconf"]

[build]
type      = "autotools"
autoreconf = true
configure = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    # ★ 这条要紧：用 utf8proc 算字符宽度。中文字占两列，不靠它就对不齐。
    "--enable-utf8proc",
    # 不要那几个可选后端——我们没有它们。
    "--disable-utempter",
    "--disable-systemd",

    # ── NLS（gettext 翻译）暂时关掉 ──
    #
    # ★ 这不是"不需要"，是"现在还不能要"，理由要写清楚：
    #
    #   gettext 的构建需要 autopoint 先跑一遍（它往 po/ 里放 Makefile.in.in）。
    #   我们的 autoreconf 流程没跑那一步，于是 procps 实测挂在：
    #
    #       Making all in po
    #       make[2]: *** No rule to make target 'all'.  Stop.
    #
    #   而【NLS 正是"程序输出显示什么语言"的机制】——关掉它意味着这些工具的
    #   报错信息是英文。这与「中文优先」那条要求是有张力的，所以记在这里，
    #   而不是悄悄关掉。修法在 0006（apk 自己的 i18n）那条线上。
    "--disable-nls",
]
