# parted —— 分区编辑器
#
# ★ 对标 Fedora Server 的 standard 组补的（2026-10-26，第 4 期）。
#
# ★★ 为什么它重要：我们的交付方式是 **DD 一个准备好的 rootfs**
#   （决策记录 0013），而这台机器上 `fdisk` 有、`parted` 没有。
#
#   区别是实质的：
#     fdisk  — MBR + 基础 GPT，交互式
#     parted — GPT 全功能、**能改分区大小**、能非交互（脚本化）
#
#   一台服务器扩盘之后 `parted resizepart` 是最直接的路，而 fdisk 做不了。
#
# ★ 它的依赖：libuuid + libblkid（都在 util-linux 里）+ devmapper（关掉）。
#   **不装 libdevmapper** —— 那是 LVM 那套，我们暂时没有 LVM。
#   ★ 而那是"功能缺失"还是"没有那个东西"？后者 —— LVM 本身不存在，
#     parted 的 dm 支持是"如果系统上有 LVM 就认它"。所以关掉它不是缺功能。

[package]
name        = "parted"
version     = "3.8"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "分区编辑器（parted）"
url         = "https://www.gnu.org/software/parted/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/parted/parted-$VERSION.tar.xz"
sha256 = "a2b7811f47b0ddb1f7b1d0aa456f7c1270da70708ce231c2fe054c7199eafa63"

[dependencies.aarch64]
runtime = ["glibc", "util-linux"]
build   = ["make", "gcc", "pkgconf", "gettext", "util-linux"]

[dependencies.x86_64]
runtime = ["glibc", "util-linux"]
build   = ["make", "gcc", "pkgconf", "gettext", "util-linux"]

[build]
type      = "autotools"
# ★ --without-devmapper：LVM 那套我们没有。而 parted 的 dm 支持是
#   "系统上有 LVM 就认它" —— LVM 不存在时它本来也不会生效，所以不算缺功能。
configure = [
    "--prefix=/usr",
    "--disable-static",
    "--without-devmapper",
    "--disable-device-mapper",
]
