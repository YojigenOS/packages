# rsync —— 增量文件同步工具
#
# 进构建环境的直接原因：**内核的构建过程会调用它**。
# linux-headers 在自举环境里报：
#
#     /bin/sh: line 1: rsync: command not found
#
# 它不在我们的 steps.sh 里，是内核自己的 Makefile 调的——所以这又是一次
# 「按命令查不出来」的依赖。
#
# 它自带一份 popt，树里没有系统 popt 时用自己那份，所以不需要额外的包。

[package]
name        = "rsync"
version     = "3.5.1"
release     = 1
date        = 2026-10-10T16:45:00Z
description = "增量文件传输与同步工具"
url         = "https://rsync.samba.org/"
license     = "GPL-3.0-or-later"

# ★★★ 2026-10-20：这个配方原来【只有一个源】，而它 504 了。
#
#   那一轮（39436540833）走到第 41 位停在 rsync：
#
#       [下载] https://rsync.samba.org/ftp/rsync/src/rsync-3.5.1.tar.gz
#       skirt: 错误 rsync: 所有源都取不到或校验不通过
#           HTTPError: HTTP Error 504: Gateway Time-out
#           curl 也失败（退出码 22: 504）
#
#   ★ 而"所有源"只有一条 —— 那个说法听起来像有退路，其实没有。
#     **一个单点故障在报错里长得像"多处尝试都失败"。**
#
#   实测那段 samba.org 整个站不通（连 `-r 0-1023` 的探测都是 HTTP 000），
#   而 GitHub 的 release 附件**逐字节一致**：
#
#       rsync-3.5.1.tar.gz   1932807 字节
#       sha256               c55f9c9d…c37bef   ← 和上面那个 sha 相同
#
#   ★ 所以两条 sha 一样：换源不改产物（0005 要的可复现性不受影响）。
#     把 GitHub 放第一条，因为它这一整天的可达性都好过 samba.org。
[[source]]
url    = "https://github.com/RsyncProject/rsync/releases/download/v$VERSION/rsync-$VERSION.tar.gz"
sha256 = "c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef"

[[source]]
# 上游自己的站点，不依赖 GitHub。实测字节与 GitHub 附件一致（见上）。
url    = "https://rsync.samba.org/ftp/rsync/src/rsync-$VERSION.tar.gz"
sha256 = "c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["gcc", "make"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["gcc", "make"]

[build]
type = "autotools"
configure = [
  "--prefix=/usr",
  "--disable-xxhash",       # 树里有 xxhash，但 rsync 用它只为增量传输的校验，
                            # 不是必需；关掉少一个依赖
  "--disable-zstd",         # 同理
  "--disable-lz4",
  "--disable-openssl",      # SSL 支持要 openssl，还没建
  "--disable-md2man",       # 文档要 md2man（Ruby），没有
  "--disable-asm",          # 汇编优化在 aarch64 上要额外的 configure 探测
  "--disable-idn",          # IDN 要 libidn2，没有。rsync 的 configure 很严：
                            # 缺可选库它会直接中止并列出「--disable-xxx」，
                            # 而不是降级继续——所以这个必须显式关
]
