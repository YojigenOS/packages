# traceroute —— 网络路径追踪（traceroute）
#
# ★ 对标 Fedora Server 的 comps（core / standard 两组）补进来的（2026-10-25）。
#   这些是"一台能用的服务器该有"的东西，而 Fedora 和 Debian 都有。
#
# ★★ 判据（YG 定的第 1 条）：**基础包要全。**
#   一个系统缺 `lspci` 或 `traceroute`，不是"精简"，是"查不了问题"。

[package]
name        = "traceroute"
version     = "2.1.6"
release     = 1
date        = 2026-10-25T00:00:00Z
description = "网络路径追踪（traceroute）"
url         = "https://traceroute.sourceforge.net/"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://downloads.sourceforge.net/project/traceroute/traceroute/traceroute-$VERSION/traceroute-$VERSION.tar.gz"
sha256 = "9ccef9cdb9d7a98ff7fbf93f79ebd0e48881664b525c4b232a0fcec7dcb9db5e"

[dependencies.aarch64]
runtime = ['glibc']
build   = ['make', 'gcc']

[dependencies.x86_64]
runtime = ['glibc']
build   = ['make', 'gcc']

[build]
# ★ traceroute 没有 autotools 的 ./configure —— 它是自己的 Makefile（实测解包看过）。
#   `custom` 类型要求 steps.sh 同时覆盖 build() 和 package()。
type = "custom"
