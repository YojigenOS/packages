# tcpdump —— 抓包
#
# libpcap 的常用前端。"网络不通"这类问题，到这一步就从猜变成看。

[package]
name        = "tcpdump"
version     = "4.99.7"
release     = 1
date        = 2026-10-13T12:45:00Z
description = "命令行抓包工具"
section     = "net"
url         = "https://www.tcpdump.org/"
license     = "BSD-3-Clause"

[[source]]
git    = "https://github.com/the-tcpdump-group/tcpdump"
commit = "1c950db294b52c99461c89e2a8d0e541d344cf5a"

[dependencies]
runtime = ["glibc", "libpcap", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]
[dependencies.x86_64]
runtime = ["glibc", "libpcap", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]

[build]
type      = "autotools"
autoreconf = true
configure = [
    "--prefix=/usr",
    # 用 openssl 解密 HTTPS 会话（给 -T 之类用）。我们有 openssl。
    "--enable-crypto",
    "--disable-smb",
]
