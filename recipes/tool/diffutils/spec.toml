# diffutils —— 文件比较工具（diff、cmp、diff3）

[package]
name        = "diffutils"
version     = "3.12"
release     = 1
date        = 2026-10-10T06:39:13Z
description = "文件比较工具（diff、cmp、diff3）"
section     = "base"
url         = "https://www.gnu.org/software/diffutils/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/diffutils/diffutils-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/约定/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/diffutils/diffutils-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/diffutils/diffutils-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/diffutils/diffutils-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/diffutils/diffutils-$VERSION.tar.xz",
]
sha256 = "7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd"

[dependencies.aarch64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr"]
