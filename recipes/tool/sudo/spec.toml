# sudo —— "以别人的身份跑一条命令"
#
# 【为什么服务器上必须有它】
#
# 现在这个系统上只有 root 能登进来（sshd 配的是 prohibit-password），
# 而"每件事都当 root 做"是个真实的风险：一条打错的命令就没有边界了。
#
# sudo 的价值不在于"少输一次密码"，在于**它是一条可以写的边界**：
# 谁能做什么、要不要密码、要做什么记录 —— 都记在 /etc/sudoers 里。

[package]
name        = "sudo"
version     = "1.9.17_p2"
release     = 2
date        = 2026-10-13T16:00:00Z
description = "以其他用户身份执行命令"
url         = "https://www.sudo.ws/"
license     = "ISC"

[[source]]
git    = "https://github.com/sudo-project/sudo"
commit = "d1b48c651cec19fe37d1f0d3299d2283fb0f88e4"

[dependencies.aarch64]
runtime = ["glibc", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "openssl", "flex", "bison", "gettext", "linux-pam"]
[dependencies.x86_64]
runtime = ["glibc", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "openssl", "flex", "bison", "gettext", "linux-pam"]

[build]
type       = "autotools"
autoreconf = true
configure  = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    "--with-vardir=/var",

    # ★ 要文档的话它会去找 mandoc / docbook —— 我们两样都没有。

    # ★★★ `--without-pam` 删掉了（2026-10-26，第 3 期）。
    #
    #   上面那段注释说"我们没有 PAM" —— 现在有了。而那段还说了关掉它的
    #   真实原因：**sudo 起来了但任何一条命令都验不过**。也就是说
    #   `--with-pam`（默认值）在没有 PAM 时是"运行时才炸"，那才是当初
    #   必须显式关掉的理由。理由消失，开关就该删。
    #
    #   ★ 打开后 sudo 走 /etc/pam.d/sudo 那条链 —— 和 Fedora/Debian 一致。
    #     里面那些 `pam_limits`（每用户的资源限制）/ `pam_env`（环境变量）
    #     才生效。
    "--with-pam",

    # ★ 不用 LDAP / SSSD / 各种后端插件：它们都要各自的库。
    "--disable-ldap",

    # ★ 这里原来有一条 --disable-shared-libutil，是为了绕开"降权装不了属主"。
    #   那个问题的根在驱动层（build() 和 package() 一起降权），已经修掉了：
    #   现在 package() 以 root 跑，libtool 那句 `-o 0 -g 0` 能成立。
    #   **所以这个开关撤掉了** —— 它会让 libsudo_util 静态化，那是个副作用，
    #   不该为已经不存在的理由留着。
    "--disable-static",
]
