# sudo —— "以别人的身份跑一条命令"
#
# 【为什么服务器上必须有它】
#
# 现在这个系统上只有 root 能登进来（sshd 配的是 prohibit-password），
# 而"每件事都当 root 做"是个真实的风险：一条打错的命令就没有边界了。
#
# sudo 的价值不在于"少输一次密码"，在于**它是一条可以写的边界**：
# 谁能做什么、要不要密码、要做什么记录 —— 都记在 /etc/sudoers 里。

[package]
name        = "sudo"
version     = "1.9.17p2"
release     = 1
date        = 2026-10-13T16:00:00Z
description = "以其他用户身份执行命令"
section     = "system"
url         = "https://www.sudo.ws/"
license     = "ISC"

[[source]]
git    = "https://github.com/sudo-project/sudo"
commit = "d1b48c651cec19fe37d1f0d3299d2283fb0f88e4"

[dependencies]
runtime = ["glibc", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "openssl", "flex", "bison"]
[dependencies.x86_64]
runtime = ["glibc", "openssl"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "openssl", "flex", "bison"]

[build]
type       = "autotools"
autoreconf = true
configure  = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    "--with-vardir=/var",

    # ★ 要文档的话它会去找 mandoc / docbook —— 我们两样都没有。
    #   关掉，不然 configure 会静默降级或者中途报错。
    "--disable-nls",

    # ★ 关掉 PAM。我们没有 PAM，而它默认会试着用 —— 那份默认会在
    #   运行时才现形（sudo 起来了，但任何一条命令都验不过）。
    "--without-pam",

    # ★ 不用 LDAP / SSSD / 各种后端插件：它们都要各自的库。
    "--disable-ldap",

    # ★★ 不建共享的 libsudo_util。
    #
    #   实测挂在装它那一步：
    #
    #       libtool … install-sh -c -o 0 -g 0 libsudo_util.la …
    #       chown: changing ownership of '…/libsudo_util.so.0.0.0':
    #              Operation not permitted
    #
    #   那个 `-o 0 -g 0` 是 libtool 传的，而降权构建做不到 chown。
    #   静态化这个库就没这一步了 —— 而且它本来就是 sudo 内部用的，
    #   不需要对外暴露。
    #
    #   ★ 而这是【今晚第三次】同一件事：
    #       authorized_keys 的属主   (/root/.ssh)
    #       我自己试图 -o root       (install 直接失败)
    #       sudo 的 libsudo_util     (这里)
    #     根因是同一个：驱动把整个构建降权（setpriv --reuid=$HOSTUID），
    #     于是【任何需要属主/权限位的包】都会撞。
    #
    #     真正的修法在驱动那一层：**让 package() 以 root 跑，build() 保持降权**
    #     （build 是不受信任的上游代码，package 只是把建好的东西搬到位）。
    #     那一条还没做 —— 而 sudo 的【本体】要 setuid root，
    #     所以这个包很可能还要再撞一次。
    "--disable-shared-libutil",

    "--disable-static",
]
