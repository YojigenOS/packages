# kbd —— 控制台键盘工具（我们要的是里边那个 `setkeycodes`）
#
# ★ 为什么它在树里（2026-10-16）：
#
#   腾讯云那台的控制台里，内核一直在刷这两行：
#
#       atkbd serio0: Unknown key released (translated set 2, code 0x0 on isa0060/serio0)
#       atkbd serio0: Use 'setkeycodes 00 <keycode>' to make it known.
#
#   原因不是故障：云主机【没有 PS/2 键盘】，而 VNC 控制台发的按键事件照样落到
#   `i8042` 那个控制器上。`atkbd` 查不到对应的键码就报一次 —— 而它连"把扫描码
#   设成什么能闭嘴"都写在提示里了。
#
#   查内核源码（drivers/input/keyboard/atkbd.c）：
#
#       #define ATKBD_KEY_UNKNOWN  0     ← 0 才报 "Unknown key"
#       #define ATKBD_KEY_NULL     255   ← 255 = 静默
#
#       switch (keycode) {
#       case ATKBD_KEY_NULL:    break;                    /* ← 255：什么都不做 */
#       case ATKBD_KEY_UNKNOWN: dev_warn("Unknown key …");/* ← 0：才报错 */
#
#   —— 所以 `setkeycodes 00 255` 就是设计里的正解（255 = "把这个扫描码当作
#   不存在"，连 input 事件都不发）。**而那句提示没告诉你填 255。**
#
# ★ 而东西在哪个包：`setkeycodes` 属于 kbd 项目（util-linux 里没有它；
#   Alpine 那边是 busybox 提供的一个符号链接，而我们的 rootfs 用的是真
#   coreutils，所以一直缺着）。见 packages/docs/待办.md。
#
# ★ 顺带：这个包还带 `loadkeys` / `dumpkeys` / `showkey` / `kbd_mode` /
#   `chvt` / `openvt` —— 做控制台键盘映射和虚拟终端迟早要用。
#   为一个噪音写配方不值；为一个迟早要用的工具值得。

[package]
name        = "kbd"
version     = "2.10.0"
release     = 1
date        = 2026-10-16T06:45:00Z
description = "控制台键盘工具（setkeycodes / loadkeys / dumpkeys / showkey）"
url         = "https://kbd-project.org/"
license     = "GPL-2.0-or-later"

[[source]]
# 用 kernel.org 的发行 tarball：它带着生成好的 `configure`（实测顶层
# configure / configure.ac / Makefile.am 都在），所以不用 autoreconf ——
# 而 autoreconf 会把 autoconf → automake → perl 那一条链拖进来。
url    = "https://www.kernel.org/pub/linux/utils/kbd/kbd-$VERSION.tar.xz"
urls   = ["https://mirrors.edge.kernel.org/pub/linux/utils/kbd/kbd-$VERSION.tar.xz"]
sha256 = "6e5ca4f8d76ee9e3a8db700b667f13e12aac9933828a64e1aaad93d26be9b479"

[dependencies.aarch64]
runtime = ["glibc"]
# gettext 是 NLS 要的，而 0012 第 2 条禁止 `--disable-nls`（中文优先），
# 所以它必须在这儿 —— kbd 自带 zh_CN 的 .mo。
# pkgconf 是 configure.ac 里那些 PKG_CHECK_MODULES 要的（PAM/zlib/lzma/…）。
#   那几项【都是可选的】（两侧都给了 yes/no），缺了不失败、只是少功能；
#   而 PKG_CHECK_MODULES 本身要 pkg-config 在场才展开得了。
build   = ["make", "gcc", "gettext", "pkgconf"]
[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc", "gettext", "pkgconf"]

[build]
type      = "autotools"
configure = [
    "--prefix=/usr",
    # ★★ 必须显式关掉 vlock —— 这一条是第一轮构建（5 秒就挂）教我的。
    #
    #   我第一次写这个配方时的判断是错的：我看了 configure.ac 里那串
    #   PKG_CHECK_MODULES，看到 PAM / zlib / bzip2 / lzma / zstd / xkbcommon
    #   每一项都给了 `[HAVE_X=yes], [HAVE_X=no]` 两侧，于是写下一句
    #   "缺了不失败、只是少功能"—— **而 PAM 那条不成立**：
    #
    #       AC_ARG_ENABLE([vlock], …, [VLOCK_PROG=yes])      ← 默认【开】
    #       AS_IF([test "$VLOCK_PROG" = "yes"], [            ← 整段都在这层 if 里
    #           PKG_CHECK_MODULES(PAM, pam, …)
    #           AS_IF([… "$HAVE_PAM" != yes …], [
    #               AC_MSG_ERROR([libpam-devel required.])   ← 就死在这儿
    #           ])
    #       ])
    #
    #   所以不关 vlock，PAM 就是【必需】的。而它的失败长这样（第 55/89 个包，
    #   0 分 05 秒）：
    #
    #       checking for pam... no
    #       configure: error: libpam-devel required.
    #
    #   ★ 而 vlock 是"锁虚拟终端"那个东西 —— 我们这条路上（init=/init 起一个
    #     shell、SSH 进来）用不到它，关掉没有任何损失。
    #
    #   ★ 教训：**"两侧都给了"不等于"可缺"** —— 得看那层 `if` 的默认值。
    #     PAM 那一段我扫过去的时候正是漏了 `VLOCK_PROG=yes` 这一行。
    "--disable-vlock",
    # 不写 `--disable-nls`：0012 第 2 条禁止它（中文优先），kbd 自带 zh_CN 的 .mo。
]
