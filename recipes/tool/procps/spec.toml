# procps —— ps / top / free / kill / pgrep …
#
# 【为什么它排第一档】
#
# 没有它，进程是【黑盒】：只能翻 /proc 一个个看。而服务器上最常问的两个问题
# 就是"什么在占 CPU"和"什么在吃内存"——ps 和 top 就是回答它们的。
#
# 顺带它还给 `kill`、`pgrep`、`pkill`、`uptime`、`sysctl` 这些。
#
# 上游在 GitLab（不在 GitHub）。配方写的是"哪个仓库的哪个 commit"，
# 不关心托管商是谁。

[package]
name        = "procps"
version     = "4.0.7"
release     = 1
date        = 2026-10-13T12:40:00Z
description = "进程与系统状态工具（ps · top · free · kill · pgrep）"
section     = "utils"
url         = "https://gitlab.com/procps-ng/procps"
license     = "GPL-2.0-or-later AND LGPL-2.1-or-later"

[[source]]
git     = "https://gitlab.com/procps-ng/procps.git"
commit  = "66b48a3720d46f304f0fa76f720ca925fa48d97e"
mirrors = ["https://github.com/warmchang/procps-ng"]

[dependencies]
runtime = ["glibc", "ncurses"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "gettext", "pkgconf"]

[dependencies.x86_64]
runtime = ["glibc", "ncurses"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "gettext", "pkgconf"]

[build]
type      = "autotools"
# 上游是 git 树，没有 configure —— 只有 configure.ac。现场生成。
autoreconf = true
configure = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    # ★ 它默认会去看 systemd 在不在，在的话装 systemd 单元。
    #   我们还没有 systemd，而且就算有，这个包也不该管那件事。
    "--with-systemd=no",
    # 不要 8-bit 的 watch（那是给老终端的）。
    "--without-watch8bit",
    "--disable-static",

    # ── NLS（gettext 翻译）关掉 ──
    #
    # ★ 这一条我一开始写错了成因，留着这段是因为错的那版很典型：
    #
    #   我原来写的是「gettext 的构建需要 autopoint 先跑一遍，而我们没跑」。
    #   **那是错的** —— 日志里明明写着：
    #
    #       Copying file po/Makefile.in.in            ← autopoint 跑了，生成了
    #       checking whether NLS is requested... no   ← --disable-nls 生效了
    #       config.status: creating po/Makefile.in    ← 也生成了
    #
    #   真正的成因在 procps 自己的 Makefile.am 里：
    #
    #       SUBDIRS = local po-man po testsuite
    #
    #   `po` 是【无条件】列着的。NLS 一关，gettext 生成的那份 po/Makefile
    #   就没有 all 目标，顶层 make 走进去就断
    #   （Making all in po / No rule to make target 'all'）。
    #
    #   修法在 steps.sh 里（把 po 从 SUBDIRS 摘掉）。
    #
    # ★ 而 NLS 关掉本身还有一层代价要记住：**它是"程序输出显示什么语言"的
    #   机制**。关掉意味着这些工具的报错信息是英文——这与「中文优先」是有
    #   张力的。修法在 0006（apk 自己的 i18n）那条线上。
    "--disable-nls",
]
