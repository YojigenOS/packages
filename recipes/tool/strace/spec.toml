# strace —— 看一个程序到底在干什么
#
# 【为什么它在第二档】
#
# 服务器上排障最有力的一件工具：「它明明应该读那个文件，为什么说没有？」
# strace 把系统调用依次打出来，答案就在里面。
#
# 【为什么关掉 mpers】
#
# mpers 是"同时支持 32 位和 64 位进程"那套。开着要 32 位的 libc 头文件
# （gcc-multilib 那种）。纯 64 位系统上用不到，而它会让构建直接失败。

[package]
name        = "strace"
version     = "7.2"
release     = 1
date        = 2026-10-13T12:40:00Z
description = "跟踪进程的系统调用与信号"
section     = "utils"
url         = "https://strace.io/"
license     = "LGPL-2.1-or-later"

[[source]]
git    = "https://github.com/strace/strace"
commit = "195ac8ddbf6fad16ff1ff125b0feb725b6c46dcf"

[dependencies]
runtime = ["glibc", "elfutils"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "gettext", "gawk"]
[dependencies.x86_64]
runtime = ["glibc", "elfutils"]
build   = ["make", "gcc", "autoconf", "automake", "libtool", "gettext", "gawk"]

[build]
type      = "autotools"
# ★ 不用驱动的 autoreconf —— strace 有自己的 bootstrap。
#
#   上游 INSTALL-git.md 里写着（原文）：
#
#       From the git repository root:
#           ./bootstrap
#       This generates the configure script and build system files.
#
#   而 bootstrap 跑的不是 autoreconf，是一串 gen_*.sh
#   （m4/gen_bpf_attr_m4.sh、src/generate_mpers_am.sh、src/xlat/gen.sh …）——
#   它们从模板生成 Makefile.am 之类。少了这一步，autoreconf 报的是：
#
#       autoreconf: error: 'configure.ac' is required
#
#   而 configure.ac 明明就在那儿 —— 那个报错指的方向是错的。
#
#   （这正是 less 那格学到的同一件事：**从 git 建的时候，先读上游的
#     README / INSTALL-git 之类。** tarball 和 git 是两条路，而上游通常
#     只在文档里说这件事，Makefile 和 configure.ac 里看不出来。
#     我在 less 的提交里写过这条，然后在 strace 上又猜了一遍 ✗）
autoreconf = false
configure = [
    "--prefix=/usr",
    # ★ 关掉 32/64 混合支持。开着要 32 位 libc，纯 64 位系统上没必要，
    #   而它会以"找不到 bits/wordsize.h 之类"的形式失败。
    "--enable-mpers=no",
    "--disable-static",

    # ── NLS（gettext 翻译）暂时关掉 ──
    #
    # ★ 这不是"不需要"，是"现在还不能要"，理由要写清楚：
    #
    #   gettext 的构建需要 autopoint 先跑一遍（它往 po/ 里放 Makefile.in.in）。
    #   我们的 autoreconf 流程没跑那一步，于是 procps 实测挂在：
    #
    #       Making all in po
    #       make[2]: *** No rule to make target 'all'.  Stop.
    #
    #   而【NLS 正是"程序输出显示什么语言"的机制】——关掉它意味着这些工具的
    #   报错信息是英文。这与「中文优先」那条要求是有张力的，所以记在这里，
    #   而不是悄悄关掉。修法在 0006（apk 自己的 i18n）那条线上。
    "--disable-nls",
]
