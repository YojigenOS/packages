# zstd —— Zstandard 压缩算法与工具
#
# 它本身值得进树（压缩率与速度都比 gzip 好，很多上游开始默认用它），而
# ccache 4.x 起强制要求它——那是它进这一批的直接原因。

[package]
name        = "zstd"
version     = "1.5.7"
release     = 1
date        = 2026-10-10T16:43:00Z
description = "Zstandard 压缩算法与命令行工具"
section     = "base"
url         = "https://github.com/facebook/zstd"
license     = "BSD-3-Clause OR GPL-2.0-only"

[[source]]
# 写「哪个仓库的哪个 commit」，不写托管商的链接——
# 链接格式各托管不同（GitHub 是 codeload，Gitea 是 /archive/<sha>，
# GitLab 又是另一种），那是驱动的事，不该让配方作者记。
# 校验由 git 自己完成：commit hash 就是那棵树的内容哈希，比 sha256
# 更强——sha256 钉的是一份字节，而不同托管的归档字节可以不一样。
git     = "https://github.com/facebook/zstd"
commit  = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc"]

[build]
# 它没有 configure，也没有顶层 CMakeLists——就是一个 Makefile。
type = "custom"
