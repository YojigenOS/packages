# usbutils —— USB 设备查看（lsusb）
#
# ★ 对标 Fedora Server 的 comps（core / standard 两组）补进来的（2026-10-25）。
#   这些是"一台能用的服务器该有"的东西，而 Fedora 和 Debian 都有。
#
# ★★ 判据（YG 定的第 1 条）：**基础包要全。**
#   一个系统缺 `lspci` 或 `traceroute`，不是"精简"，是"查不了问题"。

[package]
name        = "usbutils"
version     = "018"
release     = 1
date        = 2026-10-25T00:00:00Z
description = "USB 设备查看（lsusb）"
url         = "https://www.kernel.org/"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://mirrors.edge.kernel.org/pub/linux/utils/usb/usbutils/usbutils-$VERSION.tar.xz"
sha256 = "83f68b59b58547589c00266e82671864627593ab4362d8c807f50eea923cad93"

[dependencies.aarch64]
runtime = ['glibc', 'libusb']
build   = ['make', 'gcc', 'pkgconf']

[dependencies.x86_64]
runtime = ['glibc', 'libusb']
build   = ['make', 'gcc', 'pkgconf']

[build]
# ★ usbutils 018 用的是 **meson**，不是 autotools（实测解包看过）。
#   而我第一版照 autotools 模板生成 —— 那会在构建时找不到 ./configure。
type = "meson"
