# cryptsetup —— LUKS 磁盘加密
#
# ★ 第 4 期补的（2026-10-26）。它是 B 类里依赖最重的一个，但也是
#   **"一台服务器该不该有"的答案最明确的**：全盘加密是标准运维实践，
#   而 LUKS 是 Linux 上的唯一标准格式。
#
# ★★★ 而它同时解开 systemd 的一个开关：`-Dlibcryptsetup=false`。
#   那个开关关着的时候，systemd 不能读 /etc/crypttab —— 也就是
#   **开机自动解锁加密盘**这件事做不到。那是这一期最实质的收益。
#
# ★ 它用 **meson**（实测：meson_options.txt + meson.build）。
#
# ★★ 依赖（都是默认值，一个都不显式关）：
#
#   crypto-backend = 'openssl'   ← 默认就是它，我们有
#   blkid = true                 ← util-linux 提供（libblkid）
#   argon-implementation = 'internal'  ← 内置 Argon2，不需要 libargon2
#   external-tokens = true       ← LUKS2 的 token 机制
#
# ★★★ 而 `libdevmapper` 是**硬依赖，没有开关**（2026-10-26 撞到的）。
#
#   我原来在注释里写"`-Dlibdevmapper=false` 可以关掉" —— **那是凭记忆写的，
#   这个版本的 cryptsetup 根本没有那个选项**。实测 meson.build 第 366-380 行：
#
#       devmapper = dependency('devmapper', required: false)
#       if not devmapper.found()
#           devmapper = cc.find_library('devmapper')
#           assert(cc.has_function('dm_task_set_name', …),
#                  'You need the device-mapper library.')
#
#   那是 `assert()`，无条件。所以只能装它（lib/libdevmapper，从 LVM2 源码树
#   只编 libdm 那一层）。

[package]
name        = "cryptsetup"
version     = "2.8.8"
release     = 1
date        = 2026-10-26T00:00:00Z
description = "LUKS 磁盘加密（cryptsetup）"
url         = "https://gitlab.com/cryptsetup/cryptsetup"
license     = "GPL-2.0-or-later"

[[source]]
url    = "https://gitlab.com/cryptsetup/cryptsetup/-/archive/v$VERSION/cryptsetup-v$VERSION.tar.gz"
sha256 = "3aa3bb45472b5de8169b58260b2d59e55557c2c0e210f044fe9148da344db1e0"

[dependencies.aarch64]
runtime = ["glibc", "openssl", "popt", "json-c", "util-linux", "libdevmapper"]
build   = ["meson", "ninja", "gcc", "pkgconf", "util-linux", "json-c", "libdevmapper"]

[dependencies.x86_64]
runtime = ["glibc", "openssl", "popt", "json-c", "util-linux", "libdevmapper"]
build   = ["meson", "ninja", "gcc", "pkgconf", "util-linux", "json-c", "libdevmapper"]

[build]
type = "meson"
# ★★ `-Dasciidoc=auto`（2026-10-26）。
#
#   上游 `meson_options.txt` 里 `asciidoc` 的默认值是 **`enabled`**，而
#   meson.build 第 127 行是：
#
#       if opt_asciidoc.enabled() and not asciidoc.found()
#           error('Building man pages requires asciidoctor installed.')
#       endif
#
#   于是没有 asciidoctor 就**硬报错**。
#
# ★ 而 `auto` 是上游自己给的选项（`type: 'feature'` 的第三个："缺了就跳过"）。
#   改成 auto 不是"关功能" —— 是"有 asciidoctor 就编 man page，没有就跳过"，
#   而那正是 `feature` 类型存在的意义。
#
#   ★ 为什么不装 asciidoctor：它是 Ruby 写的，要拖进整个 Ruby 运行时
#     （~50MB）。为一个 man page 生成器付那个代价不划算 —— 而
#     `cryptsetup --help` 本身已经把所有选项说全了。
configure = [
    "-Dasciidoc=auto",
    # ★★ `-Dssh-token=false`（2026-10-26）。
    #
    #   那是 **LUKS2 的"用 SSH 服务器解锁"token** —— 一个可选插件：
    #   你把密钥托管到一台 SSH 服务器上，开机时通过 SSH 取回。
    #
    #   而它要 `libssh`（另加 argp）。实测 meson.build 第 430-437 行：
    #
    #       if get_option('ssh-token')
    #           libssh = dependency('libssh')      ← 无 required:false
    #       endif
    #
    #   ★ 关掉它不影响核心能力：LUKS 的加解密、密钥槽、/etc/crypttab
    #     自动解锁全都不走这条路。**它不是"功能缺失"，是"没装那个插件"。**
    #     （对比：libdevmapper 那个没有开关，所以只能装 —— 两者不一样。）
    #
    #   ★★ 判据：**"有没有开关"决定判断方式** ——
    #     有开关的（ssh-token / asciidoc）看"关掉它损失什么"；
    #     没开关的（devmapper）只能装，或者不做这个包。
    "-Dssh-token=false",
]
