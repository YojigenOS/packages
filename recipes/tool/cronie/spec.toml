# cronie —— 定时任务（cron 守护进程 + crontab）
#
# 【为什么它是"服务器化"那一档的】
#
# 没有它，`logrotate` 就没有人来调 —— 而后者是防止 /var/log 把盘填满的东西。
# 也就是说这两个是一对：cronie 提供"何时做"，logrotate 提供"做什么"。
#
# 它同时是 `crontab` 命令的来源 —— 那才是日常用得最多的那一个。

[package]
name        = "cronie"
version     = "1.7.2"
release     = 1
date        = 2026-10-13T17:00:00Z
description = "定时任务（cron 守护进程 + crontab）"
section     = "system"
url         = "https://github.com/cronie-crond/cronie"
license     = "ISC AND BSD-2-Clause AND BSD-3-Clause AND MIT"

[[source]]
git    = "https://github.com/cronie-crond/cronie"
commit = "71894fee3c74f3787e77f21a24fbbe0dffb59e7f"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]
[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc", "autoconf", "automake", "libtool"]

[build]
type       = "autotools"
autoreconf = true

# ★★ 按 C17 编，不是默认的 C23。
#
#   实测：
#
#       src/entry.c:488: error: too many arguments to function 'error_func';
#                              expected 0, have 1
#
#   而来路是 C23 改了 `()` 的含义。老代码这样声明函数指针：
#
#       entry *load_entry(FILE *file, void (*error_func) (), …)
#                                              ~~~~~~~~~~~~
#   那个空的 `()` 在 C17 及以前是【参数未指定】，而 C23 起是【没有参数】。
#   于是 `(*error_func)(…)` 就成了"给一个不要参数的函数传参数"。
#
#   ★ 这和 procps 那次是同一类（`false` 没 include、C23 里 false 是关键字）：
#     **代码比标准老，而编译器默认跑在新标准上。**
#
#   本地拿最小例子验过两个方向：
#       C23（默认）  报错，和 CI 里那句一样
#       -std=gnu17   ✓ 过
#
#   选 gnu17 而不是打补丁改那个声明：那是个老项目里常见的写法，
#   一处改了下一处还会撞（而 cronie 里不止一处）。
cflags     = ["-std=gnu17"]
configure  = [
    "--prefix=/usr",
    "--sysconfdir=/etc",
    "--localstatedir=/var",

    # ★ 关掉 SELinux 和 audit —— 两个都没有。
    #   上游的 SELinux 那条是硬报错（AC_MSG_ERROR），所以必须显式关。
    "--without-selinux",
    "--without-audit",

    # ★ inotify 是唯一【要留着】的可选件：cronie 靠它知道 crontab 文件改了，
    #   没有的话就得等它下一轮重新读盘。而 inotify 是内核的一部分，
    #   没有额外的库依赖。
    "--with-inotify",

    "--disable-nls",
]
