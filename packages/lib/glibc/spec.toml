# glibc —— GNU C 库
#
# 工具链的最后一块，也是地基。它提供动态链接器
# （ld-linux-aarch64.so.1）和 libc，并定义运行时库的搜索路径——
# 和 docs/决策记录/0001 的 /usr/lib 布局直接相关。
#
# 这个包的构建有个特点值得注意：binutils、gcc、linux-headers 都已经不在
# host/provides.txt 里了，所以它们会被 sysroot 叠进构建环境。也就是说，
# glibc 是**用我们自己的工具链和内核头文件构建出来的**——这正是自举该有的
# 样子，也是 glibc 之前那些包没有经历过的。

[package]
name        = "glibc"
version     = "2.44"
release     = 1
date        = 2026-10-10T15:00:00Z
description = "GNU C 库：动态链接器与标准 C 库"
section     = "core"
url         = "https://www.gnu.org/software/libc/"
license     = "LGPL-2.1-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/glibc/glibc-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/glibc/glibc-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/glibc/glibc-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/glibc/glibc-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/glibc/glibc-$VERSION.tar.xz",
]
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"

[dependencies]
# 运行时依赖 filesystem：每个 ELF 里写死的 interpreter 路径是
# /lib/ld-linux-aarch64.so.1，而加载器实际装在 /usr/lib —— 靠
# filesystem 提供的 /lib → usr/lib 链接才解析得到。
runtime = ["filesystem"]
build   = ["make", "linux-headers", "binutils", "gcc", "bison", "python3"]

[dependencies.x86_64]
runtime = ["filesystem"]
build   = ["make", "linux-headers", "binutils", "gcc", "bison", "python3"]

[build]
type = "autotools"
# glibc 自己就拒绝在源码目录里 configure，必须离开源码树
out_of_tree = true
configure = [
  "--prefix=/usr",
  "--libdir=/usr/lib",
  "--with-headers=/usr/include",
  "--disable-werror",
  # 最低支持的运行时内核版本。取 5.4（LTS）：比它旧的内核不保证可用，
  # 比它新的都能用。
  "--enable-kernel=5.4",

  # ★ 显式打开 CET（Intel 控制流保护）。
  #
  # 驱动的加固参数里，x86_64 会加 -fcf-protection=full。而 glibc 的 configure
  # 会检测「编译器是否默认开 CET」（configure 里的 libc_cv_compiler_default_cet），
  # 那个检测说不开 → 于是不编 sysdeps/x86/dl-cet.c → 但别的文件因为
  # -fcf-protection=full 引用了 _dl_cet_*，链接时全部找不到：
  #
  #     /usr/bin/ld: librtld.os: undefined reference to `_dl_cet_check'
  #     /usr/bin/ld: ld.so.new: hidden symbol `_dl_cet_open_check' isn't defined
  #     /usr/bin/ld: final link failed: bad value
  #
  # **加固参数本身没错，错的是它没被 configure 看见。** 显式打开，
  # 检测和构建就一致了——加固照旧，只是让它自洽。
  #
  # 实测只在 x86_64 上出现（CET 是 Intel 的特性）。但 --enable-cet 是 glibc
  # 的通用 configure 选项（configure 第 1494 行声明的），aarch64 传它无害。
  "--enable-cet",
]

# ---------------------------------------------------------------- 子包
#
# glibc 装出来的东西分成三类，用途完全不同：
#
#   运行时        libc.so.6、ld-linux、gconv/nss 模块、ldd 这类工具
#   开发文件      头文件、静态库、链接脚本、locale 源数据       ≈ 27 MB
#   生成的 locale  三个 locale 的数据                          ≈ 9 MB
#
# 一个容器基础镜像只要第一类。所以拆开——`base` 因此少 36 MB，而
# `glibc-dev` 只在 `base-devel` 里，`glibc-locales` 只在要中文的系统里。
#
# **只搬真正占体积的东西。** /usr/lib 下还有一批不带版本号的 .so，它们是
# 链接期的符号链接（libnss_db.so → libnss_db.so.2）——但里面混着两个真的
# ELF（libmemusage.so、libpcprofile.so，LD_PRELOAD 用），而模式匹配没法
# 区分「符号链接」和「真 ELF」。它们合计不到几 KB，留在主包里零代价，
# 而写一条会误伤运行时的规则代价很大。

[[subpackage]]
name        = "glibc-dev"
description = "glibc 开发文件：头文件、静态库、链接脚本、locale 源数据"
section     = "devel"
files = [
  "usr/include/",
  "usr/lib/*.a",
  "usr/lib/*.o",
  # 链接脚本（内容是 GROUP ( /usr/lib/libc.so.6 ... )），只有链接器看得懂
  "usr/lib/libc.so",
  "usr/lib/libm.so",
  # locale 源数据：604 个文件、16 MB，只有 localedef 生成新 locale 时才用
  "usr/share/i18n/",
]

[[subpackage]]
name        = "glibc-locales"
description = "生成的 locale 数据：zh_CN / zh_TW / en_US"
section     = "localization"
files = ["usr/lib/locale/"]
