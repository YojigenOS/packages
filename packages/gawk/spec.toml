# gawk —— GNU awk，文本处理语言

[package]
name        = "gawk"
version     = "5.4.1"
release     = 1
date        = 2026-10-10T06:39:13Z
description = "GNU awk，文本处理语言"
section     = "base"
url         = "https://www.gnu.org/software/gawk/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/gawk/gawk-$VERSION.tar.xz"
sha256 = "07f6f7342b7febe4313fc2c2542ad93d64fe20ad8717200109f105a826f5fd37"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gettext"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext"]

[build]
type      = "autotools"
configure = ["--prefix=/usr"]
