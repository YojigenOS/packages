# mpc —— 复数目标准确舍入运算库
#
# 链条末端：同时依赖 gmp 和 mpfr。它构建成功后，gcc 的全部
# 前置依赖就齐了。

[package]
name        = "mpc"
version     = "1.4.1"
release     = 1
date        = 2026-10-10T04:36:35Z
description = "复数目标准确舍入运算库"
section     = "libs"
url         = "https://www.multiprecision.org/mpc/"
license     = "LGPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/mpc/mpc-$VERSION.tar.xz"
sha256 = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"

[dependencies]
runtime = ["glibc", "gmp", "mpfr"]
build   = ["make", "gmp", "mpfr", "gcc"]

[dependencies.x86_64]
runtime = ["glibc", "gmp", "mpfr"]
build   = ["make", "gmp", "mpfr", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--enable-shared"]
