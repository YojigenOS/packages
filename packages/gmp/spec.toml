# gmp —— 任意精度算术库
#
# gcc 的前置依赖之一。这条链是嵌套的，不是并列的：
#     gmp  →  mpfr  →  mpc  →  gcc
# 所以它也是检验依赖机制的更好用例。

[package]
name        = "gmp"
version     = "6.3.0"
release     = 1
date        = 2026-10-10T04:36:35Z
description = "任意精度算术库"
section     = "libs"
url         = "https://gmplib.org/"
license     = "LGPL-3.0-or-later OR GPL-2.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/gmp/gmp-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/gmp/gmp-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/gmp/gmp-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/gmp/gmp-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/gmp/gmp-$VERSION.tar.xz",
]
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc"]

[build]
# C23 改了 `()` 的含义：从「参数未知」变成「零参数」。gmp 6.3.0 的 configure
# 里有一段 2003 年的 K&R 测试代码，于是它判定「没有可用的编译器」：
#
#     void g(){}                      ← C23 里这是「零参数」
#     g(i,d[i].src,d[i].n,got,...);   ← 传参数成了编译错误
#
# GCC 15 起默认就是 C23。这是语言标准的破坏性变更，不是 gmp 的 bug。
# 项目保持 gnu23（新代码该用新标准），不兼容的包【按包声明】回退。
cflags = ["-std=gnu17"]
type      = "autotools"
configure = ["--prefix=/usr", "--enable-shared"]
