# coreutils —— 核心文件与文本工具（ls、cp、cat、mkdir…）

[package]
name        = "coreutils"
version     = "9.12"
release     = 1
date        = 2026-10-10T06:39:12Z
description = "核心文件与文本工具（ls、cp、cat、mkdir…）"
section     = "base"
url         = "https://www.gnu.org/software/coreutils/"
license     = "GPL-3.0-or-later"

[[source]]
url    = "https://ftp.gnu.org/gnu/coreutils/coreutils-$VERSION.tar.xz"
# 备用源：同一份字节的镜像（sha256 会校验，所以换源不降低信任）。
# 顺序按实测速度。选源标准和完整说明见 docs/配方约定.md「备用源」一节。
urls = [
  "https://mirrors.ustc.edu.cn/gnu/coreutils/coreutils-$VERSION.tar.xz",
  "https://mirror.nju.edu.cn/gnu/coreutils/coreutils-$VERSION.tar.xz",
  "https://mirrors.tuna.tsinghua.edu.cn/gnu/coreutils/coreutils-$VERSION.tar.xz",
  "https://mirrors.aliyun.com/gnu/coreutils/coreutils-$VERSION.tar.xz",
]
sha256 = "a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc"]

[build]
type      = "autotools"
configure = ["--prefix=/usr"]
