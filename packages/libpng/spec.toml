# libpng —— PNG 图像格式参考库
#
# 这个包的用处是验证依赖机制：它构建时需要 zlib，而 zlib 是 YojigenOS
# 自己构建的（不在 host/provides.txt 里），所以只能靠 sysroot 传递。

[package]
name        = "libpng"
version     = "1.6.59"
release     = 1
date        = 2026-10-10T05:26:32Z
description = "PNG 图像格式参考库"
section     = "libs"
url         = "http://www.libpng.org/pub/png/libpng.html"
license     = "libpng-2.0"

[[source]]
# 注意：libpng 的 1.7.x 目前仍是 beta（beta89），稳定线是 1.6.x。
# 这里刻意跟稳定线，不跟 1.7 的 beta。
url    = "https://download.sourceforge.net/libpng/libpng-$VERSION.tar.gz"
sha256 = "86a3e4b501f7f50e392c4e456ea158893e9a595b1c63eb88c7bb9f6cf8772dad"

[dependencies]
runtime = ["glibc", "zlib"]
build   = ["zlib"]

[dependencies.x86_64]
runtime = ["glibc", "zlib"]
build   = ["zlib"]

[build]
type      = "autotools"
configure = ["--prefix=/usr", "--disable-static"]
