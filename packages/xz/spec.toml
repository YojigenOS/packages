# xz —— XZ Utils：xz 压缩工具与 liblzma

[package]
name        = "xz"
version     = "5.8.4"
release     = 1
date        = 2026-10-10T16:40:00Z
description = "XZ Utils：xz 压缩工具与 liblzma"
section     = "base"
url         = "https://github.com/tukaani-project/xz/releases/download/v$VERSION/xz-$VERSION.tar.xz"
license     = "GPL-3.0-or-later"

[[source]]
# 上游自己的 git 服务器优先——GitHub 上那份是它的镜像。
# 写「哪个仓库的哪个 commit」，不写托管商的链接——
# 链接格式各托管不同（GitHub 是 codeload，Gitea 是 /archive/<sha>，
# GitLab 又是另一种），那是驱动的事，不该让配方作者记。
# 校验由 git 自己完成：commit hash 就是那棵树的内容哈希，比 sha256
# 更强——sha256 钉的是一份字节，而不同托管的归档字节可以不一样。
git     = "https://git.tukaani.org/xz.git"
commit  = "d3e650e63c110e830fd5391e7f8b45df0b91d3da"
mirrors = ["https://github.com/tukaani-project/xz"]

[dependencies]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc", "autoconf", "automake", "libtool"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gettext", "gcc", "autoconf", "automake", "libtool"]

[build]
type      = "autotools"
# git 树里没有 configure，现场生成（见 docs/配方约定.md）
autoreconf = true
configure = ["--prefix=/usr"]
