# zstd —— Zstandard 压缩算法与工具
#
# 它本身值得进树（压缩率与速度都比 gzip 好，很多上游开始默认用它），而
# ccache 4.x 起强制要求它——那是它进这一批的直接原因。

[package]
name        = "zstd"
version     = "1.5.7"
release     = 1
date        = 2026-10-10T16:43:00Z
description = "Zstandard 压缩算法与命令行工具"
section     = "base"
url         = "https://github.com/facebook/zstd"
license     = "BSD-3-Clause OR GPL-2.0-only"

[[source]]
# ★ 用 commit，不用 release 附件：附件可以被替换和删除，commit 不能。
# sha256 仍要，因为 GitHub 按需生成 tarball，字节不保证稳定。
url    = "https://codeload.github.com/facebook/zstd/tar.gz/f8745da6ff1ad1e7bab384bd1f9d742439278e99"
urls = [
  "https://github.com/facebook/zstd/archive/f8745da6ff1ad1e7bab384bd1f9d742439278e99.tar.gz",
]
sha256 = "4b0bd1f0cfb25e61b9103c35f27395530ff5b4c0d2513a00fd745849e85ea52c"

[dependencies]
runtime = ["glibc"]
build   = ["make", "gcc"]

[dependencies.x86_64]
runtime = ["glibc"]
build   = ["make", "gcc"]

[build]
# 它没有 configure，也没有顶层 CMakeLists——就是一个 Makefile。
type = "custom"
