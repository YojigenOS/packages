# ccache —— 编译器缓存
#
# 目的是让构建环境（base-devel）里带它。没有它的时候，全量重建里 glibc 单独
# 一步就要 347 秒；有它、且缓存是热的，是 82 秒——4.2 倍。
#
# 它要 zstd（4.x 起强制），自己用 cmake 构建。所以这一批是三个包：
#
#     zstd  →  cmake  →  ccache
#
# ## 一个值得记下来的发现
#
# 我原本担心：ccache 的缓存键是按「编译器 + 参数 + 源文件 + 头文件」算的，
# **不含汇编器**。那么刚补好的 binutils 依赖就不会让它重新编译——它会回放
# 用 Debian 的 as 2.44 编出来的旧目标文件，把那个 bug 重新藏起来。
#
# 实测**不是这样**。依赖修好前后（都开着 ccache）产出的 hello 二进制不同，
# 说明 ccache 确实重新编译了。它认得出来环境变了。

[package]
name        = "ccache"
version     = "4.14.1"
release     = 1
date        = 2026-10-10T16:42:00Z
description = "编译器缓存：把重复编译的结果存下来复用"
section     = "devel"
url         = "https://ccache.dev/"
license     = "GPL-3.0-or-later"

[[source]]
# 写「哪个仓库的哪个 commit」，不写托管商的链接——
# 链接格式各托管不同（GitHub 是 codeload，Gitea 是 /archive/<sha>，
# GitLab 又是另一种），那是驱动的事，不该让配方作者记。
# 校验由 git 自己完成：commit hash 就是那棵树的内容哈希，比 sha256
# 更强——sha256 钉的是一份字节，而不同托管的归档字节可以不一样。
git     = "https://github.com/ccache/ccache"
commit  = "c67954b7729c2a7a350c80e7634d704b669307dc"

[dependencies]
# xxhash 和 zstd 都是运行时的：ccache 链接它们。
runtime = ["glibc", "zstd", "xxhash"]
build   = ["make", "gcc", "cmake", "zstd", "xxhash"]

[dependencies.x86_64]
runtime = ["glibc", "zstd", "xxhash"]
build   = ["make", "gcc", "cmake", "zstd", "xxhash"]

[build]
type = "cmake"
configure = [
  "-DCMAKE_INSTALL_PREFIX=/usr",
  "-DCMAKE_BUILD_TYPE=Release",
  "-DENABLE_TESTING=OFF",           # 测试要 doctest，没有
  "-DENABLE_DOCUMENTATION=OFF",     # 文档要 asciidoctor，没有
  "-DREDIS_STORAGE_BACKEND=OFF",    # 远程存储要 hiredis，没有也不需要

  # ★ 只用本地依赖，永不下载。
  #
  # 第一次构建时它报了「Downloading Xxhash from the internet since Xxhash
  # was not found locally and DEPS=AUTO」，然后去拉
  # https://github.com/Cyan4973/xxhash/archive/refs/tags/v0.8.3.tar.gz ——
  # 正是配方约定里禁止的 tag 归档。
  #
  # 那次它**失败了**，因为我们的 cmake 是 -DCMAKE_USE_OPENSSL=OFF 编的，
  # 没有 HTTPS 能力。那是个幸运的意外，不是设计。等 cmake 带上 openssl，
  # 这个防线就没了——那时它会悄悄拉一份 tag 归档进来构建，产物不可复现。
  #
  # 所以显式堵死。ccache 的 DEPS 有三个取值：AUTO / DOWNLOAD / LOCAL。
  "-DDEPS=LOCAL",
]
